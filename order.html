<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>Order Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Poppins',sans-serif;background:#F5F7FB;color:#1A2B3C;padding-bottom:90px;}
.hdr{background:linear-gradient(135deg,#1A2B3C,#0D1A2B);padding:20px 16px 16px;color:#fff;position:sticky;top:0;z-index:50;box-shadow:0 4px 20px rgba(0,0,0,.15);}
.hdr-top{display:flex;align-items:center;gap:10px;}
.hdr-logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#FFD166,#F5A623);display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;}
.hdr-info{flex:1;min-width:0;}
.rest-name{font-size:1.05rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rest-sub{font-size:.72rem;color:rgba(255,255,255,.5);margin-top:1px;}
.table-pill{background:rgba(255,209,102,.15);border:1px solid rgba(255,209,102,.3);color:#FFD166;padding:5px 12px;border-radius:20px;font-size:.75rem;font-weight:700;white-space:nowrap;}
.hdr-status{margin-top:10px;font-size:.7rem;color:rgba(255,255,255,.4);display:flex;align-items:center;gap:5px;}
.sdot{width:6px;height:6px;border-radius:50%;background:#00C896;}

/* CATEGORY TABS */
.cat-tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;background:#fff;border-bottom:1px solid #EEF1F6;position:sticky;top:82px;z-index:40;scrollbar-width:none;}
.cat-tabs::-webkit-scrollbar{display:none;}
.cat-tab{padding:7px 16px;border-radius:20px;border:1.5px solid #E2E8F5;background:#fff;font-size:.8rem;font-weight:600;color:#6B7A99;white-space:nowrap;cursor:pointer;flex-shrink:0;}
.cat-tab.active{background:#1A2B3C;color:#FFD166;border-color:#1A2B3C;}

/* MENU LIST */
.menu-wrap{padding:14px 16px;}
.menu-item{background:#fff;border:1px solid #EEF1F6;border-radius:16px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;}
.mi-info{flex:1;min-width:0;}
.mi-name{font-size:.92rem;font-weight:700;color:#1A2B3C;}
.mi-desc{font-size:.72rem;color:#9CA3AF;margin-top:2px;line-height:1.4;}
.mi-price{font-size:.9rem;font-weight:800;color:#00A878;margin-top:6px;}
.mi-veg{width:14px;height:14px;border:1.5px solid #16A34A;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;margin-right:5px;}
.mi-veg::after{content:'';width:6px;height:6px;border-radius:50%;background:#16A34A;}
.mi-veg.nonveg{border-color:#DC2626;}
.mi-veg.nonveg::after{background:#DC2626;}
.mi-add{flex-shrink:0;}
.qty-btn{width:32px;height:32px;border-radius:9px;border:none;background:#1A2B3C;color:#FFD166;font-weight:800;font-size:1rem;cursor:pointer;}
.add-btn{padding:8px 18px;border-radius:9px;border:1.5px solid #00A878;background:#fff;color:#00A878;font-weight:700;font-size:.8rem;cursor:pointer;}
.qty-ctrl{display:flex;align-items:center;gap:8px;background:#1A2B3C;border-radius:9px;padding:4px;}
.qty-ctrl .qty-btn{width:26px;height:26px;background:transparent;font-size:.9rem;}
.qty-num{color:#fff;font-weight:700;font-size:.85rem;min-width:16px;text-align:center;}

.empty-menu{text-align:center;padding:60px 20px;color:#9CA3AF;}
.empty-menu-ic{font-size:2.5rem;margin-bottom:10px;}

/* CART FLOATING BAR */
.cart-bar{position:fixed;bottom:16px;left:16px;right:16px;background:linear-gradient(135deg,#00A878,#00C896);border-radius:16px;padding:14px 18px;display:none;align-items:center;justify-content:space-between;box-shadow:0 10px 30px rgba(0,168,120,.35);z-index:60;cursor:pointer;}
.cart-bar.show{display:flex;}
.cart-info{color:#fff;}
.cart-count{font-size:.72rem;opacity:.85;}
.cart-total{font-size:1.1rem;font-weight:800;}
.cart-cta{background:rgba(255,255,255,.2);color:#fff;padding:8px 16px;border-radius:10px;font-size:.82rem;font-weight:700;}

/* CART MODAL */
.overlay{position:fixed;inset:0;background:rgba(10,15,25,.55);z-index:100;display:none;align-items:flex-end;}
.overlay.show{display:flex;}
.sheet{background:#fff;width:100%;max-height:85vh;border-radius:22px 22px 0 0;overflow-y:auto;animation:slideUp .3s ease;}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:40px;height:4px;background:#E2E8F5;border-radius:4px;margin:10px auto;}
.sheet-hdr{padding:6px 20px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #F1F5F9;}
.sheet-title{font-size:1.1rem;font-weight:800;}
.sheet-close{width:30px;height:30px;border-radius:50%;background:#F5F7FB;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#6B7A99;font-size:1rem;}
.sheet-body{padding:14px 20px;}
.cart-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F7F9FB;}
.cart-row-name{flex:1;font-size:.85rem;font-weight:600;}
.cart-row-price{font-size:.82rem;font-weight:700;color:#00A878;width:60px;text-align:right;}
.total-row{display:flex;justify-content:space-between;padding:14px 0;font-size:1.05rem;font-weight:800;border-top:2px solid #1A2B3C;margin-top:6px;}
.note-inp{width:100%;padding:11px 14px;border-radius:11px;border:1.5px solid #E2E8F5;font-family:inherit;font-size:.85rem;margin-top:10px;outline:none;}
.note-inp:focus{border-color:#00A878;}
.place-btn{width:100%;padding:15px;border-radius:13px;border:none;background:linear-gradient(135deg,#00A878,#00C896);color:#fff;font-weight:800;font-size:.95rem;margin-top:14px;cursor:pointer;box-shadow:0 8px 24px rgba(0,168,120,.3);}
.place-btn:disabled{opacity:.5;}

/* CONFIRMATION SCREEN */
.confirm-screen{position:fixed;inset:0;background:linear-gradient(135deg,#0A2E1A,#0D3D22);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;color:#fff;}
.confirm-screen.show{display:flex;}
.confirm-ic{width:90px;height:90px;border-radius:50%;background:rgba(0,200,150,.15);border:3px solid #00C896;display:flex;align-items:center;justify-content:center;font-size:2.5rem;margin-bottom:20px;animation:pop .4s ease;}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.confirm-title{font-size:1.3rem;font-weight:800;margin-bottom:8px;}
.confirm-sub{font-size:.85rem;color:rgba(255,255,255,.55);line-height:1.6;max-width:280px;}
.confirm-status{margin-top:24px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:14px 20px;font-size:.8rem;display:flex;align-items:center;gap:8px;}
.pulse-dot{width:8px;height:8px;border-radius:50%;background:#FFD166;animation:blink 1.2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.new-order-btn{margin-top:20px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;padding:10px 20px;border-radius:10px;font-size:.82rem;font-weight:600;cursor:pointer;}

.loading-screen{position:fixed;inset:0;background:#1A2B3C;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:14px;}
.spin{width:36px;height:36px;border:3px solid rgba(255,209,102,.2);border-top-color:#FFD166;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.powered{text-align:center;padding:16px;font-size:.65rem;color:#B8C2D6;}
</style>
</head>
<body>

<div class="loading-screen" id="loading">
  <div class="spin"></div>
  <div style="font-size:.85rem;color:rgba(255,255,255,.6)">Menu load ho raha hai...</div>
</div>

<div class="hdr" id="hdr" style="display:none">
  <div class="hdr-top">
    <div class="hdr-logo">🍽️</div>
    <div class="hdr-info">
      <div class="rest-name" id="rest-name">Restaurant</div>
      <div class="rest-sub" id="rest-sub">Digital Menu</div>
    </div>
    <div class="table-pill" id="table-pill">Table</div>
  </div>
  <div class="hdr-status"><div class="sdot"></div>Menu is live — order directly from here</div>
</div>

<div class="cat-tabs" id="cat-tabs" style="display:none"></div>
<div class="menu-wrap" id="menu-wrap"></div>

<div class="cart-bar" id="cart-bar" onclick="openCart()">
  <div class="cart-info">
    <div class="cart-count" id="cart-count">0 items</div>
    <div class="cart-total" id="cart-total-lbl">Rs.0</div>
  </div>
  <div class="cart-cta">View Cart →</div>
</div>

<div class="overlay" id="cart-overlay" onclick="if(event.target===this)closeCart()">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-hdr">
      <div class="sheet-title">Your Order</div>
      <div class="sheet-close" onclick="closeCart()">✕</div>
    </div>
    <div class="sheet-body">
      <div id="cart-items"></div>
      <div class="total-row"><span>Total</span><span id="cart-final-total">Rs.0</span></div>
      <input class="note-inp" id="order-note" placeholder="Special instructions (optional)"/>
      <button class="place-btn" id="place-btn" onclick="placeOrder()">Place Order</button>
    </div>
  </div>
</div>

<div class="confirm-screen" id="confirm-screen">
  <div class="confirm-ic">✅</div>
  <div class="confirm-title">Order Sent!</div>
  <div class="confirm-sub" id="confirm-sub">Aapka order restaurant ko bhej diya gaya hai. Staff jald hi confirm karega.</div>
  <div class="confirm-status" id="confirm-status"><div class="pulse-dot"></div><span>Waiting for confirmation...</span></div>
  <button class="new-order-btn" onclick="startNewOrder()">Place Another Order</button>
</div>

<div class="powered">⚡ Powered by BillBlitz</div>

<script>
// ══════════════════════════════════════════════════════════
// CONFIG — must match main app's Firebase project
// ══════════════════════════════════════════════════════════
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyCbCj22kdy5bba2s0-yMHAmeqLSbN4Ri3A",
  authDomain: "billblitz-a17dd.firebaseapp.com",
  projectId: "billblitz-a17dd"
};

// ── URL PARAMS ──────────────────────────────────────────────
function getParam(name) {
  var m = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
  return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
}
var restaurantId = getParam('r');
var tableId       = getParam('t') || '';
var tableName     = getParam('tn') || 'Takeaway';
var locationType  = getParam('loc') === 'room' ? 'room' : 'table';

// ── STATE ───────────────────────────────────────────────────
var menu = [];
var cart = {}; // {menuId: qty}
var activeCat = 'All';
var firestoreDb = null, fbAuth = null, isReady = false;
var currentOrderId = null;

// ── UTILS ───────────────────────────────────────────────────
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmt(n){ return 'Rs.'+(+n||0).toFixed(0); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2); }

// ══════════════════════════════════════════════════════════
// FIREBASE INIT
// ══════════════════════════════════════════════════════════
function loadScript(src, cb) {
  var s = document.createElement('script');
  s.src = src; s.onload = cb;
  s.onerror = function(){ showError('Connection failed. Internet check karein.'); };
  document.head.appendChild(s);
}

function initFirebase() {
  if(!restaurantId) { showError('Invalid QR code — restaurant ID missing.'); return; }
  var base = 'https://www.gstatic.com/firebasejs/10.7.1/';
  loadScript(base + 'firebase-app-compat.js', function(){
    loadScript(base + 'firebase-firestore-compat.js', function(){
      loadScript(base + 'firebase-auth-compat.js', function(){
        try {
          firebase.initializeApp(FIREBASE_CONFIG);
          firestoreDb = firebase.firestore();
          fbAuth = firebase.auth();
          fbAuth.signInAnonymously().then(function(){
            isReady = true;
            loadRestaurantData();
          }).catch(function(e){ showError('Connection error: '+e.message); });
        } catch(e){ showError('Setup error: '+e.message); }
      });
    });
  });
}

function showError(msg) {
  document.getElementById('loading').innerHTML =
    '<div style="font-size:2rem">⚠️</div>'
    +'<div style="font-size:.9rem;color:#fff;text-align:center;padding:0 20px">'+esc(msg)+'</div>';
}

// ══════════════════════════════════════════════════════════
// LOAD MENU + RESTAURANT INFO
// ══════════════════════════════════════════════════════════
async function loadRestaurantData() {
  try {
    var infoDoc = await firestoreDb.collection('restaurants').doc(restaurantId).collection('meta').doc('info').get();
    var info = infoDoc.exists ? infoDoc.data() : {};
    document.getElementById('rest-name').textContent = info.restaurantName || info.name || 'Restaurant';
    document.getElementById('rest-sub').textContent  = locationType==='room' ? 'Room Service' : 'Digital Menu & Ordering';
    document.getElementById('table-pill').textContent = (locationType==='room'?'🛏️ ':'🪑 ') + (tableId ? tableName : 'Takeaway');

    var menuDoc = await firestoreDb.collection('restaurants').doc(restaurantId).collection('meta').doc('menu').get();
    menu = (menuDoc.exists && menuDoc.data().items) ? menuDoc.data().items : [];

    document.getElementById('loading').style.display = 'none';
    document.getElementById('hdr').style.display = 'block';
    document.getElementById('cat-tabs').style.display = 'flex';

    if(!menu.length) {
      document.getElementById('menu-wrap').innerHTML =
        '<div class="empty-menu"><div class="empty-menu-ic">🍽️</div>Menu abhi available nahi hai.<br>Staff se poochein.</div>';
      return;
    }

    renderCatTabs();
    renderMenu();
  } catch(e) {
    showError('Menu load nahi hua: ' + e.message);
  }
}

// ══════════════════════════════════════════════════════════
// RENDER MENU
// ══════════════════════════════════════════════════════════
function renderCatTabs() {
  var cats = ['All'];
  menu.forEach(function(m){ if(m.category && cats.indexOf(m.category)===-1) cats.push(m.category); });
  var el = document.getElementById('cat-tabs');
  el.innerHTML = cats.map(function(c){
    return '<button class="cat-tab '+(activeCat===c?'active':'')+'" data-cat="'+esc(c)+'" onclick="setCat(this.dataset.cat)">'+esc(c)+'</button>';
  }).join('');
}

function setCat(c) {
  activeCat = c;
  renderCatTabs();
  renderMenu();
}

function renderMenu() {
  var items = activeCat==='All' ? menu : menu.filter(function(m){ return m.category===activeCat; });
  var el = document.getElementById('menu-wrap');
  if(!items.length) { el.innerHTML = '<div class="empty-menu">No items in this category.</div>'; return; }

  el.innerHTML = items.map(function(m){
    var qty = cart[m.id] || 0;
    var isVeg = m.veg !== false;
    return '<div class="menu-item">'
      +'<div class="mi-info">'
      +'<div class="mi-name"><span class="mi-veg '+(isVeg?'':'nonveg')+'"></span>'+esc(m.name)+'</div>'
      +(m.desc ? '<div class="mi-desc">'+esc(m.desc)+'</div>' : '')
      +'<div class="mi-price">'+fmt(m.price)+'</div>'
      +'</div>'
      +'<div class="mi-add" data-mid="'+m.id+'">'
      +(qty>0
        ? '<div class="qty-ctrl"><button class="qty-btn" onclick="changeQty(\''+m.id+'\',-1)">−</button><span class="qty-num">'+qty+'</span><button class="qty-btn" onclick="changeQty(\''+m.id+'\',1)">+</button></div>'
        : '<button class="add-btn" onclick="changeQty(\''+m.id+'\',1)">+ Add</button>')
      +'</div>'
      +'</div>';
  }).join('');
}

function changeQty(menuId, delta) {
  var cur = cart[menuId] || 0;
  var next = Math.max(0, cur + delta);
  if(next === 0) delete cart[menuId]; else cart[menuId] = next;
  renderMenu();
  updateCartBar();
}

function updateCartBar() {
  var count = 0, total = 0;
  Object.keys(cart).forEach(function(mid){
    var m = menu.find(function(x){ return x.id === mid; });
    if(m) { count += cart[mid]; total += cart[mid] * m.price; }
  });
  var bar = document.getElementById('cart-bar');
  if(count > 0) {
    bar.classList.add('show');
    document.getElementById('cart-count').textContent = count + (count===1?' item':' items');
    document.getElementById('cart-total-lbl').textContent = fmt(total);
  } else {
    bar.classList.remove('show');
  }
}

// ══════════════════════════════════════════════════════════
// CART MODAL
// ══════════════════════════════════════════════════════════
function openCart() {
  var rows = '', total = 0;
  Object.keys(cart).forEach(function(mid){
    var m = menu.find(function(x){ return x.id === mid; });
    if(!m) return;
    var lineTotal = cart[mid] * m.price;
    total += lineTotal;
    rows += '<div class="cart-row">'
      +'<div class="qty-ctrl" style="background:#F5F7FB"><button class="qty-btn" style="background:#1A2B3C;color:#FFD166" onclick="changeQty(\''+mid+'\',-1);openCart()">−</button><span class="qty-num" style="color:#1A2B3C">'+cart[mid]+'</span><button class="qty-btn" style="background:#1A2B3C;color:#FFD166" onclick="changeQty(\''+mid+'\',1);openCart()">+</button></div>'
      +'<div class="cart-row-name">'+esc(m.name)+'</div>'
      +'<div class="cart-row-price">'+fmt(lineTotal)+'</div>'
      +'</div>';
  });
  document.getElementById('cart-items').innerHTML = rows || '<div style="text-align:center;color:#9CA3AF;padding:20px 0">Cart empty hai</div>';
  document.getElementById('cart-final-total').textContent = fmt(total);
  document.getElementById('cart-overlay').classList.add('show');
}

function closeCart() {
  document.getElementById('cart-overlay').classList.remove('show');
  renderMenu();
}

// ══════════════════════════════════════════════════════════
// PLACE ORDER
// ══════════════════════════════════════════════════════════
async function placeOrder() {
  if(!isReady) { alert('Connection ho raha hai, thoda intezaar karein.'); return; }
  var items = [];
  var total = 0;
  Object.keys(cart).forEach(function(mid){
    var m = menu.find(function(x){ return x.id === mid; });
    if(!m) return;
    items.push({ menuId: mid, name: m.name, price: m.price, qty: cart[mid] });
    total += m.price * cart[mid];
  });
  if(!items.length) { alert('Kuch items add karein!'); return; }

  var btn = document.getElementById('place-btn');
  btn.disabled = true; btn.textContent = 'Sending...';

  try {
    var orderId = uid();
    var note = (document.getElementById('order-note').value || '').trim();
    await firestoreDb.collection('restaurants').doc(restaurantId)
      .collection('qrOrders').doc(orderId)
      .set({
        tableId: tableId,
        tableName: tableName,
        locationType: locationType,
        items: items,
        total: total,
        note: note,
        status: 'pending',
        date: new Date().toISOString()
      });

    currentOrderId = orderId;
    cart = {};
    updateCartBar();
    closeCart();
    showConfirmation(orderId);
  } catch(e) {
    alert('Order bhejne mein error: ' + e.message);
    btn.disabled = false; btn.textContent = 'Place Order';
  }
}

function showConfirmation(orderId) {
  document.getElementById('confirm-screen').classList.add('show');
  document.getElementById('confirm-sub').textContent =
    (tableId ? (locationType==='room' ? tableName + ' room service ke liye ' : tableName + ' ke liye ') : '') + 'Aapka order restaurant ko bhej diya gaya hai. Staff jald hi confirm karega.';

  // Listen for status changes
  firestoreDb.collection('restaurants').doc(restaurantId)
    .collection('qrOrders').doc(orderId)
    .onSnapshot(function(doc){
      if(!doc.exists) return;
      var data = doc.data();
      var statusEl = document.getElementById('confirm-status');
      if(data.status === 'accepted') {
        statusEl.innerHTML = '<span style="color:#00C896">✅</span><span>Order accepted! Ban raha hai...</span>';
      } else if(data.status === 'declined') {
        statusEl.innerHTML = '<span style="color:#EF476F">✕</span><span>Order decline ho gaya. Staff se baat karein.</span>';
      } else {
        statusEl.innerHTML = '<div class="pulse-dot"></div><span>Waiting for confirmation...</span>';
      }
    });
}

function startNewOrder() {
  document.getElementById('confirm-screen').classList.remove('show');
  cart = {};
  updateCartBar();
  renderMenu();
}

// ══════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════
initFirebase();
</script>
</body>
</html>
