// Client-side Aadhaar number masking — zero cost, uses only the browser's
// built-in Canvas API (no library, no external API call, no paid SDK).
// UIDAI guidance discourages storing an unmasked Aadhaar image anywhere,
// even locally — this ensures the ONLY copy that ever gets saved to
// state/localStorage/local-folder has the 12-digit number blacked out.
// The raw (unmasked) photo is used only transiently, in-memory, for the
// OCR read itself, and is discarded right after this function returns.
// On a standard Aadhaar front card, the 12-digit number sits in the
// bottom band of the card — blacking out the bottom ~24% robustly covers
// it across the minor layout variations seen in practice (physical card
// photos, e-Aadhaar PDF screenshots, mAadhaar app screenshots).
// Black out specific regions given as normalized boxes {x,y,w,h} in 0..1
// coordinates (as returned by the vision model). Padding is added around
// each box because model boxes are approximate. This replaces the old
// fixed-position band, which failed whenever the card was rotated,
// angled, or not filling the frame.
function maskRegionsInImage(dataUrl, boxes) {
  return new Promise((resolve) => {
    if (!dataUrl || !Array.isArray(boxes) || boxes.length === 0) { resolve(null); return; }
    try {
      const img = new Image();
      img.onload = () => {
        try {
          const canvas = document.createElement("canvas");
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0);
          ctx.fillStyle = "#000000";
          let drew = 0;
          boxes.forEach(b => {
            const x = Number(b.x), y = Number(b.y), w = Number(b.w), h = Number(b.h);
            if (![x, y, w, h].every(n => Number.isFinite(n))) return;
            if (w <= 0 || h <= 0) return;
            // 25% padding each side — model boxes are approximate, and a
            // partially-visible digit is as bad as a fully visible one.
            const padX = w * 0.25, padY = h * 0.35;
            const px = Math.max(0, (x - padX)) * img.width;
            const py = Math.max(0, (y - padY)) * img.height;
            const pw = Math.min(1, (w + padX * 2)) * img.width;
            const ph = Math.min(1, (h + padY * 2)) * img.height;
            ctx.fillRect(px, py, pw, ph);
            drew++;
          });
          if (!drew) { resolve(null); return; }
          resolve(canvas.toDataURL("image/jpeg", 0.85));
        } catch (e) { resolve(null); }
      };
      img.onerror = () => resolve(null);
      img.src = dataUrl;
    } catch (e) { resolve(null); }
  });
}

function maskAadhaarNumberInImage(dataUrl) {
  return new Promise((resolve) => {
    if (!dataUrl) { resolve(dataUrl); return; }
    try {
      const img = new Image();
      img.onload = () => {
        try {
          const canvas = document.createElement("canvas");
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0);
          const bandHeight = img.height * 0.34;
          ctx.fillStyle = "#000000";
          ctx.fillRect(0, img.height - bandHeight, img.width, bandHeight);
          ctx.fillStyle = "#ffffff";
          ctx.font = `${Math.max(12, Math.round(img.height * 0.035))}px sans-serif`;
          ctx.textAlign = "center";
          ctx.fillText("Aadhaar number masked for privacy", img.width / 2, img.height - bandHeight / 2);
          resolve(canvas.toDataURL("image/jpeg", 0.85));
        } catch (e) {
          // If canvas processing fails for any reason (e.g. tainted
          // canvas), fail safe by NOT returning the unmasked image.
          resolve(null);
        }
      };
      img.onerror = () => resolve(null);
      img.src = dataUrl;
    } catch (e) {
      resolve(null);
    }
  });
}
// Single place where the hotel's Aadhaar-photo policy is enforced.
// Returns the image to STORE, or null meaning "store no image".
//   - non-Aadhaar document  -> store as-is (no UIDAI restriction applies)
//   - policy "none"         -> store nothing (default; fully compliant)
//   - policy "masked"       -> store a best-effort masked image; if masking
//                              fails we return null rather than falling back
//                              to the unmasked original.
async function applyAadhaarPhotoPolicy(dataUrl, isAadhaarDoc, numberBoxes) {
  if (!isAadhaarDoc) return dataUrl;
  const policy = (CURRENT_PROFILE && CURRENT_PROFILE.aadhaarPhotoPolicy) || "none";
  if (policy === "none") return null;
  // Region-based masking using the coordinates the vision model reported
  // for the Aadhaar number. If we have no coordinates we do NOT fall back
  // to the old fixed band — that band silently missed the number on
  // rotated/angled/partial-frame cards, which is worse than storing
  // nothing, so we fail closed instead.
  return await maskRegionsInImage(dataUrl, numberBoxes);
}

// ── IMAGE COMPRESSION (canvas → JPEG, max 600px, 65% quality) ──
const compressImg = (dataUrl, maxW = 600) => new Promise((res, rej) => {
  const img = new Image();
  img.onload = () => {
    const sc = Math.min(1, maxW / Math.max(img.width, img.height, 1));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * sc);
    c.height = Math.round(img.height * sc);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    res(c.toDataURL("image/jpeg", 0.65));
  };
  img.onerror = rej;
  img.src = dataUrl;
});
// A SEPARATE, much higher-quality resize used ONLY as the source image for
// AI text-reading (name/DOB/address/ID-number extraction) and photo-based
// QR decoding — never for what gets stored. compressImg's 600px/65%-quality
// output was built to keep localStorage usage small for the image that
// persists on the device, but that SAME heavily-degraded copy was also
// being handed to the OCR/QR reader as its only source: at 600px, fine
// print (a name in a modest font, the 12-digit number, dense QR modules)
// blurs into ambiguous shapes, which is what actually caused misreads like
// "Manoj" coming back as "Sanoj" — the model was reading a genuinely
// blurry image, not making an arbitrary mistake. 1800px at 92% quality
// keeps text and QR modules sharp while still being a modest upload size.
const compressForScan = (dataUrl, maxW = 1800) => new Promise((res, rej) => {
  const img = new Image();
  img.onload = () => {
    const sc = Math.min(1, maxW / Math.max(img.width, img.height, 1));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * sc);
    c.height = Math.round(img.height * sc);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    res(c.toDataURL("image/jpeg", 0.92));
  };
  img.onerror = rej;
  img.src = dataUrl;
});

const WS = {
  // Hotel-isolated path in Firestore (one per license key)
  _hid() {
    return (localStorage.getItem("ab_license_key") || "DEFAULT").replace(/[^A-Z0-9-]/g, "");
  },
  _ref(k) {
    if (!window._db) return null;
    return window._db.collection("hotels").doc(this._hid()).collection("data").doc(k);
  },
  // GET: localStorage (instant) → Firestore (sync if stale)
  async get(k, forceServer) {
    try {
      if (!forceServer) {
        const v = localStorage.getItem(`ab_${k}`);
        if (v) return JSON.parse(v);
      }
    } catch {}
    try {
      const ref = this._ref(k);
      if (!ref) return null;
      const snap = await ref.get({ source: 'server' });
      if (snap.exists) {
        const val = snap.data().value;
        try {
          localStorage.setItem(`ab_${k}`, JSON.stringify(val));
        } catch {}
        return val;
      }
    } catch (e) {
      console.warn("FB get:", k, e.message);
    }
    return null;
  },
  // Atomic read-modify-write of one {value: [...]} document. Two devices
  // saving the SAME whole-array document at nearly the same time used to
  // be "last write wins": the slower device silently erased what the
  // other had just added (e.g. a check-in done on the reception phone
  // vanished when the restaurant tablet saved a charge from stale state).
  // A Firestore transaction re-reads the server copy and lets `mutate`
  // merge into it; Firestore retries automatically on a conflict.
  // Returns the array that was written, or null if a transaction is not
  // possible right now (offline / SDK missing) — callers then fall back
  // to the old plain write so offline work still gets saved.
  async txArray(k, mutate, timeoutMs) {
    const ref = this._ref(k);
    if (!ref || !window._db || typeof window._db.runTransaction !== "function") return null;
    let out = null;
    try {
      await Promise.race([
        window._db.runTransaction(async t => {
          const snap = await t.get(ref);
          const d = snap && snap.exists ? snap.data() : null;
          const cur = d && Array.isArray(d.value) ? d.value : [];
          out = mutate(cur);
          t.set(ref, { value: out, ts: Date.now() }, { merge: true });
        }),
        new Promise((_, rej) => setTimeout(() => rej(new Error("transaction timeout")), timeoutMs || 8000))
      ]);
      return out;
    } catch (e) {
      console.warn("txArray " + k + ":", e.message);
      return null;
    }
  },
  // Raw document (all fields, not just .value) straight from the server.
  async getRawServer(k) {
    const ref = this._ref(k);
    if (!ref) return null;
    const snap = await ref.get({ source: "server" });
    return snap.exists ? snap.data() : null;
  },
  // A month's archive may be split over several part documents
  // (bookings_archive_YYYY_MM, ..._p2, ..._p3) once one month holds more
  // than one Firestore document can. The base document records `parts`.
  async getArchiveMonth(monthKey) {
    try {
      const base = await this.getRawServer(monthKey);
      if (!base) return [];
      let all = Array.isArray(base.value) ? base.value.slice() : [];
      const parts = Number(base.parts) || 1;
      for (let i = 2; i <= parts; i++) {
        const d = await this.getRawServer(monthKey + "_p" + i).catch(() => null);
        if (d && Array.isArray(d.value)) all = all.concat(d.value);
      }
      return all;
    } catch (e) {
      // offline: fall back to whatever single-document copy is cached
      const v = await this.get(monthKey).catch(() => null);
      return Array.isArray(v) ? v : [];
    }
  },
  // SET: localStorage (instant) + Firestore (cloud sync)
  async set(k, v) {
    // Wipe guard: the app never legitimately empties the staff list or the
    // room list. An empty array here is a bug (or tampering) — refuse it
    // rather than overwrite every device's copy with nothing.
    if ((k === "users" || k === "rooms") && Array.isArray(v) && v.length === 0) {
      console.error("Blocked: refusing to overwrite '" + k + "' with an empty list.");
      return;
    }
    try {
      localStorage.setItem(`ab_${k}`, JSON.stringify(v));
    } catch {}
    try {
      const ref = this._ref(k);
      if (ref) await ref.set({
        value: v,
        ts: Date.now()
      }, {
        merge: true
      });
    } catch (e) {
      console.warn("FB set:", k, e.message);
    }
  },
  // SET-SPLIT: full data (photos, raw ID numbers) stays on THIS device only
  // (localStorage). A separate, sanitized copy (masked IDs, no photos) goes
  // to Firestore cloud — for multi-device text sync without ever uploading
  // Aadhaar photos or raw numbers off the capturing device.
  async setSplit(k, localVal, cloudVal) {
    try {
      localStorage.setItem(`ab_${k}`, JSON.stringify(localVal));
    } catch {}
    try {
      const ref = this._ref(k);
      if (ref) await ref.set({
        value: cloudVal,
        ts: Date.now()
      }, {
        merge: true
      });
    } catch (e) {
      console.warn("FB setSplit:", k, e.message);
    }
  },
  // Images stay localStorage only (too large for Firestore)
  // Images live in IndexedDB (StorageGuard); old localStorage copies are
  // still read until the start-up migration has moved them.
  async getRawImg(k) {
    try { const v = await ImgDB.get(k); if (v) return v; } catch {}
    try {
      const v = localStorage.getItem(`ab_img_${k}`);
      if (v) return v;
    } catch {}
    return null;
  },
  async setRawImg(k, v) {
    try { await ImgDB.put(k, v); return; } catch (e) { console.warn("Img save (IndexedDB):", e.message); }
    try {
      localStorage.setItem(`ab_img_${k}`, v);
    } catch (e) {
      console.warn("Img save:", e.message);
    }
  },
  async del(k) {
    try {
      localStorage.removeItem(`ab_${k}`);
    } catch {}
    try {
      const ref = this._ref(k);
      if (ref) await ref.delete();
    } catch (e) {}
  },
  // Real-time listener — call for live sync across devices
  onSnapshot(k, cb) {
    if (!window._db) return () => {};
    try {
      const ref = this._ref(k);
      if (!ref) return () => {};
      return ref.onSnapshot(snap => {
        if (snap.exists) {
          const val = snap.data().value;
          try {
            localStorage.setItem(`ab_${k}`, JSON.stringify(val));
          } catch {}
          cb(val);
        }
      });
    } catch (e) {
      return () => {};
    }
  }
};

// ── HOTEL AUTH (AD-1 remediation) ───────────────────────────────────────
// /api/verify-access, on a successful check, now also mints a Firebase
// custom token bound to THIS hotel's license key (uid: "hotel:<KEY>:<device>",
// claim: hotelId). Signing into it gives every subsequent Firestore request
// a server-verified identity instead of relying purely on whoever happens to
// type the license key. This is additive/best-effort for now — firestore.rules
// still also accept the legacy key-shape check (see SECURITY_AUDIT.md AD-1),
// so a device that fails to sign in (SDK blocked, old cached build, etc.)
// keeps working exactly as before. Nothing here can lock anyone out.
const HotelAuth = {
  // Stable per-device id — NOT a secret, just lets /api/verify-access mint a
  // uid that's unique per physical device rather than shared across every
  // device that ever typed the same license key (so a future per-device
  // revocation — e.g. a lost phone — becomes possible without touching the
  // whole hotel's access).
  deviceId() {
    try {
      let id = localStorage.getItem("ab_device_id");
      if (!id) {
        id = (crypto.randomUUID ? crypto.randomUUID() : ("dev-" + Math.random().toString(36).slice(2) + Date.now().toString(36)))
          .replace(/[^a-zA-Z0-9-]/g, "").slice(0, 64);
        localStorage.setItem("ab_device_id", id);
      }
      return id;
    } catch {
      return "dev-fallback";
    }
  },
  // Sign into the token returned by verify-access, then record (best-effort,
  // non-blocking) that this device is on the new auth path — BizzSathi admin
  // watches adoption via this before Phase 2 tightens firestore.rules.
  async signIn(token) {
    if (!token || !window._auth || !window.firebase) return false;
    try {
      await window._auth.signInWithCustomToken(token);
      WS.set("authVersion", { v: 1, ts: Date.now(), deviceId: this.deviceId() }).catch(() => {});
      return true;
    } catch (e) {
      console.warn("[AtithiBook] HotelAuth sign-in failed — continuing on legacy key-only access:", e.message);
      return false;
    }
  }
};

// ── INVOICE PDF ────────────────────────────────────────────────
// A small, dependency-free PDF writer. WhatsApp sharing previously sent
// plain text; a real PDF is what guests and auditors actually want, and
// pulling in a PDF library would add a CDN dependency this app can't rely
// on. Uses the built-in Helvetica font, so nothing has to be embedded.
// Note: WinAnsi has no rupee glyph, so amounts are written as "Rs."
function buildSimplePDF(lines) {
  const esc = t => String(t).replace(/\\/g, "\\\\").replace(/\(/g, "\\(").replace(/\)/g, "\\)");
  const toWinAnsi = t => String(t)
    .replace(/[₹]/g, "Rs.")
    .replace(/[—–]/g, "-")
    .replace(/[·•]/g, "-")
    .replace(/[’‘]/g, "'")
    .replace(/[“”]/g, '"')
    .replace(/[^\x20-\x7E]/g, "");
  const TOP = 812, BOTTOM = 40;
  let y = TOP;
  const pages = [""];
  let cur = 0;
  const newPage = () => { pages.push(""); cur++; y = TOP; };

  lines.forEach(ln => {
    const text = toWinAnsi(ln.text || "");
    const size = ln.size || 10;
    const font = ln.bold ? "/F2" : "/F1";
    // lh:0 must mean "stay on this line" (used to pair a label with its
    // right-aligned value on the same row) — `||` treats 0 as falsy and
    // silently falls through to the default spacing instead, which was
    // quietly misaligning every label/value pair in this document (Room
    // charges, Subtotal, GRAND TOTAL, Received by, Round Off, Net Amount,
    // and the BILLING DETAILS pairs) onto separate lines.
    const lh = ln.lh !== undefined ? ln.lh : (ln.size ? ln.size + 5 : 15);

    // Apply this line's own gap first, THEN check whether we've run out
    // of room on the current page — if so, start a fresh page before
    // drawing anything. A single-page-only layout (the earlier version)
    // clamped every line to the bottom margin once content ran long
    // (many charges, a foreign-guest section, a long GST summary), which
    // piled several lines on top of each other instead of overflowing
    // onto a second page.
    if (ln.gap) y -= ln.gap;
    if (y < BOTTOM) newPage();

    if (text) {
      const x = ln.x || 50;
      if (ln.align === "right") {
        // Helvetica average width ≈ 0.5em; good enough for column alignment
        const w = text.length * size * 0.5;
        pages[cur] += `BT ${font} ${size} Tf ${Math.round(545 - w)} ${y} Td (${esc(text)}) Tj ET\n`;
      } else {
        pages[cur] += `BT ${font} ${size} Tf ${x} ${y} Td (${esc(text)}) Tj ET\n`;
      }
    }
    if (ln.rule) {
      pages[cur] += `0.8 w 50 ${y - 4} m 545 ${y - 4} l S\n`;
    }
    // Vertical grid lines (used for bordered tables) — an array of
    // x-positions, each drawn from the current line's y down through
    // ln.vlineHeight (defaults to this line's own lh), so a caller can
    // draw one table row's cell borders alongside that row's text.
    if (ln.vlines) {
      const vTop = y + (ln.vlineTopPad || 2);
      const vBottom = y - (ln.vlineHeight !== undefined ? ln.vlineHeight : lh) + 2;
      ln.vlines.forEach(vx => {
        pages[cur] += `0.7 w ${vx} ${vTop} m ${vx} ${vBottom} l S\n`;
      });
    }
    y -= lh;
  });

  const numPages = pages.length;
  const pageObjStart = 3;
  const contentObjStart = pageObjStart + numPages;
  const fontObjStart = contentObjStart + numPages;

  const objs = [];
  const kids = [];
  for (let i = 0; i < numPages; i++) {
    const pageId = pageObjStart + i;
    const contentId = contentObjStart + i;
    kids.push(`${pageId} 0 R`);
    objs[pageId] = `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 ${fontObjStart} 0 R /F2 ${fontObjStart + 1} 0 R >> >> /Contents ${contentId} 0 R >>`;
    objs[contentId] = `<< /Length ${pages[i].length} >>\nstream\n${pages[i]}endstream`;
  }
  objs[1] = "<< /Type /Catalog /Pages 2 0 R >>";
  objs[2] = `<< /Type /Pages /Kids [${kids.join(" ")}] /Count ${numPages} >>`;
  objs[fontObjStart] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>";
  objs[fontObjStart + 1] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>";

  let pdf = "%PDF-1.4\n";
  const offsets = [];
  for (let i = 1; i < objs.length; i++) {
    offsets[i] = pdf.length;
    pdf += `${i} 0 obj\n${objs[i]}\nendobj\n`;
  }
  const xref = pdf.length;
  pdf += `xref\n0 ${objs.length}\n0000000000 65535 f \n`;
  for (let i = 1; i < objs.length; i++) {
    pdf += String(offsets[i]).padStart(10, "0") + " 00000 n \n";
  }
  pdf += `trailer\n<< /Size ${objs.length} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  const bytes = new Uint8Array(pdf.length);
  for (let i = 0; i < pdf.length; i++) bytes[i] = pdf.charCodeAt(i) & 0xFF;
  return new Blob([bytes], { type: "application/pdf" });
}

// Loads a script exactly once, no matter how many times this is called
// concurrently or across separate shares — later callers just await the
// same in-flight/resolved promise instead of injecting duplicate tags.
const _scriptLoadPromises = {};
function loadScriptOnce(src) {
  if (_scriptLoadPromises[src]) return _scriptLoadPromises[src];
  _scriptLoadPromises[src] = new Promise((resolve, reject) => {
    const existing = document.querySelector(`script[src="${src}"]`);
    if (existing) { resolve(); return; }
    const s = document.createElement("script");
    s.src = src;
    s.onload = () => resolve();
    s.onerror = () => { delete _scriptLoadPromises[src]; reject(new Error("Failed to load " + src)); };
    document.head.appendChild(s);
  });
  return _scriptLoadPromises[src];
}

// Renders the SAME styled HTML used for Print/on-screen viewing into a
// PDF, instead of the separate hand-drawn text-and-lines PDF this file
// used to build — that approach could never really match the real
// invoice's fonts, colours, rounded cards, and table styling, which is
// exactly the gap between "what prints" and "what WhatsApp received"
// this exists to close. html2canvas/jsPDF are bundled locally (like
// jsQR) and pre-cached by the service worker, so this works offline
// after the first successful load, same as the rest of the app; the
// only network dependency is the very first fetch of these two files.
async function buildInvoicePDFFromHTML(b, roomObj, htmlOverride) {
  await Promise.all([
    loadScriptOnce("/html2canvas.min.js"),
    loadScriptOnce("/jspdf.umd.min.js")
  ]);
  const html = htmlOverride || buildInvoiceHTML(b, roomObj);
  const doc = new DOMParser().parseFromString(html, "text/html");
  const sheet = doc.querySelector(".sheet");
  const actbar = sheet && sheet.querySelector(".actbar");
  if (actbar) actbar.remove(); // Print/Share buttons themselves shouldn't appear IN the PDF
  const styleEl = doc.querySelector("style");

  const container = document.createElement("div");
  container.style.cssText = "position:fixed;left:-9999px;top:0;width:820px;background:#fff;";
  if (styleEl) container.appendChild(styleEl.cloneNode(true));
  container.appendChild(sheet ? sheet.cloneNode(true) : doc.body.cloneNode(true));
  document.body.appendChild(container);

  try {
    // Let web fonts (Roboto, loaded via @import in the invoice's own
    // <style>) actually finish loading before the screenshot — otherwise
    // html2canvas can capture a frame still showing the fallback font.
    await (document.fonts && document.fonts.ready ? document.fonts.ready.catch(() => {}) : Promise.resolve());
    await new Promise(r => setTimeout(r, 150));

    const canvas = await window.html2canvas(container, {
      scale: 2, useCORS: true, backgroundColor: "#ffffff", logging: false
    });

    const { jsPDF } = window.jspdf;
    // A4 in points, with the screenshot scaled to fill the page width and
    // split across as many pages as its full height needs — a tall
    // invoice (several charges, family members, a long GST summary)
    // isn't cropped or squeezed onto one page.
    const pageW = 595.28, pageH = 841.89;
    const imgW = pageW;
    const imgH = (canvas.height * imgW) / canvas.width;
    const pdf = new jsPDF({ unit: "pt", format: "a4" });
    let renderedH = 0;
    let first = true;
    while (renderedH < imgH) {
      if (!first) pdf.addPage();
      first = false;
      // Shift the SAME full image up by however much has already been
      // rendered on prior pages, so each page shows the next slice —
      // jsPDF clips addImage to the page bounds automatically.
      pdf.addImage(canvas.toDataURL("image/jpeg", 0.92), "JPEG", 0, -renderedH, imgW, imgH);
      renderedH += pageH;
    }
    return pdf.output("blob");
  } finally {
    document.body.removeChild(container);
  }
}

  L.push({ text: "SGST", x: COLX.sP, size: 8, bold: true, lh: 0 });
  L.push({ text: "IGST", x: COLX.iP, size: 8, bold: true, lh: 11 });
  L.push({ text: "Total", size: 8, bold: true, align: "right", lh: 11 });

  L.push({ text: "Value", x: COLX.sV, size: 7.5, lh: 0 });
  L.push({ text: "%", x: COLX.iP, size: 7.5, lh: 0 });
  L.push({ text: "Value", x: COLX.iV, size: 7.5, lh: 13 });
  L.push({ text: "", rule: true, gap: 1, lh: 10 });

  const rowVlines = [tblLeft, COLX.desc - 4, COLX.sac - 4, COLX.cP - 4, COLX.sV + 22, COLX.iP - 4, COLX.tot - 40, tblRight];
  taxedLines.forEach(l => {
    L.push({ text: shortDate(l.date), x: COLX.date, size: 8.5, lh: 0, vlines: rowVlines, vlineHeight: 15 });
    L.push({ text: l.desc.replace(/—/g, "-").slice(0, 24), x: COLX.desc, size: 8.5, lh: 0 });

    L.push({ text: String(l.cgst), x: COLX.cV, size: 8, lh: 0 });
    L.push({ text: l.rate * 100 + "%", x: COLX.sP, size: 8, lh: 0 });
    L.push({ text: String(l.sgst), x: COLX.sV, size: 8, lh: 0 });
    L.push({ text: igstTotal > 0 ? (l.rate * 100) + "%" : "-", x: COLX.iP, size: 8, lh: 0 });
    L.push({ text: igstTotal > 0 ? String((l.taxable * l.rate) - l.cgst - l.sgst) : "-", x: COLX.iV, size: 8, lh: 0 });
    L.push({ text: "Rs." + l.total, size: 8.5, align: "right", lh: 15 });
  });
  L.push({ text: "Total", x: COLX.date, size: 9, bold: true, lh: 0, vlines: rowVlines, vlineHeight: 16, rule: true });
  L.push({ text: "Rs." + G.totalCGST, x: COLX.cV, size: 8.5, bold: true, lh: 0 });

  // ── Payment / totals ──
  const advP = bkAdvance(b);

  L.push({ text: "Computer-generated invoice, no signature required.", size: 8, lh: 12 });
  return buildSimplePDF(L);
}

// ── CREDIT NOTE ───────────────────────────────────────────────────
// GST-compliant credit note: references the ORIGINAL invoice (never
// modifies it), carries its own document number/series, and adjusts
// taxable value + CGST/SGST proportionally to the amount being credited.
// The proportional split uses the original bill's OWN GST-rate mix
// (roomAmt/foodAmt/otherAmt proportions), not a single flat rate — a
// partial credit on a mixed room+restaurant bill should reduce each
// component in the same ratio it was originally taxed at, not silently
// re-tax the credited amount at one rate.
function computeCreditNoteSplit(booking, creditAmount) {
  const gb = booking.gstBreakdown || {};
  const grand = booking.grandTotal || 0;
  if (grand <= 0) return { taxable: 0, cgst: 0, sgst: 0, ratio: 0 };
  const ratio = Math.min(1, Math.max(0, creditAmount / grand));
  const taxable = Math.round((booking.subTotal || 0) * ratio);
  const cgst = Math.round((gb.totalCGST || 0) * ratio);
  const sgst = Math.round((gb.totalSGST || 0) * ratio);
  return { taxable, cgst, sgst, ratio };
}

async function createCreditNote(booking, roomObj, creditAmount, reason, issuedBy) {
  if (!booking.invoiceNo) throw new Error("Is booking ka koi invoice number nahi hai — credit note sirf finalized (checked-out) invoice ke against issue ho sakta hai.");
  if (!(creditAmount > 0) || creditAmount > booking.grandTotal) {
    throw new Error("Credit amount ₹1 se ₹" + booking.grandTotal + " ke beech hona chahiye.");
  }
  if (!reason || !reason.trim()) throw new Error("Reason likhna zaroori hai — GST record ke liye.");

  const split = computeCreditNoteSplit(booking, creditAmount);
  const cnNumber = await generateCreditNoteNumber();
  const note = {
    id: "CN" + Date.now().toString(36).toUpperCase(),
    cnNumber,
    date: todayStr(),
    originalBookingId: booking.id,
    originalInvoiceNo: booking.invoiceNo,
    originalInvoiceDate: booking.checkOutActual || booking.checkOut,
    guestName: booking.name || "",
    roomId: booking.roomId,
    reason: reason.trim().slice(0, 300),
    amount: creditAmount,
    taxableValue: split.taxable,
    cgst: split.cgst,
    sgst: split.sgst,
    issuedBy: issuedBy || "Owner",
    createdAt: new Date().toISOString()
  };
  const existing = (await WS.get("creditNotes")) || [];
  const updated = [...existing, note];
  await WS.set("creditNotes", updated);
  AuditLog.add("CREDIT_NOTE_ISSUED", cnNumber + " against " + booking.invoiceNo + " for Rs." + creditAmount + " — " + reason.trim().slice(0, 60));
  return note;
}

function buildCreditNotePDFBlob(note, hotelProfile) {
  const RH = {
    name: (hotelProfile && hotelProfile.hotelName) || HOTEL.name,
    addr: (hotelProfile && hotelProfile.hotelAddr) || HOTEL.addr,
    phone: (hotelProfile && hotelProfile.hotelPhone) || HOTEL.phone,
    gstin: (hotelProfile && hotelProfile.hotelGstin) || ""
  };
  const L = [];
  const row = (label, amount, opts) => {
    const o = opts || {};
    L.push({ text: label, size: o.size || 10, bold: o.bold, lh: 0 });
    L.push({ text: amount, size: o.size || 10, bold: o.bold, align: "right", lh: o.lh || 15 });
  };
  L.push({ text: RH.name, size: 18, bold: true, lh: 20 });
  String(RH.addr || "").split("\n").forEach(a => L.push({ text: a, size: 9, lh: 11 }));
  L.push({ text: "Phone: " + RH.phone + (RH.gstin ? "   GSTIN: " + RH.gstin : ""), size: 9, lh: 11 });
  L.push({ text: "", rule: true, gap: 4, lh: 14 });
  L.push({ text: "CREDIT NOTE", size: 14, bold: true, lh: 18 });
  L.push({ text: "CN No: " + note.cnNumber, size: 10, lh: 0 });
  L.push({ text: "Date: " + note.date, size: 10, align: "right" });
  L.push({ text: "", gap: 6, lh: 10 });
  L.push({ text: "Against Invoice: " + note.originalInvoiceNo, size: 10, lh: 13 });
  L.push({ text: "Original Invoice Date: " + note.originalInvoiceDate, size: 10, lh: 13 });
  L.push({ text: "Guest: " + note.guestName + "   Room: " + note.roomId, size: 10, lh: 13 });
  L.push({ text: "Reason: " + note.reason, size: 9, lh: 16 });
  L.push({ text: "", rule: true, gap: 4, lh: 16 });
  row("Taxable Value Adjusted", String(note.taxableValue));
  row("CGST Adjusted", String(note.cgst));
  row("SGST Adjusted", String(note.sgst));
  L.push({ text: "", rule: true, gap: 2, lh: 14 });
  row("TOTAL CREDIT", "Rs. " + note.amount, { size: 13, bold: true, lh: 18 });
  L.push({ text: "Amount in Words: " + amountInWords(note.amount), size: 8.5, lh: 14 });
  L.push({ text: "", gap: 8 });
  L.push({ text: "This credit note adjusts the original invoice named above. The original invoice itself remains unchanged.", size: 8, lh: 12 });
  L.push({ text: "Issued by: " + note.issuedBy, size: 8, lh: 12 });
  return buildSimplePDF(L);
}

function LicenseSetup({
  onDone
}) {
  const [key, setKey] = useState(localStorage.getItem("ab_license_key") || "");
  const [phone, setPhone] = useState(localStorage.getItem("ab_verified_phone") || "");
  const [groqKey, setGroqKey] = useState(localStorage.getItem("ab_groq_key") || "");
  const [err, setErr] = useState("");
  const [checking, setChecking] = useState(false);
  const verify = async () => {
    const k = key.trim().toUpperCase();
    if (!k.startsWith("ATITHI-") || k.length < 12) {
      setErr("Invalid key format. Key should be like: ATITHI-HOTEL001\nGet your key from the person who sold you AtithiBook.");
      return;
    }

// ── CSV EXPORT — sales data + guest history, Excel-openable ────────
function bookingsToCSV(bookings, rooms) {
  const roomMap = {};
  rooms.forEach(r => { roomMap[r.id] = r; });
  const headers = [
    "Booking ID", "Guest Name", "Mobile", "Aadhaar (Masked)", "Room No", "Room Type",
    "Check-In", "Check-Out", "Nights", "Room Amount", "Extra Charges", "GST",
    "Total Amount", "Payment Status", "Status", "Address",
    "Total Occupants", "Family Members (Name : Relation : Masked ID)"
  ];
  const esc = (v) => {
    const s = csvSafeText(v);
    if (s.includes(",") || s.includes('"') || s.includes("\n") || s.includes("\r")) {
      return '"' + s.replace(/"/g, '""') + '"';
    }
    return s;
  };
  const rows = bookings.map(b => {
    const n = nts(b.checkIn, b.checkOut);
    const room = roomMap[b.roomId];
    const G = calcBillGST(b, room, rooms);
    const cSum = G.foodAmt + G.otherAmt;
    const sub = G.subtotal;
    const gst = G.totalGST;
    const grand = G.grandTotal;
    const maskedAadhaar = b.aadhaar ? "XXXX XXXX " + String(b.aadhaar).slice(-4) : "";
    const family = Array.isArray(b.family) ? b.family : [];
    const totalOccupants = 1 + family.length;
    const familySummary = family.map(m => {
      const maskedId = m.idNumber ? "XXXX " + String(m.idNumber).slice(-4) : "—";
      return (m.name || "Unnamed") + " : " + (m.relation || "—") + " : " + maskedId;
    }).join(" | ");
    return [
      b.id, b.name, b.mobile, maskedAadhaar, b.roomId, room ? room.type : "",
      fmtDate(b.checkIn), fmtDate(b.checkOut), n, b.roomTotal || 0, cSum, gst,
      grand, b.status === "checkedout" ? "Paid" : "Pending", b.status, (b.address || "").slice(0, 100),
      totalOccupants, familySummary
    ].map(esc).join(",");
  });
  return [headers.map(esc).join(","), ...rows].join("\n");
}

function downloadCSV(csv, filename) {
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

          // approve/decline decisions. Persisting it here (same key saveProfile
          // already uses) keeps every device's localStorage copy correct too.
          if (typeof data.publicBookingToken === "string") {
            try { localStorage.setItem("publicBookingToken", data.publicBookingToken); } catch {}
          }
        });
      }, 600);
      // Access-control permissions need a live listener too. Without one,
      // WS.get("permissions") returns the device's cached localStorage copy
      // and never re-checks the server — so once a staff device had cached
      // a permission set, ANY later change by the Owner (including turning
      // a tab back ON) never reached that device. Re-enabling appeared
      // permanently broken for exactly this reason.
      setTimeout(() => {
        if (cancelled) return;
        unsubPerms = WS.onSnapshot("permissions", data => {
          if (data) setPermissions(data);
        });
      }, 900);
      // Booking requests listener moved to its own effect below, keyed on
      // profile.publicBookingToken — see that effect's comment for why a
      // one-time, mount-only subscription here missed a second device.
      // Connection state monitor
      window._db.enableNetwork().then(() => setSyncErr(false)).catch(() => setSyncErr(true));
    };
    trySetup();

    // POLLING SAFETY NET — Firebase's own engineering team has permanently
    // marked the "Target ID already exists" crash as "wontfix" (confirmed
    // on their public issue tracker), meaning the real-time onSnapshot
    // listener above can be silently disrupted by a bug that is, by
    // Firebase's own admission, never going to be fixed at the SDK level.
    // Rather than depend entirely on that fragile stream, this does a
    // plain one-time refetch every 20 seconds as a backup — so even if a
    // real-time update is ever missed or the listener gets knocked out,
    // this device is never more than a short while out of date. This is a
    // deliberate, standard workaround for exactly this class of platform
    // limitation, not a workaround for anything wrong in our own code.
    //
    // IMPORTANT — only polls while the tab is actually visible/focused
    // (document.hidden check). On the free Firestore plan (50k reads/day
    // total, shared across every app on the project), polling around the
    // clock even while a phone's screen is off or the tab is backgrounded
    // would burn through the daily quota after only 2-3 hotels. Pausing
    // when hidden cuts this dramatically for realistic usage, since staff
    // don't keep the screen actively open every second of business hours.
    const pollInterval = setInterval(async () => {
      if (cancelled || !window._db || document.hidden) return;
      try {
        // Sequential (NOT Promise.all) — concurrent Firestore calls are
        // exactly what triggers the "Target ID already exists" bug this
        // polling exists to work around. Doing two at once here would
        // undermine the whole point and add to the load on the listeners
        // above. One at a time, with a small gap between them.
        const freshRooms = await window._db.collection("hotels").doc(WS._hid()).collection("data").doc("rooms").get({ source: 'server' });
        if (!cancelled && freshRooms.exists) setRooms(freshRooms.data().value);
        await new Promise(r => setTimeout(r, 500));
        const freshBookings = await window._db.collection("hotels").doc(WS._hid()).collection("data").doc("bookings").get({ source: 'server' });
        if (!cancelled && freshBookings.exists) setBookings(prevLocal => mergeBookings(freshBookings.data().value, prevLocal));
      } catch (e) { /* silent — this is a best-effort backup, live listener is primary */ }
    }, 20000);
    // Also do one immediate poll whenever the tab becomes visible again
    // (e.g. phone screen turned back on) — catches up right away instead
    // of waiting up to 20s after someone returns to the app.
    const onVisible = () => {
      if (!document.hidden && !cancelled && window._db) {
        window._db.collection("hotels").doc(WS._hid()).collection("data").doc("rooms").get({ source: 'server' })
          .then(s => { if (!cancelled && s.exists) setRooms(s.data().value); }).catch(() => {});
      }
    };
    document.addEventListener("visibilitychange", onVisible);

    return () => {
      cancelled = true;
      if (pollTimer) clearTimeout(pollTimer);
      clearInterval(pollInterval);
      document.removeEventListener("visibilitychange", onVisible);
      unsubRooms();
      unsubBk();
      unsubRes();
      unsubProfile();
      unsubPerms();
    };
  }, []);

  // Booking requests (from the public direct-booking link) live in the
  // token-scoped `public_booking/{token}/requests` subcollection, NOT
  // under this hotel's own data tree — see PublicBookingPage for why that
  // separation exists (the public link must not be able to reach anything
  // the license key protects). So this listener is set up separately from
  // the WS helpers, which are all hardwired to hotels/{licenseKey}/data/*.
  //
  // BUG FIX (2026-09): this used to be a ONE-TIME subscription inside the
  // mount-only effect above, reading localStorage.publicBookingToken at
  // that single moment. On the device that generated the link, the token
  // was already in localStorage by then, so it worked. On a SECOND device
  // logged in with the same license key, the token only ever arrives later
  // via the cloud profile sync — so the one-time read saw an empty string,
  // never subscribed, and no amount of later syncing fixed it because the
  // effect never ran again. Keying this effect on `profile.publicBookingToken`
  // (React state, kept current by the profile listener above) makes it
  // (re)subscribe the moment the token becomes known on ANY device,
  // including one where it arrives seconds after login rather than at
  // mount. Also runs again correctly if the token itself is ever rotated.
  // AUDIT-2 (F2): enquiries are readable only by the signed-in owning
  // hotel, and HotelAuth.signIn() completes asynchronously — often AFTER
  // this listener first registers. A listener rejected with
  // permission-denied is dead for good, so it is re-created whenever the
  // Firebase Auth identity changes (independent review finding S1).
  const [authUid, setAuthUid] = useState("");
  useEffect(() => {
    if (!window._auth || typeof window._auth.onAuthStateChanged !== "function") return;
    const off = window._auth.onAuthStateChanged(u => setAuthUid(u && u.uid ? u.uid : ""));
    return () => { try { off && off(); } catch (e) {} };
  }, []);
  useEffect(() => {
    const tok = (profile?.publicBookingToken || "").trim();
    if (!tok || !window._db) { setBookingRequests([]); return; }
    let unsub = () => {};
    try {
      unsub = window._db.collection("public_booking").doc(tok)
        .collection("requests").onSnapshot(snap => {
          const list = [];
          snap.forEach(d => list.push(d.data()));
          // Newest first, so the Dashboard shows the most recent
          // enquiries at the top of the pending queue.
          list.sort((a, b) => String(b.createdAt || "").localeCompare(String(a.createdAt || "")));
          setBookingRequests(list);
          try { localStorage.setItem("ab_bookingRequests", JSON.stringify(list)); } catch {}
        }, err => console.warn("Booking requests listener:", err.message));
    } catch (e) { console.warn("Booking requests listener setup:", e.message); }
    return () => unsub();
  }, [profile?.publicBookingToken, authUid]);

  // Strips everything that must NEVER leave this device before syncing to
  // Firestore: raw Aadhaar/ID numbers (masked instead) and all photos
  // (signature, Aadhaar front/back, family member ID photos). Full data
  // still lives in localStorage on this device via setSplit's localVal.
  const sanitizeBookingsForCloud = (bk) => bk.map(b => {
    const { photoFront, photoBack, signature, ...rest } = b;
    return {
      ...rest,
      aadhaar: b.aadhaar ? maskAadhaar(b.aadhaar) : b.aadhaar,
      family: Array.isArray(b.family) ? b.family.map(m => {
        const { photoFront, photoBack, ...mRest } = m;
        return { ...mRest, idNumber: m.idNumber ? maskAadhaar(m.idNumber) : m.idNumber };
      }) : b.family
    };
  });

  // ── ARCHIVING — keeps the "live" bookings document small forever ──
  // The single-document design (every booking a hotel has EVER had, in
  // one Firestore doc) is what the 50%-capacity warning above exists
  // for — it doesn't fix the ceiling, only warns about it. This is that
  // fix: once a checked-out booking is older than the live window, it
  // moves OUT of the live document into a small, dated archive document
  // (one per calendar month), so the live document a hotel's daily
  // check-in/checkout depends on never grows past a small, predictable
  // size no matter how many YEARS the hotel has used the app.
  //
  // The overriding rule for all of this: a guest register is a legal
  // retention record, so a record may be MOVED but is never dropped —
  // every path below either keeps a booking exactly where it was or
  // successfully confirms it landed in its new home before removing it
  // from the old one. Anything that can't be confirmed leaves the
  // booking right where it already was, to be retried on a later save,
  // rather than risk losing it.
  const ARCHIVE_WINDOW_DAYS = 90;
  // One archive document per calendar month a booking was checked out
  // in — e.g. "bookings_archive_2026_03" — so no single archive
  // document can grow large either; each only ever holds one month's
  // worth of a hotel's checkouts.
  const getArchiveMonthKey = (dateStr) => {
    const d = new Date(dateStr + "T12:00:00");
    if (isNaN(d)) return null;
    return "bookings_archive_" + d.getFullYear() + "_" + String(d.getMonth() + 1).padStart(2, "0");
  };

  // Splits `bookings` into what should stay in the live document and
  // what should move to archives, and SAFELY performs that move —
  // archive writes are confirmed to succeed before anything is removed
  // from the returned "live" list. Never throws: any failure just means
  // "nothing changed this time, try again on the next save."
  //
  // Capped at moving ARCHIVE_BATCH_CAP records per call (not per
  // month — total) so that a hotel with a large pre-existing backlog
  // (from before this existed, or from a long period offline) gets
  // migrated gradually across several ordinary check-in/checkout saves
  // instead of attempting one very large write the first time this runs.
  const ARCHIVE_BATCH_CAP = 300;
  // SCALE FIX: a typical booking is ~3 KB in the cloud, so a 90-day live
  // window crosses Firestore's 1 MiB per-document ceiling at about 15–20
  // rooms — after which EVERY check-in/checkout silently failed to reach
  // the cloud. The live window now shrinks automatically (90 → 1 day,
  // checked-out stays only) until the live document is back under
  // LIVE_SOFT_BYTES. Active stays are never archived.
  const LIVE_SOFT_BYTES = 450000;
  const ARCHIVE_PART_BYTES = 700000;
  const cloudBytes = arr => { try { return JSON.stringify(sanitizeBookingsForCloud(arr)).length; } catch (e) { return 0; } };
  const archiveOldBookings = async (allBookings) => {
    const outTime = b => (b.status === "checkedout" && b.checkOutActual) ? new Date(b.checkOutActual + "T12:00:00").getTime() : NaN;
    let windowDays = ARCHIVE_WINDOW_DAYS;
    if (cloudBytes(allBookings) > LIVE_SOFT_BYTES) {
      for (const w of [60, 45, 30, 14, 7, 3, 1]) {
        windowDays = w;
        const cut = Date.now() - w * 86400000;
        const remain = allBookings.filter(b => { const t = outTime(b); return isNaN(t) || t >= cut; });
        if (cloudBytes(remain) <= LIVE_SOFT_BYTES) break;
      }
    }
    const cutoff = Date.now() - windowDays * 86400000;
    const eligible = [];
    allBookings.forEach(b => {
      const t = outTime(b);
      if (!isNaN(t) && t < cutoff) eligible.push(b);
    });
    // Oldest first, so a capped batch always moves the oldest records.
    eligible.sort((a, b) => outTime(a) - outTime(b));
    if (eligible.length === 0) return { live: allBookings, archivedCount: 0, archivedIds: new Set() };

    const batch = eligible.slice(0, ARCHIVE_BATCH_CAP);
    const byMonth = new Map(); // monthKey -> [bookings]
    for (const b of batch) {
      const key = getArchiveMonthKey(b.checkOutActual);
      if (!key) continue; // malformed date — leave it in live rather than risk misfiling it
      if (!byMonth.has(key)) byMonth.set(key, []);
      byMonth.get(key).push(b);
    }

    const successfullyArchivedIds = new Set();
    for (const [monthKey, monthBookings] of byMonth) {
      try {
        // Read the month's base document and every part (force-server:
        // never trust a stale local cache for a merge).
        const base = await WS.getRawServer(monthKey);
        const partCount = (base && Number(base.parts)) || 1;
        const partKey = i => i === 1 ? monthKey : monthKey + "_p" + i;
        const parts = [Array.isArray(base?.value) ? base.value : []];
        for (let i = 2; i <= partCount; i++) {
          const d = await WS.getRawServer(partKey(i));
          parts.push(Array.isArray(d?.value) ? d.value : []);
        }
        const existingIds = new Set(parts.flat().map(x => x.id));
        // Only append records not already present in that month's
        // archive — safe to re-run this whole function against a month
        // that was partially archived before (e.g. a previous attempt
        // succeeded for some records this session but not all).
        const toAppend = monthBookings.filter(b => !existingIds.has(b.id));
        if (toAppend.length === 0) {
          // Already fully archived (from an earlier, interrupted attempt)
          // — safe to remove from live even though nothing new was written.
          monthBookings.forEach(b => successfullyArchivedIds.add(b.id));
          continue;
        }
        if (!WS._ref(monthKey)) continue; // no Firestore connection — leave these in live, retry later
        // Append into the last part; open a new part whenever one would
        // pass ARCHIVE_PART_BYTES (each Firestore document caps at 1 MiB).
        const clean = sanitizeBookingsForCloud(toAppend);
        let idx = parts.length - 1;
        const dirty = new Set();
        for (const rec of clean) {
          const recBytes = JSON.stringify(rec).length + 1;
          if (parts[idx].length && JSON.stringify(parts[idx]).length + recBytes > ARCHIVE_PART_BYTES) { parts.push([]); idx = parts.length - 1; }
          parts[idx] = [...parts[idx], rec];
          dirty.add(idx);
        }
        // Write the parts first; only then record the new part count on
        // the base document, so a reader never looks for a part that is
        // not there yet.
        for (const i of [...dirty].sort((a, b) => b - a)) {
          if (i === 0) continue;
          await WS._ref(partKey(i + 1)).set({ value: parts[i], ts: Date.now() }, { merge: true });
        }
        const baseUpdate = { ts: Date.now(), parts: parts.length };
        if (dirty.has(0)) baseUpdate.value = parts[0];
        await WS._ref(monthKey).set(baseUpdate, { merge: true });
        // Only mark as archived AFTER the write above has resolved
        // successfully — this is the exact line that guarantees no
        // booking is ever removed from "live" without first being
        // durably saved somewhere else.
        monthBookings.forEach(b => successfullyArchivedIds.add(b.id));
      } catch (e) {
        console.warn("Archiving " + monthKey + " failed, will retry next save:", e.message);
        // Deliberately no re-throw — a failed month just means those
        // specific records stay in "live" and get tried again next time
        // saveBk runs, which happens constantly during normal use.
      }
    }

    if (successfullyArchivedIds.size === 0) return { live: allBookings, archivedCount: 0, archivedIds: new Set() };
    const live = allBookings.filter(b => !successfullyArchivedIds.has(b.id));
    return { live, archivedCount: successfullyArchivedIds.size, archivedIds: successfullyArchivedIds };
  };

  // Root-cause fix for localStorage quota exhaustion: every checked-in
  // guest's photos get embedded in the "bookings" localStorage cache, which
  // otherwise grows FOREVER as a hotel does more check-ins over months —
  // eventually filling the browser's ~5-10MB limit entirely, which then
  // breaks EVEN TINY writes like the session-timeout timestamp (exactly
  // what caused a real "Failed to execute setItem... exceeded the quota"
  // crash on login for one hotel). Photos for OLD, already-checked-out
  // guests are stripped from this local cache — they remain fully safe in
  // the local folder backup (if enabled) and as masked text in the cloud;
  // only the redundant local-cache COPY of old photos is pruned.
  const pruneOldPhotosForLocalStorage = (bookings, retentionDays) => {
    const cutoff = Date.now() - retentionDays * 86400000;
    return bookings.map(b => {
      const isOld = b.status === "checkedout" && b.checkOutActual && new Date(b.checkOutActual).getTime() < cutoff;
      if (!isOld) return b;
      const { photoFront, photoBack, signature, ...rest } = b;
      return {
        ...rest,
        family: Array.isArray(b.family) ? b.family.map(m => {
          const { photoFront, photoBack, ...mRest } = m;
          return mRest;
        }) : b.family
      };
    });
  };

  // Save helpers — writes to localStorage + Firestore simultaneously
  const saveRooms = async r => {
    setRooms(r);
    setSyncing(true);
    await WS.set("rooms", r);
    setSyncing(false);
  };
  // Change ONE room's status without overwriting the rest of the list from
  // this device's possibly-stale copy (another device may have just
  // checked a guest into a different room).
  const patchRoom = async (roomId, patch) => {
    const apply = arr => arr.map(r => r.id === roomId ? { ...r, ...patch } : r);
    setSyncing(true);
    const res = await WS.txArray("rooms", srv => apply(srv.length ? srv : rooms));
    if (res === null) { await saveRooms(apply(rooms)); return; }
    setRooms(res);
    try { localStorage.setItem("ab_rooms", JSON.stringify(res)); } catch (e) {}
    setSyncing(false);
  };
  // Room edit / add room: change ONLY that room's own details (number,
  // floor, name, type, rate, photos) on the server's latest copy. It used to
  // save this device's whole room list, which could undo a check-in or
  // checkout another device had just done (a guest's room showing free, or
  // an empty room stuck on "occupied"). Status/bookingId are never taken
  // from the edit screen.
  const saveRoomEdit = async (updated, originalId, isNew) => {
    const EDITABLE = ["id", "fl", "name", "type", "rate", "photos"];
    let problem = null;
    const apply = arr => {
      problem = null;
      if (isNew) {
        if (arr.some(r => r.id === updated.id)) { problem = "Room number '" + updated.id + "' already exists — doosra number chuno"; return arr; }
        return [...arr, { ...updated, status: "empty", bookingId: null }];
      }
      const cur = arr.find(r => r.id === originalId);
      if (!cur) { problem = "Room " + originalId + " nahi mila — shayad doosre device par badal diya gaya. Screen refresh karke dobara try karo."; return arr; }
      if (updated.id !== originalId) {
        if (arr.some(r => r.id === updated.id)) { problem = "Room number '" + updated.id + "' already exists — doosra number chuno"; return arr; }
        if (cur.status === "occupied") { problem = "Room " + originalId + " mein abhi guest hai — number change nahi kar sakte. Pehle checkout karo."; return arr; }
      }
      const patch = {};
      EDITABLE.forEach(k => { if (k in updated) patch[k] = updated[k]; });
      return arr.map(r => r.id === originalId ? { ...r, ...patch } : r);
    };
    setSyncing(true);
    const res = await WS.txArray("rooms", srv => apply(srv.length ? srv : rooms));
    if (res === null) {
      // Offline / no transaction possible: same edit on this device's copy.
      const out = apply(rooms);
      if (problem) { setSyncing(false); alert(problem); return false; }
      await saveRooms(out);
      return true;
    }
    setRooms(res);
    try { localStorage.setItem("ab_rooms", JSON.stringify(res)); } catch (e) {}
    setSyncing(false);
    if (problem) { alert(problem); return false; }
    return true;
  };
  const saveBk = async rawB => {
    // Auto-archive: moves any checked-out booking older than the live
    // window into its monthly archive document — see archiveOldBookings
    // above for the safety guarantees (nothing is ever removed from live
    // without a confirmed successful archive write first). This runs on
    // every save, but is a fast no-op on the overwhelming majority of
    // calls (there's usually nothing old enough to move); the extra
    // archive read/write only happens on the rare save where there
    // actually is something to relocate.
    const { live: b, archivedCount, archivedIds } = await archiveOldBookings(rawB);
    if (archivedCount > 0) {
      AuditLog.add("BOOKINGS_ARCHIVED", archivedCount + " record(s) moved to monthly archive");
    }
    setBookings(b);
    setSyncing(true);
    // Progressively more aggressive pruning if storage is running low —
    // 14 days retention first, then 3, then 0 (active bookings only) as a
    // last resort — so the app never silently stops saving new check-ins
    // just because old guests' photos filled up the browser's storage.
    let localSaved = false;
    for (const days of [14, 3, 0]) {
      const trimmed = pruneOldPhotosForLocalStorage(b, days);
      try {
        localStorage.setItem("ab_bookings", JSON.stringify(trimmed));
        localSaved = true;
        break;
      } catch (e) { console.warn(`Local bookings save (retain ${days}d):`, e.message); }
    }
    if (!localSaved) console.warn("⚠️ Could not save bookings locally even after aggressive pruning — device storage is critically full. Cloud sync still attempted below.");
    try {
      const ref = WS._ref("bookings");
      const cloudPayload = sanitizeBookingsForCloud(b);
      // Early warning for a genuinely different problem than the local
      // pruning above: Firestore caps a SINGLE document at 1 MiB, and
      // every checked-out guest this hotel has EVER had lives in this
      // ONE document (photos are already stripped by
      // sanitizeBookingsForCloud, but the records themselves accumulate
      // forever). A busy hotel can approach that ceiling within a year
      // or two of steady use, at which point every check-in/checkout
      // would start failing to sync — with no obvious cause from the
      // Owner's side. Warning well before that point (at 50% — tested
      // against realistic record sizes, this leaves roughly a year of
      // runway at typical busy-hotel volumes, not just a few weeks) turns a
      // future silent, mysterious failure into something support can
      // proactively archive old records for ahead of time. This does
      // NOT delete or move anything by itself — it only warns; guest
      // registers are a legal retention requirement, and safely
      // archiving them needs care and its own release, not a rushed
      // in-place rewrite of daily check-in/checkout logic.
      const approxBytes = new Blob([JSON.stringify(cloudPayload)]).size;
      const FIRESTORE_DOC_LIMIT = 1048576;
      if (approxBytes > FIRESTORE_DOC_LIMIT * 0.5 && user?.role === "Owner") {
        const warnKey = "ab_bookingsSizeWarnedAt";
        const lastWarned = Number(localStorage.getItem(warnKey) || 0);
        if (Date.now() - lastWarned > 24 * 60 * 60 * 1000) { // once/day at most
          localStorage.setItem(warnKey, String(Date.now()));
          setTimeout(() => alert(
            "⚠️ Storage Warning: Aapka booking history bahut bada ho gaya hai (" +
            Math.round(approxBytes / 1024) + " KB). Ek limit ke baad naya check-in/checkout cloud mein save hona band ho sakta hai.\n\n" +
            "Bizsathi support se sampark karo purane guest records archive karwane ke liye."
          ), 500);
        }
      }
      // MULTI-DEVICE FIX: merge into the server copy inside a transaction
      // instead of overwriting it — bookings another device added (or a
      // checkout it did) since this device last synced are kept. Records
      // this save deliberately moved to the archive are not brought back.
      const merged = await WS.txArray("bookings", srv => mergeBookingLists(cloudPayload, srv, archivedIds || new Set()));
      if (merged === null) {
        if (ref) await ref.set({ value: cloudPayload, ts: Date.now() }, { merge: true });
      } else {
        const have = new Set(b.map(x => x.id));
        const extra = merged.filter(x => !have.has(x.id));
        const changed = merged.filter(x => have.has(x.id) && x.status === "checkedout" && (b.find(y => y.id === x.id) || {}).status !== "checkedout");
        if (extra.length || changed.length) {
          setBookings(prev => {
            const byId = new Map(prev.map(x => [x.id, x]));
            changed.forEach(x => byId.set(x.id, { ...x, photoFront: byId.get(x.id)?.photoFront, photoBack: byId.get(x.id)?.photoBack, signature: byId.get(x.id)?.signature }));
            const out = [...byId.values()];
            extra.forEach(x => { if (!byId.has(x.id)) out.push(x); });
            return out;
          });
        }
      }
      setSyncErr(false);
    } catch (e) {
      console.warn("FB set bookings:", e.message);
      // Data is still safe on this device, but tell staff instead of
      // failing silently.
      setSyncErr(true);
      try {
        const k = "ab_bookingsSyncFailAlertAt";
        if (Date.now() - Number(localStorage.getItem(k) || 0) > 6 * 3600 * 1000) {
          localStorage.setItem(k, String(Date.now()));
          setTimeout(() => alert("⚠️ Bookings cloud par save nahi ho payi (" + String(e.message || "").slice(0, 80) + ").\nData is device par safe hai. Internet check karo; problem rahe to BizzSathi support ko batao."), 300);
        }
      } catch (x) {}
    }
    setSyncing(false);
    AuditLog.add('CHECKIN', b[b.length - 1]?.name || 'guest');
  };
  const savePermissions = async p => {
    setPermissions(p);
    await WS.set("permissions", p);
    AuditLog.add('ACCESS_CONTROL_CHANGED', user?.u || '');
  };

  // Actions
  const handleCheckIn = async form => {
    // Guard against two devices checking in different guests to the SAME
    // room at nearly the same moment. Each device's own `rooms` state can
    // look "empty" right up until the other device's write actually syncs
    // in (the 20s poll / onSnapshot listener isn't instant), so trusting
    // that local state alone lets both check-ins go through — one room
    // ends up "occupied" (whichever write landed last) while BOTH bookings

  <!-- Service Worker Registration -->
  <script>
    if('serviceWorker' in navigator){
      window.addEventListener('load', ()=>{
        navigator.serviceWorker.register('/sw.js')
          .then(reg => {
            console.log('[AtithiBook] SW registered:', reg.scope);

            // Force-activate a new worker immediately whenever one is found,
            // instead of waiting for the browser's own timing (which can be
            // slow or inconsistent, and was the reason a fresh deploy wasn't
            // taking effect even after hard-refreshing).
            const forceActivateWaiting = () => {
              if (reg.waiting) reg.waiting.postMessage('SKIP_WAITING');
            };
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (!newWorker) return;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  forceActivateWaiting();
                }
              });
            });
            // Also handle the case where a new worker was ALREADY installed
            // and waiting before this page even loaded.
            forceActivateWaiting();

            // Check for a newer version RIGHT AWAY (not just periodically) —
            // catches a fresh deploy as soon as the app is opened.
            reg.update().catch(()=>{});
            setInterval(() => reg.update().catch(()=>{}), 60 * 60 * 1000);
          })
          .catch(e=>console.warn('[AtithiBook] SW failed:', e));

        // AUTO-UPDATE: when a NEW service worker takes control (meaning a
        // fresh deploy was detected), reload the page ONCE automatically —
        // this refreshes the APP CODE only. It never touches localStorage
        // or IndexedDB, so license key, bookings, rooms, staff logins, and
        // the local folder connection all stay exactly as they were. This
        // is what makes updates behave like a normal app update — code
        // changes, data doesn't — instead of needing "Clear Site Data"
        // (which was the wrong advice — that wipes data too).
        let refreshingForUpdate = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshingForUpdate) return;
          refreshingForUpdate = true;
          console.log('[AtithiBook] New version active — refreshing app (your data is untouched)');
          window.location.reload();
        });
      });
    }

    // Install prompt — show "Add to Home Screen" automatically
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', e=>{
      e.preventDefault();
      deferredPrompt=e;
      // Show install button after 30 seconds if not installed
      setTimeout(()=>{
        if(deferredPrompt && !window.matchMedia('(display-mode: standalone)').matches){
          const banner=document.createElement('div');
          banner.innerHTML=`<div style="position:fixed;bottom:0;left:0;right:0;background:#1e3a5f;color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;z-index:9999;border-top:2px solid #d97706;font-family:'Hind',sans-serif">
            <div><div style="font-weight:700;font-size:13px">📲 Install AtithiBook App</div><div style="font-size:11px;opacity:.7">Home screen pe add karo — faster & native feel</div></div>
            <div style="display:flex;gap:8px">
              <button onclick="this.closest('div[style]').parentElement.remove()" style="background:transparent;border:1px solid rgba(255,255,255,.3);color:rgba(255,255,255,.7);padding:6px 10px;border-radius:6px;font-size:12px;cursor:pointer">Later</button>
              <button id="installBtn" style="background:#d97706;border:none;color:#fff;padding:6px 14px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer">Install</button>
            </div>
          </div>`;
          document.body.appendChild(banner);
          document.getElementById('installBtn').onclick=async()=>{
            deferredPrompt.prompt();
            const {outcome}=await deferredPrompt.userChoice;
            if(outcome==='accepted') banner.remove();
            deferredPrompt=null;
          };
        }
      }, 30000);
    });
  </script>
