// output was built to keep localStorage usage small for the image that
// persists on the device, but that SAME heavily-degraded copy was also
// being handed to the OCR/QR reader as its only source: at 600px, fine
// print (a name in a modest font, the 12-digit number, dense QR modules)
// blurs into ambiguous shapes, which is what actually caused misreads like
// "Manoj" coming back as "Sanoj" — the model was reading a genuinely
// blurry image, not making an arbitrary mistake. 1800px at 92% quality
// keeps text and QR modules sharp while still being a modest upload size.

  const img = new Image();
  img.onload = () => {
    const sc = Math.min(1, maxW / Math.max(img.width, img.height, 1));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * sc);
    c.height = Math.round(img.height * sc);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    res(c.toDataURL("image/jpeg", 0.92));
  };
  img.onerror = rej;
  img.src = dataUrl;
});

      await Promise.race([
        window._db.runTransaction(async t => {
          const snap = await t.get(ref);

          const cur = d && Array.isArray(d.value) ? d.value : [];

        }),
        new Promise((_, rej) => setTimeout(() => rej(new Error("transaction timeout")), timeoutMs || 8000))

      console.warn("txArray " + k + ":", e.message);

// /api/verify-access, on a successful check, now also mints a Firebase
// custom token bound to THIS hotel's license key (uid: "hotel:<KEY>:<device>",
// claim: hotelId). Signing into it gives every subsequent Firestore request
// a server-verified identity instead of relying purely on whoever happens to
// type the license key. This is additive/best-effort for now — firestore.rules
// still also accept the legacy key-shape check (see SECURITY_AUDIT.md AD-1),
// so a device that fails to sign in (SDK blocked, old cached build, etc.)
// keeps working exactly as before. Nothing here can lock anyone out.
const HotelAuth = {
  // Stable per-device id — NOT a secret, just lets /api/verify-access mint a
  // uid that's unique per physical device rather than shared across every
  // device that ever typed the same license key (so a future per-device
  // revocation — e.g. a lost phone — becomes possible without touching the
  // whole hotel's access).

    try {
      let id = localStorage.getItem("ab_device_id");
      if (!id) {

          .replace(/[^a-zA-Z0-9-]/g, "").slice(0, 64);

// ── INVOICE PDF ────────────────────────────────────────────────
// A small, dependency-free PDF writer. WhatsApp sharing previously sent
// plain text; a real PDF is what guests and auditors actually want, and

// Note: WinAnsi has no rupee glyph, so amounts are written as "Rs."

    .replace(/[—–]/g, "-")

    .replace(/[’‘]/g, "'")
    .replace(/[“”]/g, '"')
    .replace(/[^\x20-\x7E]/g, "");

  let y = TOP;
  const pages = [""];
  let cur = 0;
  const newPage = () => { pages.push(""); cur++; y = TOP; };

  lines.forEach(ln => {
    const text = toWinAnsi(ln.text || "");
    const size = ln.size || 10;
    const font = ln.bold ? "/F2" : "/F1";
    // lh:0 must mean "stay on this line" (used to pair a label with its
    // right-aligned value on the same row) — `||` treats 0 as falsy and
    // silently falls through to the default spacing instead, which was
    // quietly misaligning every label/value pair in this document (Room
    // charges, Subtotal, GRAND TOTAL, Received by, Round Off, Net Amount,
    // and the BILLING DETAILS pairs) onto separate lines.
    const lh = ln.lh !== undefined ? ln.lh : (ln.size ? ln.size + 5 : 15);

    // Apply this line's own gap first, THEN check whether we've run out
    // of room on the current page — if so, start a fresh page before
    // drawing anything. A single-page-only layout (the earlier version)
    // clamped every line to the bottom margin once content ran long
    // (many charges, a foreign-guest section, a long GST summary), which
    // piled several lines on top of each other instead of overflowing
    // onto a second page.
    if (ln.gap) y -= ln.gap;
    if (y < BOTTOM) newPage();

    if (text) {
      const x = ln.x || 50;
      if (ln.align === "right") {
        // Helvetica average width ≈ 0.5em; good enough for column alignment
        const w = text.length * size * 0.5;
        pages[cur] += `BT ${font} ${size} Tf ${Math.round(545 - w)} ${y} Td (${esc(text)}) Tj ET\n`;
      } else {
        pages[cur] += `BT ${font} ${size} Tf ${x} ${y} Td (${esc(text)}) Tj ET\n`;
      }
    }
    if (ln.rule) {
      pages[cur] += `0.8 w 50 ${y - 4} m 545 ${y - 4} l S\n`;
    }
    // Vertical grid lines (used for bordered tables) — an array of
    // x-positions, each drawn from the current line's y down through
    // ln.vlineHeight (defaults to this line's own lh), so a caller can
    // draw one table row's cell borders alongside that row's text.
    if (ln.vlines) {
      const vTop = y + (ln.vlineTopPad || 2);
      const vBottom = y - (ln.vlineHeight !== undefined ? ln.vlineHeight : lh) + 2;
      ln.vlines.forEach(vx => {
        pages[cur] += `0.7 w ${vx} ${vTop} m ${vx} ${vBottom} l S\n`;
      });
    }
    y -= lh;
  });

  const numPages = pages.length;
  const pageObjStart = 3;
  const contentObjStart = pageObjStart + numPages;
  const fontObjStart = contentObjStart + numPages;

  const objs = [];
  const kids = [];
  for (let i = 0; i < numPages; i++) {
    const pageId = pageObjStart + i;
    const contentId = contentObjStart + i;
    kids.push(`${pageId} 0 R`);
    objs[pageId] = `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 ${fontObjStart} 0 R /F2 ${fontObjStart + 1} 0 R >> >> /Contents ${contentId} 0 R >>`;
    objs[contentId] = `<< /Length ${pages[i].length} >>\nstream\n${pages[i]}endstream`;
  }

  objs[2] = `<< /Type /Pages /Kids [${kids.join(" ")}] /Count ${numPages} >>`;
  objs[fontObjStart] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>";
  objs[fontObjStart + 1] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>";

  const offsets = [];

    offsets[i] = pdf.length;
    pdf += `${i} 0 obj\n${objs[i]}\nendobj\n`;

// Loads a script exactly once, no matter how many times this is called
// concurrently or across separate shares — later callers just await the
// same in-flight/resolved promise instead of injecting duplicate tags.

  _scriptLoadPromises[src] = new Promise((resolve, reject) => {
    const existing = document.querySelector(`script[src="${src}"]`);
    if (existing) { resolve(); return; }
    const s = document.createElement("script");
    s.src = src;
    s.onload = () => resolve();
    s.onerror = () => { delete _scriptLoadPromises[src]; reject(new Error("Failed to load " + src)); };
    document.head.appendChild(s);

}

// Renders the SAME styled HTML used for Print/on-screen viewing into a
// PDF, instead of the separate hand-drawn text-and-lines PDF this file
// used to build — that approach could never really match the real
// invoice's fonts, colours, rounded cards, and table styling, which is
// exactly the gap between "what prints" and "what WhatsApp received"
// this exists to close. html2canvas/jsPDF are bundled locally (like
// jsQR) and pre-cached by the service worker, so this works offline
// after the first successful load, same as the rest of the app; the
// only network dependency is the very first fetch of these two files.
async function buildInvoicePDFFromHTML(b, roomObj, htmlOverride) {
  await Promise.all([
    loadScriptOnce("/html2canvas.min.js"),
    loadScriptOnce("/jspdf.umd.min.js")

  const doc = new DOMParser().parseFromString(html, "text/html");
  const sheet = doc.querySelector(".sheet");
  const actbar = sheet && sheet.querySelector(".actbar");
  if (actbar) actbar.remove(); // Print/Share buttons themselves shouldn't appear IN the PDF
  const styleEl = doc.querySelector("style");

  const container = document.createElement("div");
  container.style.cssText = "position:fixed;left:-9999px;top:0;width:820px;background:#fff;";
  if (styleEl) container.appendChild(styleEl.cloneNode(true));
  container.appendChild(sheet ? sheet.cloneNode(true) : doc.body.cloneNode(true));
  document.body.appendChild(container);

    // <style>) actually finish loading before the screenshot — otherwise
    // html2canvas can capture a frame still showing the fallback font.
    await (document.fonts && document.fonts.ready ? document.fonts.ready.catch(() => {}) : Promise.resolve());

    // split across as many pages as its full height needs — a tall
    // invoice (several charges, family members, a long GST summary)
    // isn't cropped or squeezed onto one page.

      // jsPDF clips addImage to the page bounds automatically.

// Stamp/signature image → small data URL. Keeps PNG (transparent
// background) when the source is PNG and the result stays small; else JPEG.
function shrinkStampImage(file) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type || "")) return reject(new Error("Please choose an image (PNG or JPG)"));
    const r = new FileReader();
    r.onerror = () => reject(new Error("Could not read the image"));
    r.onload = ev => {
      const img = new Image();
      img.onerror = () => reject(new Error("Could not read the image"));
      img.onload = () => {
        const sc = Math.min(1, 360 / Math.max(img.width, img.height, 1));
        const cv = document.createElement("canvas");
        cv.width = Math.max(1, Math.round(img.width * sc)); cv.height = Math.max(1, Math.round(img.height * sc));
        const g = cv.getContext("2d");
        const png = /png/i.test(file.type);
        if (!png) { g.fillStyle = "#fff"; g.fillRect(0, 0, cv.width, cv.height); }
        g.drawImage(img, 0, 0, cv.width, cv.height);
        let out = png ? cv.toDataURL("image/png") : "";
        if (!out || out.length > 160000) {
          const c2 = document.createElement("canvas"); c2.width = cv.width; c2.height = cv.height;
          const g2 = c2.getContext("2d"); g2.fillStyle = "#fff"; g2.fillRect(0, 0, c2.width, c2.height); g2.drawImage(cv, 0, 0);
          out = c2.toDataURL("image/jpeg", 0.8);
        }
        resolve(out);
      };
      img.src = ev.target.result;
    };
    r.readAsDataURL(file);
  });
}
// Draw the logo inside a box (x,y,bw,bh) keeping its own shape, centred.
function pdfLogo(doc, data, x, y, bw, bh) {
  try {
    const fmt = /png/i.test(data.slice(0, 20)) ? "PNG" : "JPEG";
    const p = doc.getImageProperties(data);
    const sc = Math.min(bw / (p.width || 1), bh / (p.height || 1));
    const w = (p.width || 1) * sc, h = (p.height || 1) * sc;
    doc.addImage(data, fmt, x + (bw - w) / 2, y + (bh - h) / 2, w, h);
  } catch (e) {}
}
// Digital stamp / signature above "Authorised Signatory" (paid add-on
// "digital_stamp"). BizzSathi admin uploads it in Bill Settings
// (adminConfig.stamp.img); if admin also ticks "owner may upload", the
// owner's own stamp from Settings (profile.hotelStamp) is used instead.
function invoiceStamp() {
  if (!hasFeature("digital_stamp")) return "";
  const ok = v => typeof v === "string" && /^data:image\/(png|jpe?g);base64,/i.test(v) && v.length < 400000 ? v : "";
  const st = (CURRENT_ADMINCFG && CURRENT_ADMINCFG.stamp) || {};
  const own = st.ownerUpload ? ok(CURRENT_PROFILE && CURRENT_PROFILE.hotelStamp) : "";
  return own || ok(st.img);
}

function classicInvoiceData(b, roomObj) {
  const { lines, G } = buildTaxedLineItems(b, roomObj, CURRENT_ROOMS);

    const igstAmt = igst ? Math.round((l.taxable * l.rate - l.cgst - l.sgst) * 100) / 100 : 0;
    return {
      date: fmtDate(l.date), sac: l.sac || "", desc: l.desc || "",
      roomAmt: isExtraBed ? 0 : l.taxable, extraBed: isExtraBed ? l.taxable : 0,

      igstP: igst ? l.rate * 100 : 0, igstAmt, total: l.total

  return {

    refund: Math.max(0, adv - grand), grand, payMode, settled,

// ── CREDIT NOTE ───────────────────────────────────────────────────
// GST-compliant credit note: references the ORIGINAL invoice (never
// modifies it), carries its own document number/series, and adjusts
// taxable value + CGST/SGST proportionally to the amount being credited.
// The proportional split uses the original bill's OWN GST-rate mix
// (roomAmt/foodAmt/otherAmt proportions), not a single flat rate — a
// partial credit on a mixed room+restaurant bill should reduce each
// component in the same ratio it was originally taxed at, not silently
// re-tax the credited amount at one rate.
function computeCreditNoteSplit(booking, creditAmount) {
  const gb = booking.gstBreakdown || {};
  const grand = booking.grandTotal || 0;
  if (grand <= 0) return { taxable: 0, cgst: 0, sgst: 0, ratio: 0 };
  const ratio = Math.min(1, Math.max(0, creditAmount / grand));
  const taxable = Math.round((booking.subTotal || 0) * ratio);
  const cgst = Math.round((gb.totalCGST || 0) * ratio);
  const sgst = Math.round((gb.totalSGST || 0) * ratio);
  return { taxable, cgst, sgst, ratio };
}

async function createCreditNote(booking, roomObj, creditAmount, reason, issuedBy) {
  if (!booking.invoiceNo) throw new Error("This booking has no invoice number. A credit note can only be issued against a finalized (checked-out) invoice.");
  if (!(creditAmount > 0) || creditAmount > booking.grandTotal) {
    throw new Error("Credit amount must be between ₹1 and ₹" + booking.grandTotal + ".");
  }
  if (!reason || !reason.trim()) throw new Error("A reason is required for the GST record.");

  const split = computeCreditNoteSplit(booking, creditAmount);
  const cnNumber = await generateCreditNoteNumber();
  const note = {
    id: "CN" + Date.now().toString(36).toUpperCase(),
    cnNumber,
    date: todayStr(),
    originalBookingId: booking.id,
    originalInvoiceNo: booking.invoiceNo,
    originalInvoiceDate: booking.checkOutActual || booking.checkOut,
    guestName: booking.name || "",
    roomId: booking.roomId,
    reason: reason.trim().slice(0, 300),
    amount: creditAmount,
    taxableValue: split.taxable,
    cgst: split.cgst,
    sgst: split.sgst,
    issuedBy: issuedBy || "Owner",
    createdAt: new Date().toISOString()
  };
  const existing = (await WS.get("creditNotes")) || [];
  const updated = [...existing, note];
  await WS.set("creditNotes", updated);
  AuditLog.add("CREDIT_NOTE_ISSUED", cnNumber + " against " + booking.invoiceNo + " for Rs." + creditAmount + " — " + reason.trim().slice(0, 60));
  return note;
}

function buildCreditNotePDFBlob(note, hotelProfile) {

  L.push({ text: "Reason: " + note.reason, size: 9, lh: 16 });
  L.push({ text: "", rule: true, gap: 4, lh: 16 });
  row("Taxable Value Adjusted", String(note.taxableValue));
  row("CGST Adjusted", String(note.cgst));
  row("SGST Adjusted", String(note.sgst));
  L.push({ text: "", rule: true, gap: 2, lh: 14 });
  row("TOTAL CREDIT", "Rs. " + note.amount, { size: 13, bold: true, lh: 18 });
  L.push({ text: "Amount in Words: " + amountInWords(note.amount), size: 8.5, lh: 14 });
  L.push({ text: "", gap: 8 });
  L.push({ text: "This credit note adjusts the original invoice named above. The original invoice itself remains unchanged.", size: 8, lh: 12 });
  L.push({ text: "Issued by: " + note.issuedBy, size: 8, lh: 12 });
  return buildSimplePDF(L);
}

function downloadCSV(csv, filename) {
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

  const [cnAmount, setCnAmount] = useState("");
  const [cnReason, setCnReason] = useState("");
  const [cnBusy, setCnBusy] = useState(false);
  const isOwner = !user || user.role === "Owner";

  // Archived months fetched on demand — the live `bookings` prop only
  // holds the recent window (see archiveOldBookings in App), so a date
  // range reaching further back needs to also pull in whichever monthly
  // archive documents it touches. Cached by month-key for the lifetime
  // of this view so re-adjusting the date pickers within the same
  // session doesn't re-fetch a month already retrieved.
  const [archivedExtra, setArchivedExtra] = useState([]);
  const [archiveLoading, setArchiveLoading] = useState(false);
  const archiveCacheRef = useRef({}); // monthKey -> bookings[]

  const earliestLiveDate = useMemo(() => {
    if (!bookings.length) return null;
    return bookings.reduce((min, b) => (b.checkIn && b.checkIn < min) ? b.checkIn : min, bookings[0].checkIn || "9999-12-31");
  }, [bookings]);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      if (!fromDate) { setArchivedExtra([]); return; }
      // Nothing archived could possibly be needed if the requested start
      // is already within what live already covers — skip the fetch
      // entirely in the common case (recent-range queries, which is most
      // day-to-day use of this screen).
      if (earliestLiveDate && fromDate >= earliestLiveDate) { setArchivedExtra([]); return; }

      const end = toDate || todayStr();
      const startD = new Date(fromDate + "T12:00:00");
      const endD = new Date(Math.min(new Date(end + "T12:00:00").getTime(),
        earliestLiveDate ? new Date(earliestLiveDate + "T12:00:00").getTime() : Date.now()));
      const monthKeys = [];
      const cursor = new Date(startD.getFullYear(), startD.getMonth(), 1);
      while (cursor <= endD) {
        monthKeys.push("bookings_archive_" + cursor.getFullYear() + "_" + String(cursor.getMonth() + 1).padStart(2, "0"));
        cursor.setMonth(cursor.getMonth() + 1);
      }
      const toFetch = monthKeys.filter(k => !(k in archiveCacheRef.current));
      if (toFetch.length === 0) {
        // Fully cached already — just re-merge from cache, no network needed.
        const merged = monthKeys.flatMap(k => archiveCacheRef.current[k] || []);
        rememberBookings(merged);
        if (!cancelled) setArchivedExtra(merged);
        return;
      }
      setArchiveLoading(true);
      try {
        const results = await Promise.all(toFetch.map(k => WS.getArchiveMonth(k).catch(() => null)));
        toFetch.forEach((k, i) => { archiveCacheRef.current[k] = Array.isArray(results[i]) ? results[i] : []; });
        const merged = monthKeys.flatMap(k => archiveCacheRef.current[k] || []);
        rememberBookings(merged);
        if (!cancelled) setArchivedExtra(merged);
      } finally {
        if (!cancelled) setArchiveLoading(false);
      }
    })();
    return () => { cancelled = true; };

    try {
      const amt = parseFloat(cnAmount);
      if (!Number.isFinite(amt)) { alert("Please enter a valid amount."); setCnBusy(false); return; }
      const note = await createCreditNote(booking, room, amt, cnReason, user?.name);
      const blob = buildCreditNotePDFBlob(note, profile);
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = note.cnNumber.replace(/\//g, "-") + ".pdf";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      alert("✅ Credit Note " + note.cnNumber + " issued (Rs." + note.amount + "). PDF downloaded.");
      setCnFor(null); setCnAmount(""); setCnReason("");
    } catch (e) {
      alert("❌ " + e.message);
    } finally {
      setCnBusy(false);
    }
  };

  const filtered = useMemo(() => {
    // archivedExtra is [] whenever the selected range doesn't reach back
    // past the live window (the overwhelming majority of the time), so
    // this concat is a no-op cost in the common case.
    let list = archivedExtra.length ? [...bookings, ...archivedExtra] : bookings;
    const term = q.trim().toLowerCase();
    if (term) {
      list = list.filter(b =>
        (b.name || "").toLowerCase().includes(term) ||
        (b.mobile || "").toLowerCase().includes(term) ||
        (b.roomId || "").toLowerCase().includes(term) ||
        (b.aadhaar || "").toLowerCase().includes(term) ||
        (b.id || "").toLowerCase().includes(term)
      );
    }

  }, [bookings, archivedExtra, q, fromDate, toDate]);

  const totalRevenue = useMemo(() => {

  };

function AccessControlView({
  permissions,
  savePermissions,
  user
}) {
  const [local, setLocal] = useState(permissions);
  // permissions now arrives live from the cloud listener, and useState only
  // takes its initial value — without this the Owner could be editing a
  // stale copy and save it back, silently undoing a change made elsewhere.
  useEffect(() => { setLocal(permissions); }, [permissions]);
  const [saved, setSaved] = useState(false);
  const toggle = (role, featureId) => {
    setLocal(p => {

.rop-veg[aria-pressed=true]{background:var(--veg);color:#fff}
.rop-veg .rop-sw{width:30px;height:18px;border-radius:9px;background:var(--line);position:relative;transition:background .2s}
.rop-veg .rop-sw:after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s}
.rop-veg[aria-pressed=true] .rop-sw{background:rgba(255,255,255,.35)}
.rop-veg[aria-pressed=true] .rop-sw:after{transform:translateX(12px)}
.rop-tabs{position:sticky;top:0;z-index:5;background:rgba(238,242,240,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:14px 18px 0;margin-top:6px;overflow-x:auto;border-bottom:1px solid var(--line)}
.rop-tab{background:none;border:0;padding:6px 0 11px;font-size:15px;font-weight:600;color:var(--mute);white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px}
.rop-tab[aria-current=true]{color:var(--sp);border-bottom-color:var(--sf)}
.rop-tab span{font-weight:500;opacity:.7;margin-left:4px}
.rop-banner{margin:14px 14px 0;background:var(--sft);color:#6B4206;border-radius:14px;padding:12px 14px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.rop-banner button{background:none;border:0;color:#6B4206;font-weight:600;text-decoration:underline;padding:4px}
.rop-sec{padding:22px 14px 0;scroll-margin-top:56px}
.rop-sec h2{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:22px;margin:0 4px 10px;color:var(--sp)}
.rop-sub{font-size:13.5px;font-weight:600;color:var(--mute);margin:14px 4px 6px}
.rop-list{background:#fff;border-radius:18px;padding:2px 14px;box-shadow:0 1px 0 var(--line)}
.rop-item{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid var(--line)}
.rop-item:last-child{border-bottom:0}
.rop-art{flex:0 0 auto;width:62px;height:62px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:31px;background:#E3EEEC}
.rop-art.food{background:var(--sft)}
.rop-art i{font-family:Fraunces,Georgia,serif;font-style:italic;font-size:24px;color:var(--sp2)}
.rop-body{flex:1;min-width:0}
.rop-name{font-weight:600;font-size:16px;line-height:1.25;display:flex;gap:7px;align-items:flex-start}
.rop-mark{flex:0 0 auto;margin-top:3px;width:13px;height:13px;border:1.5px solid var(--veg);border-radius:2px;display:inline-flex;align-items:center;justify-content:center}
.rop-mark:after{content:"";width:6px;height:6px;border-radius:50%;background:var(--veg)}
.rop-mark.nv{border-color:var(--nv)}.rop-mark.nv:after{background:var(--nv);border-radius:0;width:0;height:0;border-left:3.5px solid transparent;border-right:3.5px solid transparent;border-bottom:6px solid var(--nv);background:none}
.rop-price{font-weight:600;font-size:15px;color:var(--ink);margin-top:3px}
.rop-add{flex:0 0 auto;min-width:92px;height:40px;border-radius:12px;border:1.5px solid var(--sp);background:#fff;color:var(--sp);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px}
.rop-add:active{transform:scale(.96)}
.rop-step{flex:0 0 auto;min-width:92px;height:40px;border-radius:12px;background:var(--sp);color:#fff;display:flex;align-items:center;justify-content:space-between;animation:ropPop .22s ease-out}
.rop-step button{width:34px;height:40px;border:0;background:none;color:#fff;font-size:20px;font-weight:600;line-height:1}
.rop-step span{font-weight:700;min-width:16px;text-align:center}
.rop-step.light{background:var(--sft);color:var(--sp)}.rop-step.light button{color:var(--sp)}
.rop-empty{text-align:center;color:var(--mute);padding:34px 20px}
.rop-empty b{display:block;font-family:Fraunces,Georgia,serif;font-weight:600;font-size:20px;color:var(--sp);margin-bottom:6px}
.rop-bar{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:20;max-width:536px;margin:0 auto;background:var(--sp);color:#fff;border:0;border-radius:18px;padding:12px 12px 12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 14px 30px rgba(18,52,59,.35);animation:ropUp .28s ease-out;text-align:left;width:auto}
.rop-bar small{display:block;color:#C9D9D6;font-size:13px}
.rop-bar strong{font-size:18px;font-weight:700}
.rop-bar em{font-style:normal;background:var(--sf);color:var(--sp);font-weight:700;border-radius:12px;padding:11px 16px;font-size:15px;white-space:nowrap}
.rop-scrim{position:fixed;inset:0;z-index:30;background:rgba(18,52,59,.5);display:flex;align-items:flex-end;justify-content:center;animation:ropFade .2s ease-out}
.rop-sheet{background:#fff;width:100%;max-width:560px;max-height:88svh;overflow-y:auto;border-radius:24px 24px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));animation:ropUp .28s ease-out}
.rop-grip{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.rop-sh-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.rop-sh-head h2{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:22px;margin:0;color:var(--sp)}
.rop-x{width:40px;height:40px;border-radius:50%;border:0;background:var(--mist);color:var(--ink);font-size:20px}
.rop-line{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.rop-line .rop-body small{color:var(--mute);font-size:13.5px}
.rop-line .amt{font-weight:600;min-width:62px;text-align:right}
.rop-sheet textarea{width:100%;margin-top:14px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);font:inherit;font-size:15px;resize:none;background:var(--mist)}
.rop-sum{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px;font-size:15px}
.rop-sum b{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:24px;color:var(--sp)}
.rop-fine{font-size:13px;color:var(--mute);margin-top:4px}
.rop-place{width:100%;margin-top:16px;height:56px;border:0;border-radius:16px;background:var(--sf);color:var(--sp);font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.rop-place:disabled{opacity:.6}
.rop-orders{padding:28px 14px 0;scroll-margin-top:10px}
.rop-orders h2{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:22px;margin:0 4px 12px;color:var(--sp)}
.rop-ord{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 1px 0 var(--line)}
.rop-ord-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rop-live{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)}
.rop-live i{width:8px;height:8px;border-radius:50%;background:var(--veg);animation:ropPulse 1.6s ease-in-out infinite}
.rop-track{display:flex;gap:4px;margin:14px 0 6px}
.rop-track div{flex:1;height:6px;border-radius:3px;background:var(--line)}
.rop-track div.on{background:var(--sp)}
.rop-track div.now{background:var(--sf)}
.rop-stepname{font-size:13.5px;color:var(--mute)}
.rop-stepname b{color:var(--ink);font-weight:600}
.rop-ord-items{margin-top:10px;font-size:14.5px}
.rop-ord-items div{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.rop-ord-items span:last-child{color:var(--mute)}
.rop-ord-note{font-size:13.5px;color:var(--mute);margin-top:6px}
.rop-ord-bad{font-size:13.5px;color:var(--nv);margin-top:6px}
.rop-ord-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.rop-ord-foot b{font-size:17px}
.rop-btn{height:40px;padding:0 16px;border-radius:12px;font-weight:600;font-size:14.5px;border:1.5px solid var(--sp);background:#fff;color:var(--sp)}
.rop-btn.warn{border-color:var(--nv);color:var(--nv)}
.rop-toast{position:fixed;left:50%;top:16px;z-index:40;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;padding:12px 18px;font-weight:600;font-size:14.5px;box-shadow:0 10px 24px rgba(0,0,0,.25);animation:ropDrop .3s ease-out;max-width:calc(100% - 32px)}
.rop-note-card{margin:18px 14px 0;background:#fff;border-radius:18px;padding:22px 18px;text-align:center;line-height:1.55}
.rop-note-card b{display:block;font-family:Fraunces,Georgia,serif;font-weight:600;font-size:21px;color:var(--sp);margin-bottom:6px}
.rop-skel{height:84px;border-radius:18px;background:#fff;margin:14px;opacity:.7;animation:ropPulse 1.4s ease-in-out infinite}
@keyframes ropPop{from{transform:scale(.85);opacity:.4}to{transform:scale(1);opacity:1}}
@keyframes ropUp{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
