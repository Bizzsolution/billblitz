        // current data immediately upon subscribing (it doesn't need a
        // separate initial fetch). Calling BOTH .get() AND .onSnapshot() on
        // the same Firestore document path in close succession was causing
        // real "Target ID already exists" errors internally in the
        // Firestore SDK — which was silently breaking rendering partway
        // through screens like Storage Settings. Only "cu" (current user)
        // and "permissions" don't have their own listener, so those still
        // need a one-time get here.
        // Sequential (not Promise.all) — deliberately avoids ANY concurrent
        // Firestore operations at boot, which is what was triggering
        // internal SDK "Target ID already exists" errors.
        // SECURITY: a login session is NEVER restored from the "cu" document.
        // It lives in the hotel's shared cloud space, so trusting it let a
        // brand-new device (license key + phone only) open straight into
        // whoever last edited their name there — usually the Owner — without
        // a password. Every session now starts at the login screen (which is
        // what already happened after a reload). Stale copies are cleared
        // once per device.
        try {
          if (!localStorage.getItem("ab_cu_cleared_v1")) {
            localStorage.removeItem("ab_cu");
            const cuRef = WS._ref("cu");
            if (cuRef) cuRef.set({ value: null, ts: Date.now() }, { merge: true }).catch(() => {});
            localStorage.setItem("ab_cu_cleared_v1", "1");
          } else {
            localStorage.removeItem("ab_cu");
          }
        } catch (e) {}
        const perms = await WS.get("permissions");
        if (perms) setPermissions(perms);
        // NOTE: rooms/bookings instant-paint from localStorage now happens
        // in their useState lazy initializers (synchronous, runs before any
        // effect) — NOT here. Setting them here (after two awaited network
        // calls) used to create a race where this stale-cache write could
        // land AFTER the onSnapshot listener had already delivered fresh
        // cloud data, silently clobbering it back to old values.
        // Pull staff logins + audit trail from cloud (new device support)
        await CloudSync.hydrateOnBoot();
        // Silently restore local-folder access if this device already has
        // granted permission from a previous session — no user click
        // needed here since we're only checking status, not requesting it.
        if (localStorage.getItem("ab_local_folder")) {
          LocalFS.restoreHandle().catch(() => {});
        }
        // Check license expiry so hotels find out from the app itself,
        // well before scanning suddenly stops working. Also captures the
        // plan's enabled feature list for gating premium features below.
        checkLicenseExpiry().then(status => {
          if (status) {
            CURRENT_FEATURES = status.features || [];
            FeatCache.save(CURRENT_FEATURES);
            setEnabledFeatures(CURRENT_FEATURES);
          }
          if (status && (status.status === "expiring_soon" || status.status === "expired" || status.status === "revoked")) {
            setLicenseAlert(status);
          }
        }).catch(() => {});
      } finally {
        setReady(true);
      }
    })();
  }, []);
  // Re-check once every 6 hours while the app stays open (covers hotels
  // that keep a tab open for days without reloading)
  // Also re-checked every 5 minutes while the app is on screen, and whenever
  // the app comes back to the screen or is focused (at most every 30 s), so
  // a feature BizzSathi admin switches on/off reaches the hotel quickly.
  useEffect(() => {
    let last = Date.now();
    const run = () => {
      last = Date.now();
      checkLicenseExpiry().then(status => {
        if (status) {
          CURRENT_FEATURES = status.features || [];
          FeatCache.save(CURRENT_FEATURES);
          setEnabledFeatures(CURRENT_FEATURES);
        }
        if (status && (status.status === "expiring_soon" || status.status === "expired" || status.status === "revoked")) {
          setLicenseAlert(status);
        } else {
          setLicenseAlert(null);
        }
      }).catch(() => {});
    };
    const iv = setInterval(() => { if (document.visibilityState !== "hidden") run(); }, 5 * 60 * 1000);
    const onVis = () => { if (document.visibilityState !== "hidden" && Date.now() - last >= 30 * 1000) run(); };
    document.addEventListener("visibilitychange", onVis);
    window.addEventListener("focus", onVis);
    return () => { clearInterval(iv); document.removeEventListener("visibilitychange", onVis); window.removeEventListener("focus", onVis); };
  }, []);

  // Real-time Firestore listeners — sync across devices
  useEffect(() => {
    let unsubRooms = () => {};
    let unsubBk = () => {};
    let unsubRes = () => {};
    let unsubProfile = () => {};
    let unsubPerms = () => {};
    let unsubAdminCfg = () => {};
    let cancelled = false;
    let pollTimer = null;

    // window._db is set by a separate <script> tag that loads the Firebase
    // SDK over the network — on a slow/mobile connection, React can finish
    // mounting and run this effect BEFORE that finishes. Since this effect
    // has an empty dependency array (runs once), a plain "if (!window._db)
    // return" here used to mean: if Firebase wasn't ready in that split
    // second, real-time sync silently never activated for the rest of the
    // session — explaining why sync worked "sometimes" (fast network) and
    // not others (any delay loading the SDK). Poll instead of giving up.
    // Shared merge logic (used by both the live listener and the polling
    // fallback below) — cloud bookings have masked IDs and no photos (see
    // sanitizeBookingsForCloud); merge with whatever full local data this
    // device already has for the SAME booking.
    const mergeBookings = (data, prevLocal) => data.map(cloudB => {
      const localB = (prevLocal || []).find(b => b.id === cloudB.id);
      if (!localB) return cloudB;
      return {
        ...cloudB,
        aadhaar: localB.aadhaar || cloudB.aadhaar,
        photoFront: localB.photoFront || cloudB.photoFront,
        photoBack: localB.photoBack || cloudB.photoBack,
        signature: localB.signature || cloudB.signature,
        family: Array.isArray(cloudB.family) ? cloudB.family.map((cm, i) => {
          const lm = localB.family && localB.family[i];
          return lm ? { ...cm, idNumber: lm.idNumber || cm.idNumber, photoFront: lm.photoFront || cm.photoFront, photoBack: lm.photoBack || cm.photoBack } : cm;
        }) : cloudB.family
      };
    });

    // Owner deletes made while cloud saves were failing (v5.22–v5.24.1:
    // a deleted-entry stub carried `undefined` fields, which Firestore
    // rejects) exist only on this device. When the cloud copy still has
    // such an entry un-deleted, send the delete up once, now.
    // (Read once here, before the cloud listener refreshes this device's copy.)
    let pendingDelBusy = false;
    const bootStubs = {};
    try {
      const local = JSON.parse(localStorage.getItem("ab_bookings") || "[]");
      (Array.isArray(local) ? local : []).forEach(b => { if (b && b.status === "deleted" && b.id) bootStubs[b.id] = b; });
    } catch (e) {}
    const pushPendingDeletes = srv => {
      if (pendingDelBusy) return;
      const stubs = bootStubs;
      if (!srv.some(x => x && stubs[x.id] && x.status !== "deleted")) return;
      pendingDelBusy = true;
      WS.txArray("bookings", cur => cur.map(x => (x && stubs[x.id] && x.status !== "deleted") ? stubs[x.id] : x))
        .then(r => { if (r) setSyncErr(false); })
        .catch(e => console.warn("pending deletes:", e && e.message))
        .finally(() => { pendingDelBusy = false; });
    };
    const trySetup = () => {
      if (cancelled) return;
      if (!window._db) {
        pollTimer = setTimeout(trySetup, 200);
        return;
      }
      setSyncing(true);
      // Small stagger between each listener registration — registering
      // several onSnapshot listeners in the exact same tick is itself a
      // form of concurrent Firestore SDK activity, which is the general
      // pattern Firebase's own bug reports tie to the "Target ID already
      // exists" issue. Spreading registration out costs a few hundred ms
      // at boot but meaningfully reduces how much load hits the SDK at once.
      unsubRooms = WS.onSnapshot("rooms", data => {
        if (data) setRooms(data);
        setSyncing(false);
        setSyncErr(false);
      });
      setTimeout(() => {
        if (cancelled) return;
        unsubRes = WS.onSnapshot("reservations", data => {
          if (Array.isArray(data)) setReservations(data);
        });
      }, 450);
      setTimeout(() => {
        if (cancelled) return;
        unsubBk = WS.onSnapshot("bookings", data => {
          if (data) setBookings(prevLocal => mergeBookings(data, prevLocal));
          setSyncing(false);
          if (Array.isArray(data)) pushPendingDeletes(data);
        });
      }, 300);
      // Profile (hotel name/address/GSTIN + GST pricing mode) — WITHOUT this,
      // a setting change (e.g. Owner switching GST Extra ↔ GST Included) would
      // only reach OTHER already-open devices on their next reload, meaning
      // Owner and Manager could briefly see different totals for the exact
      // same active booking. This makes it apply everywhere instantly.
      setTimeout(() => {
        if (cancelled) return;
        unsubProfile = WS.onSnapshot("profile", data => {
          if (!data) return;
          if (applyCloudProfileRef.current) applyCloudProfileRef.current(data); else setProfile(p => ({ ...p, ...data }));
          // BUG FIX (2026-09): this listener used to update ONLY React state.
          // The booking-requests listener and handleRequestDecision below both
          // read localStorage.publicBookingToken directly (not React state) —
          // so a SECOND device, which never generated the link itself and only
          // ever received it through this cloud listener, had the token in
          // `profile` but an empty localStorage key forever, silently missing
          // every new booking-request notification and failing to save
          // approve/decline decisions. Persisting it here (same key saveProfile
          // already uses) keeps every device's localStorage copy correct too.
          if (typeof data.publicBookingToken === "string") {
            try { localStorage.setItem("publicBookingToken", data.publicBookingToken); } catch {}
          }
        });
      }, 600);
      // Access-control permissions need a live listener too. Without one,
      // WS.get("permissions") returns the device's cached localStorage copy
      // and never re-checks the server — so once a staff device had cached
      // a permission set, ANY later change by the Owner (including turning
      // a tab back ON) never reached that device. Re-enabling appeared
      // permanently broken for exactly this reason.
      setTimeout(() => {
        if (cancelled) return;
        unsubPerms = WS.onSnapshot("permissions", data => {
          if (data) setPermissions(data);
        });
      }, 900);
      // Bill settings / booking-ID prefix / floor names set by BizzSathi admin.
      setTimeout(() => {
        if (cancelled) return;
        unsubAdminCfg = WS.onSnapshot("adminConfig", data => {
          if (!data || typeof data !== "object" || Array.isArray(data)) return;
          CURRENT_ADMINCFG = data;
          setAdminCfgTick(x => x + 1);
        });
      }, 1200);
      // Booking requests listener moved to its own effect below, keyed on
      // profile.publicBookingToken — see that effect's comment for why a
      // one-time, mount-only subscription here missed a second device.
      // Connection state monitor
      window._db.enableNetwork().then(() => setSyncErr(false)).catch(() => setSyncErr(true));
    };
    trySetup();

    // POLLING SAFETY NET — Firebase's own engineering team has permanently
    // marked the "Target ID already exists" crash as "wontfix" (confirmed
    // on their public issue tracker), meaning the real-time onSnapshot
    // listener above can be silently disrupted by a bug that is, by
    // Firebase's own admission, never going to be fixed at the SDK level.
    // Rather than depend entirely on that fragile stream, this does a
    // plain one-time refetch every 20 seconds as a backup — so even if a
    // real-time update is ever missed or the listener gets knocked out,
    // this device is never more than a short while out of date. This is a
    // deliberate, standard workaround for exactly this class of platform
    // limitation, not a workaround for anything wrong in our own code.
    //
    // IMPORTANT — only polls while the tab is actually visible/focused
    // (document.hidden check). On the free Firestore plan (50k reads/day
    // total, shared across every app on the project), polling around the
    // clock even while a phone's screen is off or the tab is backgrounded
    // would burn through the daily quota after only 2-3 hotels. Pausing
    // when hidden cuts this dramatically for realistic usage, since staff
    // don't keep the screen actively open every second of business hours.
    const pollInterval = setInterval(async () => {
      if (cancelled || !window._db || document.hidden) return;
      try {
        // Sequential (NOT Promise.all) — concurrent Firestore calls are
        // exactly what triggers the "Target ID already exists" bug this
        // polling exists to work around. Doing two at once here would
        // undermine the whole point and add to the load on the listeners
        // above. One at a time, with a small gap between them.
        const freshRooms = await window._db.collection("hotels").doc(WS._hid()).collection("data").doc("rooms").get({ source: 'server' });
        if (!cancelled && freshRooms.exists) setRooms(freshRooms.data().value);
        await new Promise(r => setTimeout(r, 500));
        const freshBookings = await window._db.collection("hotels").doc(WS._hid()).collection("data").doc("bookings").get({ source: 'server' });
        if (!cancelled && freshBookings.exists) setBookings(prevLocal => mergeBookings(freshBookings.data().value, prevLocal));
      } catch (e) { /* silent — this is a best-effort backup, live listener is primary */ }
    }, 20000);
    // Also do one immediate poll whenever the tab becomes visible again
    // (e.g. phone screen turned back on) — catches up right away instead
    // of waiting up to 20s after someone returns to the app.
    // Hotel profile (name, address, GSTIN, logo…) gets the same backup as
    // rooms/bookings — its live listener can be knocked out by the same SDK
    // bug, after which a Manager's phone never saw the Owner's changes until
    // the app was fully closed and reopened. It is a bigger document
    // (images), so it is re-read less often: when the app comes back to the
    // screen and every 2 minutes while it stays open.
    let lastProfilePull = 0;
    const pullProfile = () => {
      if (cancelled || !window._db || document.hidden) return;
      lastProfilePull = Date.now();
      window._db.collection("hotels").doc(WS._hid()).collection("data").doc("profile").get({ source: 'server' })
        .then(s => { if (!cancelled && s.exists && applyCloudProfileRef.current) applyCloudProfileRef.current(s.data().value); }).catch(() => {});
    };
    const profileInterval = setInterval(() => { if (Date.now() - lastProfilePull >= 110000) pullProfile(); }, 30000);
    const onVisible = () => {
      if (!document.hidden && !cancelled && window._db) {
        window._db.collection("hotels").doc(WS._hid()).collection("data").doc("rooms").get({ source: 'server' })
          .then(s => { if (!cancelled && s.exists) setRooms(s.data().value); }).catch(() => {});
        if (Date.now() - lastProfilePull >= 15000) setTimeout(pullProfile, 600);
      }
    };
    document.addEventListener("visibilitychange", onVisible);
    window.addEventListener("focus", onVisible);

    return () => {
      cancelled = true;
      if (pollTimer) clearTimeout(pollTimer);
      clearInterval(pollInterval);
      clearInterval(profileInterval);
      document.removeEventListener("visibilitychange", onVisible);
      window.removeEventListener("focus", onVisible);
      unsubRooms();
      unsubBk();
      unsubRes();
      unsubProfile();
      unsubPerms();
      unsubAdminCfg();
    };
  }, []);

  // Booking requests (from the public direct-booking link) live in the
  // token-scoped `public_booking/{token}/requests` subcollection, NOT
  // under this hotel's own data tree — see PublicBookingPage for why that
  // separation exists (the public link must not be able to reach anything
  // the license key protects). So this listener is set up separately from
  // the WS helpers, which are all hardwired to hotels/{licenseKey}/data/*.
  //
  // BUG FIX (2026-09): this used to be a ONE-TIME subscription inside the
  // mount-only effect above, reading localStorage.publicBookingToken at
  // that single moment. On the device that generated the link, the token
  // was already in localStorage by then, so it worked. On a SECOND device
  // logged in with the same license key, the token only ever arrives later
  // via the cloud profile sync — so the one-time read saw an empty string,
  // never subscribed, and no amount of later syncing fixed it because the
  // effect never ran again. Keying this effect on `profile.publicBookingToken`
  // (React state, kept current by the profile listener above) makes it
  // (re)subscribe the moment the token becomes known on ANY device,
  // including one where it arrives seconds after login rather than at
  // mount. Also runs again correctly if the token itself is ever rotated.
  // AUDIT-2 (F2): enquiries are readable only by the signed-in owning
  // hotel, and HotelAuth.signIn() completes asynchronously — often AFTER
  // this listener first registers. A listener rejected with
  // permission-denied is dead for good, so it is re-created whenever the
  // Firebase Auth identity changes (independent review finding S1).
  const [authUid, setAuthUid] = useState("");
  useEffect(() => {
    if (!window._auth || typeof window._auth.onAuthStateChanged !== "function") return;
    const off = window._auth.onAuthStateChanged(u => setAuthUid(u && u.uid ? u.uid : ""));
    return () => { try { off && off(); } catch (e) {} };
  }, []);
  useEffect(() => {
    const tok = (profile?.publicBookingToken || "").trim();
    if (!tok || !window._db) { setBookingRequests([]); return; }
    let unsub = () => {};
    try {
      unsub = window._db.collection("public_booking").doc(tok)
        .collection("requests").onSnapshot(snap => {
          const list = [];
          snap.forEach(d => list.push(d.data()));
          // Newest first, so the Dashboard shows the most recent
          // enquiries at the top of the pending queue.
          list.sort((a, b) => String(b.createdAt || "").localeCompare(String(a.createdAt || "")));
          setBookingRequests(list);
          try { localStorage.setItem("ab_bookingRequests", JSON.stringify(list)); } catch {}
        }, err => console.warn("Booking requests listener:", err.message));
    } catch (e) { console.warn("Booking requests listener setup:", e.message); }
    return () => unsub();
  }, [profile?.publicBookingToken, authUid]);

  // Strips everything that must NEVER leave this device before syncing to
  // Firestore: raw Aadhaar/ID numbers (masked instead) and all photos
  // (signature, Aadhaar front/back, family member ID photos). Full data
  // still lives in localStorage on this device via setSplit's localVal.
  const sanitizeBookingsForCloud = (bk) => cloudSafe(bk.map(b => {
    const { photoFront, photoBack, signature, ...rest } = b;
    return {
      ...rest,
      aadhaar: b.aadhaar ? maskAadhaar(b.aadhaar) : b.aadhaar,
      family: Array.isArray(b.family) ? b.family.map(m => {
        const { photoFront, photoBack, ...mRest } = m;
        return { ...mRest, idNumber: m.idNumber ? maskAadhaar(m.idNumber) : m.idNumber };
      }) : b.family
    };
  }));

  // ── ARCHIVING — keeps the "live" bookings document small forever ──
  // The single-document design (every booking a hotel has EVER had, in
  // one Firestore doc) is what the 50%-capacity warning above exists
  // for — it doesn't fix the ceiling, only warns about it. This is that
  // fix: once a checked-out booking is older than the live window, it
  // moves OUT of the live document into a small, dated archive document
  // (one per calendar month), so the live document a hotel's daily
  // check-in/checkout depends on never grows past a small, predictable
  // size no matter how many YEARS the hotel has used the app.
  //
  // The overriding rule for all of this: a guest register is a legal
  // retention record, so a record may be MOVED but is never dropped —
  // every path below either keeps a booking exactly where it was or
  // successfully confirms it landed in its new home before removing it
  // from the old one. Anything that can't be confirmed leaves the
  // booking right where it already was, to be retried on a later save,
  // rather than risk losing it.
  const ARCHIVE_WINDOW_DAYS = 90;
  // One archive document per calendar month a booking was checked out
  // in — e.g. "bookings_archive_2026_03" — so no single archive
  // document can grow large either; each only ever holds one month's
  // worth of a hotel's checkouts.
  const getArchiveMonthKey = (dateStr) => {
    const d = new Date(dateStr + "T12:00:00");
    if (isNaN(d)) return null;
    return "bookings_archive_" + d.getFullYear() + "_" + String(d.getMonth() + 1).padStart(2, "0");
  };

  // Splits `bookings` into what should stay in the live document and
  // what should move to archives, and SAFELY performs that move —
  // archive writes are confirmed to succeed before anything is removed
  // from the returned "live" list. Never throws: any failure just means
  // "nothing changed this time, try again on the next save."
  //
  // Capped at moving ARCHIVE_BATCH_CAP records per call (not per
  // month — total) so that a hotel with a large pre-existing backlog
  // (from before this existed, or from a long period offline) gets
  // migrated gradually across several ordinary check-in/checkout saves
  // instead of attempting one very large write the first time this runs.
  const ARCHIVE_BATCH_CAP = 300;
  // SCALE FIX: a typical booking is ~3 KB in the cloud, so a 90-day live
  // window crosses Firestore's 1 MiB per-document ceiling at about 15–20
  // rooms — after which EVERY check-in/checkout silently failed to reach
  // the cloud. The live window now shrinks automatically (90 → 1 day,
  // checked-out stays only) until the live document is back under
  // LIVE_SOFT_BYTES. Active stays are never archived.
  const LIVE_SOFT_BYTES = 450000;
  const ARCHIVE_PART_BYTES = 700000;
  const cloudBytes = arr => { try { return JSON.stringify(sanitizeBookingsForCloud(arr)).length; } catch (e) { return 0; } };
  const archiveOldBookings = async (allBookings) => {
    const outTime = b => (b.status === "checkedout" && b.checkOutActual) ? new Date(b.checkOutActual + "T12:00:00").getTime() : NaN;
    let windowDays = ARCHIVE_WINDOW_DAYS;
    if (cloudBytes(allBookings) > LIVE_SOFT_BYTES) {
      for (const w of [60, 45, 30, 14, 7, 3, 1]) {
        windowDays = w;
        const cut = Date.now() - w * 86400000;
        const remain = allBookings.filter(b => { const t = outTime(b); return isNaN(t) || t >= cut; });
        if (cloudBytes(remain) <= LIVE_SOFT_BYTES) break;
      }
    }
    const cutoff = Date.now() - windowDays * 86400000;
    const eligible = [];
    allBookings.forEach(b => {
      const t = outTime(b);
      if (!isNaN(t) && t < cutoff) eligible.push(b);
    });
    // Oldest first, so a capped batch always moves the oldest records.
    eligible.sort((a, b) => outTime(a) - outTime(b));
    if (eligible.length === 0) return { live: allBookings, archivedCount: 0, archivedIds: new Set() };

    const batch = eligible.slice(0, ARCHIVE_BATCH_CAP);
    const byMonth = new Map(); // monthKey -> [bookings]
    for (const b of batch) {
      const key = getArchiveMonthKey(b.checkOutActual);
      if (!key) continue; // malformed date — leave it in live rather than risk misfiling it
      if (!byMonth.has(key)) byMonth.set(key, []);
      byMonth.get(key).push(b);
    }

    const successfullyArchivedIds = new Set();
    for (const [monthKey, monthBookings] of byMonth) {
      try {
        // Read the month's base document and every part (force-server:
        // never trust a stale local cache for a merge).
        const base = await WS.getRawServer(monthKey);
        const partCount = (base && Number(base.parts)) || 1;
        const partKey = i => i === 1 ? monthKey : monthKey + "_p" + i;
        const parts = [Array.isArray(base?.value) ? base.value : []];
        for (let i = 2; i <= partCount; i++) {
          const d = await WS.getRawServer(partKey(i));
          parts.push(Array.isArray(d?.value) ? d.value : []);
        }
        const existingIds = new Set(parts.flat().map(x => x.id));
        // Only append records not already present in that month's
        // archive — safe to re-run this whole function against a month
        // that was partially archived before (e.g. a previous attempt
        // succeeded for some records this session but not all).
        const toAppend = monthBookings.filter(b => !existingIds.has(b.id));
        if (toAppend.length === 0) {
          // Already fully archived (from an earlier, interrupted attempt)
          // — safe to remove from live even though nothing new was written.
          monthBookings.forEach(b => successfullyArchivedIds.add(b.id));
          continue;
        }
        if (!WS._ref(monthKey)) continue; // no Firestore connection — leave these in live, retry later
        // Append into the last part; open a new part whenever one would
        // pass ARCHIVE_PART_BYTES (each Firestore document caps at 1 MiB).
        const clean = sanitizeBookingsForCloud(toAppend);
        let idx = parts.length - 1;
        const dirty = new Set();
        for (const rec of clean) {
          const recBytes = JSON.stringify(rec).length + 1;
          if (parts[idx].length && JSON.stringify(parts[idx]).length + recBytes > ARCHIVE_PART_BYTES) { parts.push([]); idx = parts.length - 1; }
          parts[idx] = [...parts[idx], rec];
          dirty.add(idx);
        }
        // Write the parts first; only then record the new part count on
        // the base document, so a reader never looks for a part that is
        // not there yet.
        for (const i of [...dirty].sort((a, b) => b - a)) {
          if (i === 0) continue;
          await WS._ref(partKey(i + 1)).set({ value: cloudSafe(parts[i]), ts: Date.now() }, { merge: true });
        }
        const baseUpdate = { ts: Date.now(), parts: parts.length };
        if (dirty.has(0)) baseUpdate.value = parts[0];
        await WS._ref(monthKey).set(baseUpdate, { merge: true });
        // Only mark as archived AFTER the write above has resolved
        // successfully — this is the exact line that guarantees no
        // booking is ever removed from "live" without first being
        // durably saved somewhere else.
        monthBookings.forEach(b => successfullyArchivedIds.add(b.id));
      } catch (e) {
        console.warn("Archiving " + monthKey + " failed, will retry next save:", e.message);
        // Deliberately no re-throw — a failed month just means those
        // specific records stay in "live" and get tried again next time
        // saveBk runs, which happens constantly during normal use.
      }
    }

    if (successfullyArchivedIds.size === 0) return { live: allBookings, archivedCount: 0, archivedIds: new Set() };
    const live = allBookings.filter(b => !successfullyArchivedIds.has(b.id));
    return { live, archivedCount: successfullyArchivedIds.size, archivedIds: successfullyArchivedIds };
  };

  // Root-cause fix for localStorage quota exhaustion: every checked-in
  // guest's photos get embedded in the "bookings" localStorage cache, which
  // otherwise grows FOREVER as a hotel does more check-ins over months —
  // eventually filling the browser's ~5-10MB limit entirely, which then
  // breaks EVEN TINY writes like the session-timeout timestamp (exactly
  // what caused a real "Failed to execute setItem... exceeded the quota"
  // crash on login for one hotel). Photos for OLD, already-checked-out
  // guests are stripped from this local cache — they remain fully safe in
  // the local folder backup (if enabled) and as masked text in the cloud;
  // only the redundant local-cache COPY of old photos is pruned.
  const pruneOldPhotosForLocalStorage = (bookings, retentionDays) => {
    const cutoff = Date.now() - retentionDays * 86400000;
    return bookings.map(b => {
      const isOld = b.status === "checkedout" && b.checkOutActual && new Date(b.checkOutActual).getTime() < cutoff;
      if (!isOld) return b;
      const { photoFront, photoBack, signature, ...rest } = b;
      return {
        ...rest,
        family: Array.isArray(b.family) ? b.family.map(m => {
          const { photoFront, photoBack, ...mRest } = m;
          return mRest;
        }) : b.family
      };
    });
  };

  // Save helpers — writes to localStorage + Firestore simultaneously
  const saveRooms = async r => {
    setRooms(r);
    setSyncing(true);
    await WS.set("rooms", r);
    setSyncing(false);
  };
  // Change ONE room's status without overwriting the rest of the list from
  // this device's possibly-stale copy (another device may have just
  // checked a guest into a different room).
  const patchRoom = async (roomId, patch) => patchRoomsMany([[roomId, patch]]);
  // several rooms in ONE write (group check-in / combined checkout)
  const patchRoomsMany = async (pairs) => {
    const apply = arr => arr.map(r => { const p = pairs.find(x => x[0] === r.id); return p ? { ...r, ...p[1] } : r; });
    setSyncing(true);
    const res = await WS.txArray("rooms", srv => apply(srv.length ? srv : rooms));
    if (res === null) { await saveRooms(apply(rooms)); return; }
    setRooms(res);
    try { localStorage.setItem("ab_rooms", JSON.stringify(res)); } catch (e) {}
    setSyncing(false);
  };
  // Room edit / add room: change ONLY that room's own details (number,
  // floor, name, type, rate, photos) on the server's latest copy. It used to
  // save this device's whole room list, which could undo a check-in or
  // checkout another device had just done (a guest's room showing free, or
  // an empty room stuck on "occupied"). Status/bookingId are never taken
  // from the edit screen.
  const saveRoomEdit = async (updated, originalId, isNew) => {
    const EDITABLE = ["id", "fl", "name", "type", "rate", "photos"];
    let problem = null;
    const apply = arr => {
      problem = null;
      if (isNew) {
        if (arr.some(r => r.id === updated.id)) { problem = "Room number '" + updated.id + "' already exists — please choose another number"; return arr; }
        return [...arr, { ...updated, status: "empty", bookingId: null }];
      }
      const cur = arr.find(r => r.id === originalId);
      if (!cur) { problem = "Room " + originalId + " was not found — it may have been changed on another device. Please refresh and try again."; return arr; }
      if (updated.id !== originalId) {
        if (arr.some(r => r.id === updated.id)) { problem = "Room number '" + updated.id + "' already exists — please choose another number"; return arr; }
        if (cur.status === "occupied") { problem = "Room " + originalId + " has a guest — its number cannot be changed. Please check out first."; return arr; }
      }
      const patch = {};
      EDITABLE.forEach(k => { if (k in updated) patch[k] = updated[k]; });
      return arr.map(r => r.id === originalId ? { ...r, ...patch } : r);
    };
    setSyncing(true);
    const res = await WS.txArray("rooms", srv => apply(srv.length ? srv : rooms));
    if (res === null) {
      // Offline / no transaction possible: same edit on this device's copy.
      const out = apply(rooms);
      if (problem) { setSyncing(false); alert(problem); return false; }
      await saveRooms(out);
      return true;
    }
    setRooms(res);
    try { localStorage.setItem("ab_rooms", JSON.stringify(res)); } catch (e) {}
    setSyncing(false);
    if (problem) { alert(problem); return false; }
    return true;
  };
  const saveBk = async rawB => {
    // Auto-archive: moves any checked-out booking older than the live
    // window into its monthly archive document — see archiveOldBookings
    // above for the safety guarantees (nothing is ever removed from live
    // without a confirmed successful archive write first). This runs on
    // every save, but is a fast no-op on the overwhelming majority of
    // calls (there's usually nothing old enough to move); the extra
    // archive read/write only happens on the rare save where there
    // actually is something to relocate.
    const { live: b, archivedCount, archivedIds } = await archiveOldBookings(rawB);
    if (archivedCount > 0) {
      AuditLog.add("BOOKINGS_ARCHIVED", archivedCount + " record(s) moved to monthly archive");
    }
    setBookings(b);
    setSyncing(true);
    // Progressively more aggressive pruning if storage is running low —
    // 14 days retention first, then 3, then 0 (active bookings only) as a
    // last resort — so the app never silently stops saving new check-ins
    // just because old guests' photos filled up the browser's storage.
    let localSaved = false;
    for (const days of [14, 3, 0]) {
      const trimmed = pruneOldPhotosForLocalStorage(b, days);
      try {
        localStorage.setItem("ab_bookings", JSON.stringify(trimmed));
        localSaved = true;
        break;
      } catch (e) { console.warn(`Local bookings save (retain ${days}d):`, e.message); }
    }
    if (!localSaved) console.warn("⚠️ Could not save bookings locally even after aggressive pruning — device storage is critically full. Cloud sync still attempted below.");
    try {
      const ref = WS._ref("bookings");
      const cloudPayload = sanitizeBookingsForCloud(b);
      // Early warning for a genuinely different problem than the local
      // pruning above: Firestore caps a SINGLE document at 1 MiB, and
      // every checked-out guest this hotel has EVER had lives in this
      // ONE document (photos are already stripped by
      // sanitizeBookingsForCloud, but the records themselves accumulate
      // forever). A busy hotel can approach that ceiling within a year
      // or two of steady use, at which point every check-in/checkout
      // would start failing to sync — with no obvious cause from the
      // Owner's side. Warning well before that point (at 50% — tested
      // against realistic record sizes, this leaves roughly a year of
      // runway at typical busy-hotel volumes, not just a few weeks) turns a
      // future silent, mysterious failure into something support can
      // proactively archive old records for ahead of time. This does
      // NOT delete or move anything by itself — it only warns; guest
      // registers are a legal retention requirement, and safely
      // archiving them needs care and its own release, not a rushed
      // in-place rewrite of daily check-in/checkout logic.
      const approxBytes = new Blob([JSON.stringify(cloudPayload)]).size;
      const FIRESTORE_DOC_LIMIT = 1048576;
      if (approxBytes > FIRESTORE_DOC_LIMIT * 0.5 && user?.role === "Owner") {
        const warnKey = "ab_bookingsSizeWarnedAt";
        const lastWarned = Number(localStorage.getItem(warnKey) || 0);
        if (Date.now() - lastWarned > 24 * 60 * 60 * 1000) { // once/day at most
          localStorage.setItem(warnKey, String(Date.now()));
          setTimeout(() => alert(
            "⚠️ Storage warning: your booking history has become very large (" +
            Math.round(approxBytes / 1024) + " KB). Beyond a limit, new check-ins/checkouts may stop saving to the cloud.\n\n" +
            "Please contact BizzSathi support to archive old guest records."
          ), 500);
        }
      }
      // MULTI-DEVICE FIX: merge into the server copy inside a transaction
      // instead of overwriting it — bookings another device added (or a
      // checkout it did) since this device last synced are kept. Records
      // this save deliberately moved to the archive are not brought back.
      const merged = await WS.txArray("bookings", srv => mergeBookingLists(cloudPayload, srv, archivedIds || new Set()));
      if (merged === null) {
        if (ref) await ref.set({ value: cloudPayload, ts: Date.now() }, { merge: true });
      } else {
        const have = new Set(b.map(x => x.id));
        const extra = merged.filter(x => !have.has(x.id));
        const changed = merged.filter(x => have.has(x.id) && x.status === "checkedout" && (b.find(y => y.id === x.id) || {}).status !== "checkedout");
        if (extra.length || changed.length) {
          setBookings(prev => {
            const byId = new Map(prev.map(x => [x.id, x]));
            changed.forEach(x => byId.set(x.id, { ...x, photoFront: byId.get(x.id)?.photoFront, photoBack: byId.get(x.id)?.photoBack, signature: byId.get(x.id)?.signature }));
            const out = [...byId.values()];
            extra.forEach(x => { if (!byId.has(x.id)) out.push(x); });
            return out;
          });
        }
      }
      setSyncErr(false);
    } catch (e) {
      console.warn("FB set bookings:", e.message);
      // Data is still safe on this device, but tell staff instead of
      // failing silently.
      setSyncErr(true);
      try {
        const k = "ab_bookingsSyncFailAlertAt";
        if (Date.now() - Number(localStorage.getItem(k) || 0) > 6 * 3600 * 1000) {
          localStorage.setItem(k, String(Date.now()));
          setTimeout(() => alert("⚠️ Bookings could not be saved to the cloud (" + String(e.message || "").slice(0, 80) + ").\nYour data is safe on this device. Please check your internet; if the problem continues, inform BizzSathi support."), 300);
        }
      } catch (x) {}
    }
    setSyncing(false);
    AuditLog.add('CHECKIN', b[b.length - 1]?.name || 'guest');
  };
  const savePermissions = async p0 => {
    const p = { ...(p0 || {}) };
    Object.keys(p).forEach(r => { if (Array.isArray(p[r]) && p[r].indexOf("qrv1") < 0) p[r] = p[r].concat(["qrv1"]); if (Array.isArray(p[r]) && p[r].indexOf("bqv1") < 0) p[r] = p[r].concat(["bqv1"]); });
    setPermissions(p);
    await WS.set("permissions", p);
    AuditLog.add('ACCESS_CONTROL_CHANGED', user?.u || '');
  };

  // Actions
  const handleCheckIn = async form => {
    // Guard against two devices checking in different guests to the SAME
    // room at nearly the same moment. Each device's own `rooms` state can
    // look "empty" right up until the other device's write actually syncs
    // in (the 20s poll / onSnapshot listener isn't instant), so trusting
    // that local state alone lets both check-ins go through — one room
    // ends up "occupied" (whichever write landed last) while BOTH bookings
    // stay "active", which is exactly the occupied-vs-active-count drift
    // this was built to catch. A forced server read (bypassing the
    // localStorage cache every other WS.get call uses) gets the true
    // current state right before committing. If the read fails (offline,
    // no connectivity) this falls back to proceeding on local state, since
    // blocking a legitimate check-in during a connectivity hiccup would be
    // worse than the rare race this guards against.
    try {
      const freshRooms = await WS.get("rooms", true);
      if (Array.isArray(freshRooms)) {
        const freshRoom = freshRooms.find(r => r.id === form.roomId);
        if (freshRoom && freshRoom.status === "occupied") {
          alert("This room was just booked from another device. Please select another room.");
          return;
        }
        const busyX = (form._extraRooms || []).find(x => { const fr = freshRooms.find(r => r.id === x.roomId); return fr && fr.status === "occupied"; });
        if (busyX) { alert("Room " + busyX.roomId + " was just booked from another device. Please select another room."); return false; }
      }
    } catch (e) { /* offline or read failed — proceed on local state */ }
    const id = form._tempId || uid();
    const {
      _tempId,
      _signature,
      _photoF,
      _photoB,
      _resId,
      _extraRooms,
      _kioskId,
      ...clean
    } = form;
    const nb = {
      ...clean,
      id,
      status: "active",
      charges: [],
      createdAt: new Date().toISOString()
    };
    // Group booking: every extra room is its own booking record (so rooms,
    // registers, reports and checkout keep working per room) sharing the
    // main booking's ID as groupId. Guest details are copied; ID photos,
    // signature, family members and advance stay on the main room only.
    const extras = Array.isArray(_extraRooms) ? _extraRooms.filter(x => x && x.roomId && x.roomId !== form.roomId) : [];
    const members = [];
    if (extras.length) {
      const groupRooms = [form.roomId, ...extras.map(x => x.roomId)];
      nb.groupId = id; nb.groupRooms = groupRooms;
      extras.forEach(x => {
        members.push({
          ...clean, id: id + "-" + String(x.roomId).replace(/[^A-Za-z0-9]/g, ""), status: "active", charges: [], createdAt: nb.createdAt,
          roomId: x.roomId, roomTotal: Number(x.roomTotal) || 0, adults: x.adults || "1", children: "0",
          family: [], advances: [], advance: 0, groupId: id, groupRooms
        });
      });
    }
    // Embed photos directly in booking object (most reliable storage)
    if (_signature) nb.signature = _signature;
    if (_photoF) nb.photoFront = _photoF;
    if (_photoB) nb.photoBack = _photoB;
    // nb.family already has photo embedded per member (set directly in
    // CheckInView.submit()) — no fragile side-channel matching needed here.
    // Also try separate vault storage (might fail on quota, but redundant)
    if (_signature) {
      try {
        await WS.setRawImg(`sig_${id}`, _signature);
      } catch (e) {
        console.warn("Sig vault:", e);
      }
    }
    if (_photoF) {
      try {
        await WS.setRawImg(`img_front_${id}`, _photoF);
      } catch (e) {
        console.warn("PhotoF vault:", e);
      }
    }
    if (_photoB) {
      try {
        await WS.setRawImg(`img_back_${id}`, _photoB);
      } catch (e) {
        console.warn("PhotoB vault:", e);
      }
    }
    await patchRoomsMany([[form.roomId, { status: "occupied", bookingId: id }], ...members.map(m => [m.roomId, { status: "occupied", bookingId: m.id }])]);
    if (_resId) nb.reservationId = _resId;
    await saveBk([...bookings, nb, ...members]);
    for (const bk of [nb, ...members]) await syncDriverDue(bk);
    if (members.length) AuditLog.add("GROUP_CHECKIN", id + " rooms " + nb.groupRooms.join(","));
    if (_resId) {
      await patchRes(_resId, { status: "checkedin", bookingId: id, checkedInAt: new Date().toISOString() });
      AuditLog.add("RESERVATION_CHECKIN", _resId + " -> " + id);
    }
    // Save to local computer folder (if hotel has selected one in Storage tab).
    // This was previously ONLY wired to the Storage Settings "Test Save"
    // button — real check-ins never triggered it, so photos never reached
    // the local folder even though guest_details.json test files did.
    if (localStorage.getItem("ab_local_folder")) {
      LocalFS.saveOrQueue(nb, _photoF, _photoB).catch(e => console.warn("LocalFS save:", e.message));
    }
    // one small masked KYC copy for every stay (kept on the Owner/Manager device)
    if (_kioskId) Kiosk.finish(_kioskId).catch(e => console.warn("kiosk finish:", e.message));
    saveKycForBooking(nb);
    setCIR(null);
    setResPrefill(null);
  };
  // ── Future bookings (reservations) ─────────────────────────────
  // Stored in their own "reservations" document: they never touch rooms,
  // bookings, billing, history, registers or revenue until the guest
  // actually checks in (which creates a normal booking).
  const mergeRes = (a, b) => {
    const m = {};
    [...(Array.isArray(b) ? b : []), ...(Array.isArray(a) ? a : [])].forEach(r => {
      if (!r || !r.id) return;
      const o = m[r.id];
      if (!o || String(r.updatedAt || "") >= String(o.updatedAt || "")) m[r.id] = r;
    });
    return Object.values(m);
  };
  const saveRes = async list => {
    // Pull the server copy first and union by id, so two devices adding
    // different bookings at about the same time never overwrite each other.
    let merged = list;
    try {
      const fresh = await WS.get("reservations", true);
      if (Array.isArray(fresh)) merged = mergeRes(list, fresh);
    } catch (e) {}
    setReservations(merged);
    await WS.set("reservations", merged);
    return merged;
  };
  const patchRes = async (id, patch) => {
    const upd = reservations.map(r => r.id === id ? { ...r, ...patch, updatedAt: new Date().toISOString() } : r);
    return saveRes(upd);
  };
  const handleAddReservation = async d => {
    const now = new Date().toISOString();
    const r = {
      id: "RS" + Date.now().toString(36).toUpperCase().slice(-6) + Math.random().toString(36).slice(2, 4).toUpperCase(),
      roomId: d.roomId, checkIn: d.checkIn, checkOut: d.checkOut,
      name: d.name, mobile: d.mobile, adults: d.adults, children: d.children,
      rate: d.rate, roomTotal: d.roomTotal, note: d.note || "",
      advances: d.advance > 0 ? [{ amount: d.advance, mode: d.mode, date: todayStr(), by: user?.name || user?.u || "" }] : [],
      status: "reserved", createdAt: now, updatedAt: now, createdBy: user?.name || user?.u || ""
    };
    await saveRes([...reservations, r]);
    AuditLog.add("RESERVATION_ADDED", r.name + " · Room " + r.roomId + " · " + r.checkIn + (d.advance > 0 ? " · adv ₹" + d.advance : ""));
  };
  const handleResAdvance = async (id, amount, mode) => {
    const r = reservations.find(x => x.id === id);
    if (!r) return;
    await patchRes(id, { advances: [...(r.advances || []), { amount, mode, date: todayStr(), by: user?.name || user?.u || "" }] });
    AuditLog.add("RESERVATION_ADVANCE", r.name + " · ₹" + amount + " " + mode);
  };
  const handleResCancel = async (id, outcome) => {
    const r = reservations.find(x => x.id === id);
    if (!r) return;
    await patchRes(id, { status: "cancelled", advanceOutcome: outcome, cancelledAt: new Date().toISOString(), cancelledBy: user?.name || user?.u || "" });
    AuditLog.add("RESERVATION_CANCELLED", r.name + " · Room " + r.roomId + " · advance " + outcome);
  };
  const handleResCheckInNow = r => {
    const room = rooms.find(x => x.id === r.roomId);
    if (room && room.status === "occupied") { alert("Room " + r.roomId + " is currently occupied — check out first or change the room."); return; }
    if (r.checkIn > todayStr() && !window.confirm("This booking is for " + fmtDate(r.checkIn) + ". Check in now (early)?")) return;
    setResPrefill(r);
    setCIR({ id: r.roomId });
    setView("checkin");
  };
  // Advance for a guest who is ALREADY in-house.
  const handleBookingAdvance = async (bid, amount, mode) => {
    const b = bookings.find(x => x.id === bid);
    if (!b) return;
    const advs = [...(Array.isArray(b.advances) ? b.advances : (Number(b.advance) > 0 ? [{ amount: Number(b.advance), mode: "Cash", date: b.checkIn }] : [])), { amount, mode, date: todayStr(), by: user?.name || user?.u || "" }];
    const updated = { ...b, advances: advs, advance: advs.reduce((t, a) => t + (Number(a.amount) || 0), 0) };
    await saveBk(bookings.map(x => x.id === bid ? updated : x));
    AuditLog.add("ADVANCE_RECEIVED", b.name + " · Room " + b.roomId + " · ₹" + amount + " " + mode);
    if (modal?.b?.id === bid) setModal(p => ({ ...p, b: updated }));
  };
  // A room that shows "occupied" with no active guest in it. Before freeing
  // it, re-read bookings from the SERVER (another device may have a guest
  // this device has not received yet) — never free a room that is really
  // in use.
  const handleReleaseStuckRoom = async room => {
    let fresh = null;
    try { fresh = await WS.get("bookings", true); } catch (e) {}
    const list = Array.isArray(fresh) ? fresh : bookings;
    const live = list.find(bk => bk.status === "active" && (bk.id === room.bookingId || bk.roomId === room.id));
    if (live) {
      setModal({ type: "booking", b: live, room });
      return;
    }
    if (!Array.isArray(fresh) && !window.confirm("Bookings could not be checked online. Free Room " + room.id + " anyway?")) return;
    if (!window.confirm("Room " + room.id + " shows as 'occupied' but has no active guest.\n\nMark the room as FREE (available)?")) return;
    // Only this one room changes (atomic, same as check-in/checkout).
    await patchRoom(room.id, { status: "empty", bookingId: null });
    AuditLog.add("ROOM_RELEASED_STUCK", "Room " + room.id + " (bookingId " + (room.bookingId || "-") + ") freed — no active booking found");
    alert("✅ Room " + room.id + " is now free.");
  };
  const handleAddCharge = async (bid, items) => {
    // Restaurant counter and reception may add orders to the same room
    // from different devices within seconds. Before writing, pull the
    // server's copy of THIS booking's charges and keep any (time-stamped,
    // id-bearing) order this device has not seen yet, so one device's save
    // can never silently drop another device's order. Only the charges
    // list is merged — everything else (photos, unmasked ID kept locally)
    // stays as this device has it.
    let serverCharges = [];
    try {
      const fresh = await WS.get("bookings", true);
      const fb = Array.isArray(fresh) ? fresh.find(x => x.id === bid) : null;
      if (fb && Array.isArray(fb.charges)) serverCharges = fb.charges;
    } catch (e) {}
    let merged = null;
    const nb = bookings.map(b => {
      if (b.id !== bid) return b;
      const local = b.charges || [];
      const seen = {};
      local.forEach(c => { if (c && c.id) seen[c.id] = true; });
      const voided = {};
      (b.voidedCharges || []).forEach(c => { if (c && c.id) voided[c.id] = true; });
      const missing = serverCharges.filter(c => c && c.id && !seen[c.id] && !voided[c.id]);
      merged = [...local, ...missing, ...items];
      return { ...b, charges: merged };
    });
    await saveBk(nb);
    if (modal?.b?.id === bid && merged) setModal(p => ({
      ...p,
      b: {
        ...p.b,
        charges: merged
      }
    }));
  };
  // Removing a wrongly-entered item: never a silent delete. The line moves
  // to voidedCharges with who/when/why, and the audit log records it.
  const handleVoidCharge = async (bid, index, reason) => {
    const b = bookings.find(x => x.id === bid);
    if (!b || b.status !== "active") { alert("A checked-out bill cannot be changed — use a credit note."); return; }
    if (!user || (user.role !== "Owner" && user.role !== "Manager")) { alert("Only the Owner/Manager can remove items."); return; }
    const c = (b.charges || [])[index];
    if (!c) return;
    const voidRec = { ...c, voidBy: user.name || user.u, voidAt: new Date().toISOString(), voidReason: String(reason).slice(0, 120) };
    const nb = bookings.map(x => x.id === bid ? {
      ...x,
      charges: (x.charges || []).filter((_, j) => j !== index),
      voidedCharges: [...(x.voidedCharges || []), voidRec]
    } : x);
    await saveBk(nb);
    AuditLog.add("CHARGE_VOIDED", "Room " + b.roomId + " · " + c.name + " x" + c.qty + " · " + reason);
    if (modal?.b?.id === bid) setModal(p => ({ ...p, b: nb.find(x => x.id === bid) }));
  };
  // ── QR room ordering (staff side) ──────────────────────────────────
  const roToken = profile.roomOrderToken || "";
  const roOn = !!(hasFeature("qr_any") && roToken && user && ["Owner", "Manager", "Captain", "Chef"].indexOf(user.role) >= 0);
  const [roomOrders, setRoomOrders] = useState([]);
  useEffect(() => {
    if (!roOn || !window._db) { setRoomOrders([]); return; }

        // (which was the wrong advice — that wipes data too).
        let refreshingForUpdate = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshingForUpdate) return;
          refreshingForUpdate = true;
          console.log('[AtithiBook] New version active — refreshing app (your data is untouched)');
          window.location.reload();
        });
      });
    }

    // Install prompt — show "Add to Home Screen" automatically
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', e=>{
      e.preventDefault();
      deferredPrompt=e;
      // Show install button after 30 seconds if not installed
      setTimeout(()=>{
        if(deferredPrompt && !window.matchMedia('(display-mode: standalone)').matches){
          const banner=document.createElement('div');
          banner.innerHTML=`<div style="position:fixed;bottom:0;left:0;right:0;background:#1e3a5f;color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;z-index:9999;border-top:2px solid #d97706;font-family:'Hind',sans-serif">
            <div><div style="font-weight:700;font-size:13px">📲 Install AtithiBook App</div><div style="font-size:11px;opacity:.7">Add to your home screen for a faster, app-like experience</div></div>
            <div style="display:flex;gap:8px">
              <button onclick="this.closest('div[style]').parentElement.remove()" style="background:transparent;border:1px solid rgba(255,255,255,.3);color:rgba(255,255,255,.7);padding:6px 10px;border-radius:6px;font-size:12px;cursor:pointer">Later</button>
              <button id="installBtn" style="background:#d97706;border:none;color:#fff;padding:6px 14px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer">Install</button>
            </div>
          </div>`;
          document.body.appendChild(banner);
          document.getElementById('installBtn').onclick=async()=>{
            deferredPrompt.prompt();
            const {outcome}=await deferredPrompt.userChoice;
            if(outcome==='accepted') banner.remove();
            deferredPrompt=null;
          };
        }
      }, 30000);
    });
  </script>
</body>
</html>
