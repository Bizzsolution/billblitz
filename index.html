  <!-- Global safety net for TWO known, permanently-unfixed Firebase JS SDK
       bugs — placed here, before ANYTHING else loads, so it is guaranteed
       active before even the earliest Firestore call (including ones that
       can fire on the login screen before any user action):
       1. "FIRESTORE INTERNAL ASSERTION FAILED: Unexpected state" — reported
          across SDK versions 8.x-12.x, tied to internal WebChannel/
          AsyncQueue state under network instability or rapid writes.
       2. "Target ID already exists" — Firebase's own team has closed this
          as "wontfix" on their public issue tracker (multiple long-running
          reports), meaning it is a permanent SDK limitation, not something
          fixable from application code.
       This app's PRIMARY data path is already localStorage (WS.get/
       WS.onSnapshot always check it first) plus a periodic backup refetch
       for cross-device data, with Firestore's real-time layer as a
       best-effort accelerant — so a transient internal SDK hiccup should
       never be allowed to disrupt the app itself. -->
  <script>
    // Firebase's OWN internal logger calls console.error() DIRECTLY for
    // "Target ID already exists" (visible as logger.ts:115 in the actual
    // stack trace) — this is Firebase choosing to log it itself, NOT a
    // genuine uncaught browser exception, so window.addEventListener
    // ('error') never sees it at all. Overriding console.error is the
    // only way to actually filter this specific known-noisy, wontfix
    // message out of the visible console.
    const KNOWN_FIRESTORE_ISSUES = ['INTERNAL ASSERTION FAILED', 'Target ID already exists'];
    const isKnownFirestoreNoise = (args) => {
      const text = args.map(a => (a && a.message) || String(a)).join(' ');
      return KNOWN_FIRESTORE_ISSUES.some(sig => text.includes(sig));
    };
    const originalConsoleError = console.error.bind(console);
    console.error = function(...args) {
      if (isKnownFirestoreNoise(args)) {
        console.warn('[AtithiBook] Known Firestore SDK issue suppressed (non-fatal, Firebase-side, see index.html comments)');
        return;
      }
      originalConsoleError(...args);
    };
    // Backup coverage for the (less common) case where either issue DOES
    // surface as a genuine uncaught error/rejection instead.
    window.addEventListener('error', function(e) {
      if (isKnownFirestoreNoise([e])) e.preventDefault();
    });
    window.addEventListener('unhandledrejection', function(e) {
      if (isKnownFirestoreNoise([e.reason])) e.preventDefault();
    });
  </script>

          projectId:"atithibook-saas",
          storageBucket:"atithibook-saas.firebasestorage.app",
          messagingSenderId:"851231850636",
          appId:"1:851231850636:web:1168ddb738e1d7f41a7ba9"
        });
        window._db=firebase.firestore();
        // AD-1: verified per-hotel identity (see comment above the SDK
        // script tags). LOCAL persistence — unlike the admin panel's
        // Auth.Persistence.NONE — because this session should legitimately
        // survive app restarts/PWA relaunches on a hotel's own device.
        try{
          if(firebase.auth){
            window._auth=firebase.auth();
            window._auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
          }
        }catch(authErr){
          console.warn("[AtithiBook] Firebase Auth init failed — falling back to legacy key-only access:",authErr.message);
        }
        // Real-time listeners (onSnapshot) use a persistent WebChannel
        // "Listen" stream under the hood — DIFFERENT from the simple HTTP
        // requests used by one-time get()/set() calls. Some networks
        // (corporate/hotel WiFi, certain mobile carriers, VPNs/proxies)
        // block or destabilize this specific long-lived streaming
        // connection while still allowing normal requests through — which
        // exactly matches what was seen: writes reaching Firestore
        // correctly (visible in Firebase Console), but other devices'
        // real-time listeners never receiving the update, plus a
        // "WebChannelConnection RPC 'Listen' stream ... transport errored"
        // warning in the console. This setting makes the SDK detect that
        // condition and automatically fall back to plain HTTP long-polling
        // for the Listen stream too, which is far more firewall-friendly.
        try {
          window._db.settings({ experimentalAutoDetectLongPolling: true, merge: true });
        } catch (settingsErr) {
          console.warn("[AtithiBook] Firestore settings:", settingsErr.message);
        }
        // NOTE: We deliberately do NOT call enablePersistence() here.
        // Firestore's own IndexedDB-based multi-tab persistence has a
        // known SDK issue that throws recurring uncaught
        // "Target ID already exists" errors from snapshot listeners under
        // normal use — exactly what was silently breaking things in this
        // app. We don't need it anyway: every read in this app already
        // checks localStorage FIRST (see WS.get/WS.onSnapshot), which is
        // our own, simpler, reliable offline-cache layer — Firestore's
        // persistence was pure redundant risk with no real benefit here.
        console.log("[AtithiBook] Firebase connected");
      }else{
        console.warn("[AtithiBook] Firebase SDK not loaded — local mode");
      }
    }catch(e){
      console.warn("[AtithiBook] Firebase init failed — local mode:",e.message);
      window._db=null;
    }
  </script>

  <script>
// Pre-compiled from JSX by Babel (build-time) — no runtime eval needed
// Hooks destructured from React global
const {
  useState,
  useEffect,
  useRef,
  useMemo
} = React;

// ── CONSOLE SECURITY WARNING ─────────────────────
console.log("%c⛔ STOP!", "color:red;font-size:48px;font-weight:bold;");
console.log("%cThis is AtithiBook — a protected application.\nReverse engineering or key extraction is prohibited and monitored.", "color:red;font-size:14px;");

// ── SECURITY UTILITIES ───────────────────────────
const SecUtils = {
  async hash(text) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text + "|AtithiSalt2024!"));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
  },
  _key: null,
  async initKey(license) {
    try {
      const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(license), {
        name: "PBKDF2"
      }, false, ["deriveKey"]);
      this._key = await crypto.subtle.deriveKey({
        name: "PBKDF2",
        salt: new TextEncoder().encode("AtithiEnc2024!"),
        iterations: 10000,
        hash: "SHA-256"
      }, km, {
        name: "AES-GCM",
        length: 256
      }, false, ["encrypt", "decrypt"]);
    } catch (e) {
      console.warn("Enc init:", e);
    }
  },
  async enc(data) {
    if (!this._key) return JSON.stringify(data);
    try {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const enc = await crypto.subtle.encrypt({
        name: "AES-GCM",
        iv
      }, this._key, new TextEncoder().encode(JSON.stringify(data)));
      const out = new Uint8Array(12 + enc.byteLength);
      out.set(iv);
      out.set(new Uint8Array(enc), 12);
      return "ENC:" + btoa(String.fromCharCode(...out));
    } catch (e) {
      return JSON.stringify(data);
    }
  },
  async dec(ct) {
    if (!this._key || !String(ct).startsWith("ENC:")) return typeof ct === "string" ? JSON.parse(ct) : ct;
    try {
      const combined = Uint8Array.from(atob(ct.slice(4)), c => c.charCodeAt(0));
      const dec = await crypto.subtle.decrypt({
        name: "AES-GCM",
        iv: combined.slice(0, 12)
      }, this._key, combined.slice(12));
      return JSON.parse(new TextDecoder().decode(dec));
    } catch (e) {
      try {
        return JSON.parse(ct);
      } catch {
        return ct;
      }
    }
  },
  sanitize(str) {
    return String(str || "").replace(/[<>"']/g, "").slice(0, 500);
  },
  // ── STAFF PASSWORD HASHING (AUDIT-2 F5) ──────────────────────────
  // hash() above is one SHA-256 round with a salt shared by every hotel,
  // and the resulting hashes are synced to Firestore (hotels/<key>/data/
  // users). Anyone who reads that document can test billions of guesses
  // per second offline. New format: PBKDF2-HMAC-SHA256, 16-byte random
  // salt PER PASSWORD, iteration count stored in the hash so it can be
  // raised later without breaking existing logins:
  //   "pbkdf2-sha256$<iterations>$<base64 salt>$<base64 32-byte key>"
  // Legacy hashes still verify once and are re-hashed on that login.
  PW_ITER: 310000,
  PW_PREFIX: "pbkdf2-sha256$",
  _b64(u8) {
    let s = "";
    for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]);
    return btoa(s);
  },
  _unb64(b64) {
    const s = atob(b64);
    const u8 = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) u8[i] = s.charCodeAt(i);
    return u8;
  },
  _ctEq(a, b) {
    if (!a || !b || a.length !== b.length) return false;
    let d = 0;
    for (let i = 0; i < a.length; i++) d |= a[i] ^ b[i];
    return d === 0;
  },
  async _pbkdf2(pw, salt, iterations) {
    const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(String(pw)), { name: "PBKDF2" }, false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt, iterations, hash: "SHA-256" }, km, 256);
    return new Uint8Array(bits);
  },
  async hashPassword(pw) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const dk = await this._pbkdf2(pw, salt, this.PW_ITER);
    return this.PW_PREFIX + this.PW_ITER + "$" + this._b64(salt) + "$" + this._b64(dk);
  },
  // Returns { ok, upgrade }. upgrade=true means the stored value is in an
  // older format/strength and the caller should replace it with
  // hashPassword(pw) now that the plaintext is known to be correct.
  async verifyPassword(pw, stored) {
    const s = typeof stored === "string" ? stored : "";
    if (s.indexOf(this.PW_PREFIX) === 0) {
      const parts = s.split("$");
      if (parts.length !== 4) return { ok: false, upgrade: false };
      const iterations = parseInt(parts[1], 10);
      // Bounds: a tampered users document must not be able to freeze the
      // login screen with an absurd iteration count.
      if (!(iterations >= 100000 && iterations <= 5000000)) return { ok: false, upgrade: false };
      let salt, want;
      try { salt = this._unb64(parts[2]); want = this._unb64(parts[3]); } catch (e) { return { ok: false, upgrade: false }; }
      if (salt.length < 16 || want.length !== 32) return { ok: false, upgrade: false };
      const got = await this._pbkdf2(pw, salt, iterations);
      const ok = this._ctEq(got, want);
      return { ok, upgrade: ok && iterations < this.PW_ITER };
    }
    if (/^[0-9a-f]{64}$/.test(s)) {
      const enc = new TextEncoder();
      const ok = this._ctEq(enc.encode(await this.hash(pw)), enc.encode(s));
      return { ok, upgrade: ok };
    }
    // Very old installs stored the default demo password in plaintext.
    // Accept ONLY an exact match against such a stored default (the old
    // code accepted "admin123"/"front123" for ANY account) and force the
    // upgrade.
    if (s && STAFF.some(d => d.p === s)) {
      const ok = String(pw) === s;
      return { ok, upgrade: ok };
    }
    return { ok: false, upgrade: false };
  },
  // Burns the same work as a real verification so "unknown username" and
  // "wrong password" take equally long.
  async burnPasswordWork(pw) {
    await this._pbkdf2(pw, new Uint8Array(16), this.PW_ITER);
    return { ok: false, upgrade: false };
  }
};

// ── PHONE-SHAPE CHECK (AUDIT-2 F1) ───────────────────────────────
// Mirrors isPhoneShaped() in netlify/functions/verify-access.mjs. Used to
// purge any non-phone value an older build persisted as the "verified
// phone" — in particular ADMIN_SECRET, which the admin-bypass flow used
// to save into this device's localStorage.
const PhoneShape = {
  normalize(raw) {
    let d = String(raw || "").replace(/\D/g, "");
    if (d.length > 10 && d.indexOf("91") === 0) d = d.slice(2);
    return d.slice(-10);
  },
  ok(raw) {
    const s = String(raw || "").replace(/[\u00AD\u061C\u180E\u200B-\u200F\u202A-\u202E\u2060-\u2064\u2066-\u206F\uFEFF]/g, "").trim();
    return /^[0-9+\s\-()./]{7,28}$/.test(s) && this.normalize(s).length === 10;
  }
};
(function purgeNonPhoneVerifiedPhone() {
  try {
    const v = localStorage.getItem("ab_verified_phone");
    if (v !== null && !PhoneShape.ok(v)) localStorage.removeItem("ab_verified_phone");
  } catch (e) {}
})();

// ── AADHAAR MASKING (Legal compliance — display only) ──────────
const maskAadhaar = num => {
  if (!num) return "";
  const clean = String(num).replace(/\s/g, "");
  if (clean.length < 4) return num;
  return "XXXX XXXX " + clean.slice(-4);
};

// ── GST CALCULATION (India hotel GST rules effective 22 Sept 2025) ──
// 56th GST Council meeting abolished the old flat 12% hotel slab. Current
// rules (verified Aug 2026):
//   Room tariff (per night):  ≤ ₹1,000 → 0% | ₹1,001–7,500 → 5% (no ITC) | > ₹7,500 → 18% (ITC)
//   Restaurant/food/beverage: 5% (no ITC) at "non-specified premises",
//                             18% (ITC) at "specified premises"
// ── GST RULE MASTER ──────────────────────────────────────────────
// Single source of truth for every GST rate this app applies. Nothing
// elsewhere hard-codes a rate — everything resolves through
// resolveGSTRule() below, keyed by (category, supply date, and for
// accommodation, the nightly tariff). This exists so that:
//   1. A rate change (GST Council notification) is ONE new entry here,
//      not a hunt through billing code.
//   2. A booking is taxed using the rule that was in force on ITS supply
//      date — not today's rate — even if viewed/printed much later.
//   3. Every invoice can cite which rule (and government notification)
//      it used, which is what "rule_id" / "source reference" means on a
//      real GST audit trail.
// "Specified premises" = a hotel where any room's tariff exceeded ₹7,500
// in the preceding financial year. We approximate this from the hotel's
// CURRENTLY configured room rates (see isSpecifiedPremises) unless the
// Owner has explicitly set it via Profile Settings — exact determination
// needs your CA's confirmation for the relevant financial year.
//
// Each rule: { id, category, sac, rate, effectiveFrom, effectiveTo,
//              condition(ctx), reference }
// condition(ctx) receives { nightlyRate, specifiedPremises } and returns
// true if this rule applies to the given supply. Rules are matched by
// (a) category, (b) effectiveFrom <= supplyDate <= effectiveTo, (c) the
// first whose condition() returns true — so order matters within a date
// band; keep more specific conditions first.
// ── PLACE OF SUPPLY / STATE CODES ────────────────────────────────
// Official 2-digit GST state/UT codes (the first 2 digits of every
// GSTIN). Used to (a) derive the hotel's own state from its GSTIN for
// display, and (b) determine CGST+SGST vs IGST.
//
// For a hotel: accommodation, restaurant/room-service, laundry, extra
// bed, and cab-arranged-by-the-hotel are all services tied to the
// hotel's own premises. Under Section 12(3) of the IGST Act, the place
// of supply for services related to immovable property (and for
// restaurant/catering services) is the LOCATION OF THE PROPERTY ITSELF —
// not the guest's home state, billing address, or GSTIN. Since the
// hotel's own registration is ALSO in that same state, the supplier's
// state and the place of supply are structurally always identical for
// these services. This means CGST+SGST is not a simplification for a
// single-property hotel — it is what the law actually requires,
// regardless of where the guest is travelling from.
// IGST would only become relevant for something NOT tied to the
// property's location (e.g. a shippable retail item sent to another
// state) — nothing in this app's current feature set falls into that
// category, so IGST resolves to zero everywhere below. The fields exist
// so a future feature (or a specific transaction your CA identifies)
// can switch it on without a schema change.
const GST_STATE_CODES = {
  "01": "Jammu and Kashmir", "02": "Himachal Pradesh", "03": "Punjab", "04": "Chandigarh",
  "05": "Uttarakhand", "06": "Haryana", "07": "Delhi", "08": "Rajasthan", "09": "Uttar Pradesh",
  "10": "Bihar", "11": "Sikkim", "12": "Arunachal Pradesh", "13": "Nagaland", "14": "Manipur",
  "15": "Mizoram", "16": "Tripura", "17": "Meghalaya", "18": "Assam", "19": "West Bengal",

// Finds the applicable rule for a category on a given supply date. If a
// hotel-level override is active for this exact rule id (see GST override
// below), that rate is substituted but the rule's SAC/reference are kept
// for the audit trail.
function resolveGSTRule(category, ctx, supplyDate, overrides) {
  const date = supplyDate || todayStr();
  const candidates = GST_RULE_MASTER.filter(r =>
    r.category === category &&
    r.effectiveFrom <= date &&
    (!r.effectiveTo || date <= r.effectiveTo)
  );
  let rule = candidates.find(r => r.condition(ctx || {})) || candidates[0];
  if (!rule) {
    // Nothing configured for this category/date — this must be visible,
    // not silently taxed at some guessed rate.
    return { id: null, category, sac: "", rate: 0, reference: "", unresolved: true };
  }
  if (rule.followsAccommodation) {
    const accRule = resolveGSTRule("accommodation", ctx, date, overrides);
    rule = { ...rule, rate: accRule.rate, _followedRuleId: accRule.id };
  }
  const ov = overrides && overrides[rule.id];
  if (ov && typeof ov.rate === "number") {
    return { ...rule, rate: ov.rate, overridden: true, overrideReason: ov.reason, overrideBy: ov.by };
  }
  return rule;
}

// ── SHARED OCR SCAN ENGINE ───────────────────────────────────────
// Used by BOTH the primary guest scan AND family member scans, so both
// get the exact same robustness (multi-layer JSON recovery, Groq-key
// fallback, proper error messages) instead of drifting out of sync —
// which is exactly what caused family back-side scans to silently fail
// while the primary guest's scan (with more fallback layers) succeeded
// on the same kind of image/response.
// ── QR CODE SCAN — Aadhaar cards (2018 or earlier) embed a plain XML QR
// code with UIDAI-verified data, which is MORE accurate than OCR (no AI
// guessing, no API call, works offline). Newer "Secure QR Code" (2019+)
// is a binary/signed format needing zlib decompression + protobuf-style
// parsing to fully decode — genuinely non-trivial to build correctly, so
// rather than risk silently wrong data, we detect it and tell the user to
// use photo scan instead for those cards.
// Aadhaar's secure QR is a large, dense code. A single straight decode of
// a phone photo almost always fails in practice: the card is usually held
// at an angle, the QR occupies a small part of the frame, and the photo
// has been downscaled for storage. So we try several passes and return the
// first hit — upscaling (dense QRs need pixels per module), both inversion
// modes (glossy laminated cards can read as inverted), and 90/180/270
// rotations (people photograph cards sideways, as our own test images show).
function decodeQRFromImage(dataUrl) {
  return new Promise((resolve) => {
    if (!dataUrl || !window.jsQR) { resolve(null); return; }
    const img = new Image();
    img.onload = () => {
      const attempt = (scale, rotationDeg) => {
        try {
          const swap = rotationDeg === 90 || rotationDeg === 270;
          const w = Math.round((swap ? img.height : img.width) * scale);
          const h = Math.round((swap ? img.width : img.height) * scale);
          if (w < 20 || h < 20 || w * h > 40000000) return null;
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = "high";
          ctx.translate(w / 2, h / 2);
          ctx.rotate(rotationDeg * Math.PI / 180);
          ctx.drawImage(img, -img.width * scale / 2, -img.height * scale / 2,
                        img.width * scale, img.height * scale);
          const d = ctx.getImageData(0, 0, w, h);
          for (const inv of ["dontInvert", "onlyInvert"]) {
            const code = window.jsQR(d.data, d.width, d.height, { inversionAttempts: inv });
            if (code && code.data) return code.data;
          }
        } catch (e) { /* try next pass */ }
        return null;
      };
      // Upscale first: a downscaled dense QR is the most common failure.
      for (const scale of [2, 1, 3]) {
        for (const rot of [0, 90, 270, 180]) {
          const hit = attempt(scale, rot);
          if (hit) { resolve(hit); return; }
        }
      }
      resolve(null);
    };
    img.onerror = () => resolve(null);
    img.src = dataUrl;
  });
}

function parseAadhaarQRText(text) {
  // Old format: plain XML like
  // <?xml version="1.0"?><PrintLetterBarcodeData uid="..." name="..." .../>
  if (text.includes("PrintLetterBarcodeData") || text.trim().startsWith("<?xml")) {
    try {
      const doc = new DOMParser().parseFromString(text, "text/xml");
      const node = doc.querySelector("PrintLetterBarcodeData") || doc.documentElement;
      if (node && node.getAttribute) {
        const get = a => node.getAttribute(a) || "";
        const addrParts = [get("co"), get("house"), get("street"), get("lm"), get("loc"), get("vtc"), get("po"), get("dist"), get("subdist"), get("state"), get("pc") ? "PIN " + get("pc") : ""].filter(Boolean);
        return {
          format: "old_xml",
          name: get("name"),
          dob: get("dob") || (get("yob") ? "01/01/" + get("yob") : ""),
          gender: get("gender") === "M" || get("gender").toUpperCase() === "MALE" ? "Male" : get("gender") === "F" || get("gender").toUpperCase() === "FEMALE" ? "Female" : get("gender"),
          aadhaar: get("uid"),
          address: addrParts.join(", ")
        };
      }
    } catch (e) { console.warn("QR XML parse:", e.message); }
  }
  // Anything else is very likely the newer Secure QR Code format.
  return { format: "maybe_secure", raw: text };
}

// ── AADHAAR SECURE QR ─────────────────────────────────────────────
// Every Aadhaar card printed in recent years carries a "Secure QR" rather
// than the old plain-XML barcode, so supporting only the XML form meant QR
// scan effectively never worked on a current card. The Secure QR payload
// is a very large integer (encoded in the QR's numeric mode) whose bytes
// are GZIP-compressed, with fields separated by 0xFF. We decompress using
// the browser's built-in DecompressionStream — no library, no API, no cost.
// The trailing hash/signature/photo bytes are ignored; we only read the
// demographic fields, which is all a guest register needs.
async function parseAadhaarSecureQR(text) {
  try {
    const digits = String(text).trim();
    if (!/^\d{20,}$/.test(digits)) return { format: "unsupported" };
    if (typeof DecompressionStream === "undefined") return { format: "unsupported" };

    let bi = BigInt(digits);
    const bytes = [];
    while (bi > 0n) { bytes.unshift(Number(bi & 255n)); bi >>= 8n; }
    const packed = new Uint8Array(bytes);

    const stream = new Blob([packed]).stream().pipeThrough(new DecompressionStream("gzip"));
    const out = new Uint8Array(await new Response(stream).arrayBuffer());

    // Split on the 0xFF field delimiter
    const parts = [];
    let start = 0;
    for (let i = 0; i < out.length; i++) {
      if (out[i] === 0xFF) { parts.push(out.slice(start, i)); start = i + 1; }
      // Demographic fields end before the 32-byte hash; 20 parts is plenty.
      if (parts.length > 20) break;
    }
    const dec = new TextDecoder("utf-8", { fatal: false });
    const f = parts.map(b => dec.decode(b).replace(/\u0000/g, "").trim());
    if (f.length < 8) return { format: "unsupported" };

    // V2/V3 cards carry a version marker as the first field; older secure
    // QRs start straight at the email/mobile indicator.
    const off = /^V\d$/i.test(f[0]) ? 1 : 0;
    // Field order after the optional version marker, per UIDAI's Secure QR
    // layout: 0 email/mobile indicator, 1 referenceid, 2 name, 3 dob,
    // 4 gender, 5 careof, 6 district, 7 landmark, 8 house, 9 location,
    // 10 pincode, 11 postoffice, 12 state, 13 street, 14 subdistrict, 15 vtc
    const g = i => f[off + i] || "";
    const gender = g(4).toUpperCase();
    const addr = [g(5), g(8), g(13), g(7), g(9), g(15), g(11), g(14), g(6), g(12),
                  g(10) ? "PIN " + g(10) : ""].filter(Boolean);
    const name = g(2);
    if (!name) return { format: "unsupported" };
    return {
      format: "secure_qr",
      name,
      dob: g(3),
      gender: gender === "M" ? "Male" : gender === "F" ? "Female" : g(4),
      // Secure QR never contains the full 12-digit number — only the last
      // 4 digits inside the reference id. That is exactly what we want to
      // keep on record anyway.
      aadhaar: (g(1).slice(0, 4).match(/^\d{4}$/) ? "XXXX XXXX " + g(1).slice(0, 4) : ""),
      address: addr.join(", ")
    };
  } catch (e) {
    console.warn("Secure QR parse:", e.message);
    return { format: "unsupported" };
  }
}

async function performOCRScan(photo, prompt, license, scanContext) {
  const b64 = photo.includes(",") ? photo.split(",")[1] : photo;
  let data = null;
  let licenseError = false;
  let featureError = false;
  let serverErrorMsg = "";

  // Step 1: server function (API key hidden server-side) — primary path
  try {
    const sr = await fetch("/api/scan", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ image: b64, prompt, license, scanContext })
    });
    const sd = await sr.json();
    if (sr.status === 503 && sd.error === "VERIFICATION_UNAVAILABLE") {
      // Server genuinely could not verify (connectivity issue on its
      // side), NOT a real license problem — must not be shown as one.
      serverErrorMsg = sd.message || "License verify nahi ho paayi (network issue) — thodi der baad phir try karo.";
    } else if (sr.status === 403) {
      licenseError = true;
      if (sd.error === "FEATURE_NOT_ENABLED") featureError = true;
    } else if (sr.ok && (sd.candidates || sd._groq)) {
      data = sd;
    } else {
      serverErrorMsg = sd.message || sd.error || ("HTTP " + sr.status);
      if (sd.details && (sd.details.groq || sd.details.gemini)) {
        serverErrorMsg += " [Groq: " + (sd.details.groq || "ok") + " | Gemini: " + (sd.details.gemini || "ok") + "]";
      }
    }
  } catch (se) {
    serverErrorMsg = "Network error: " + se.message;
  }

  // Step 2: optional user-supplied Groq key fallback
  if (!data) {
    const groqKey = localStorage.getItem("ab_groq_key");
    if (groqKey && groqKey.startsWith("gsk_")) {
      try {
        const gr = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + groqKey },
          body: JSON.stringify({
            model: "qwen/qwen3.6-27b",
            messages: [{ role: "user", content: [
              { type: "image_url", image_url: { url: "data:image/jpeg;base64," + b64 } },
              { type: "text", text: prompt }
            ]}],
            max_tokens: 1000, temperature: 0, reasoning_effort: "none"
          })
        });
        const gd = await gr.json();
        if (gr.ok && gd.choices?.[0]?.message?.content) {
          data = { _groq: true, _text: gd.choices[0].message.content };
        }
      } catch (ge) { console.warn("Groq fallback:", ge.message); }
    }
  }

  if (!data) {
    if (featureError) return { error: "Yeh feature aapke plan mein enabled nahi hai. Apne provider se contact karo." };
    if (licenseError) return { error: "License expired or invalid. Contact support." };
    return { error: serverErrorMsg || "Scan server unavailable. Check internet connection or contact support." };
  }

  const raw = data._groq ? data._text : data.candidates?.[0]?.content?.parts?.[0]?.text || "";
  if (!raw) return { error: "Empty OCR response. Try clearer photo." };

  // Strip visible reasoning blocks (e.g. Qwen thinking mode <think>...</think>)
  const cleaned = raw.replace(/<think>[\s\S]*?<\/think>/gi, "").trim() || raw;

  // 5-layer JSON recovery — direct parse, greedy brace match, markdown-strip,
  // near-JSON fixup (trailing commas/quotes), then field-by-field regex as
  // last resort. Any one of these succeeding is enough.
  let parsed = null;
  try { parsed = JSON.parse(cleaned); } catch {}
  if (!parsed) { const m = cleaned.match(/\{[\s\S]*\}/); if (m) try { parsed = JSON.parse(m[0]); } catch {} }
  if (!parsed) { const s = cleaned.replace(/```[\w]*\n?/g, "").trim(); try { parsed = JSON.parse(s); } catch {} }
  if (!parsed) {
    let fixed = cleaned.replace(/```[\w]*\n?/g, "").trim();
    const m2 = fixed.match(/\{[\s\S]*\}/);
    if (m2) fixed = m2[0];
    fixed = fixed.replace(/,(\s*[}\]])/g, "$1").replace(/'/g, '"');
    try { parsed = JSON.parse(fixed); } catch {}
  }
  if (!parsed) {
    const fields = ["name", "dob", "gender", "aadhaar", "idNumber", "fatherName", "address", "district", "state", "pin"];
    const extracted = {};
    let any = false;
    fields.forEach(key => {
      const re = new RegExp('"' + key + '"\\s*:\\s*"([^"]*)"', "i");
      const fm = cleaned.match(re);
      if (fm && fm[1]) { extracted[key] = fm[1]; any = true; }
    });
    if (any) parsed = extracted;
  }
  if (!parsed) return { error: "Parse error. Check raw OCR below.", rawText: raw };
  return { parsed, rawText: raw };
}

// gstMode: "exclusive" (default) = GST added ON TOP of the room/charge rate
//          "inclusive" = the rate IS the final guest-facing price, GST is
//          backed out of it (common when hotels quote/advertise an
//          all-inclusive room rate rather than a pre-tax base rate).
// If not explicitly passed, reads the hotel's own saved preference — so
// every existing call site keeps working unchanged and just picks up
// whatever that hotel has configured in Profile settings.
// Splits a combined GST amount into CGST+SGST halves (intra-state, the
// default for a guest booking directly with a hotel in their own state)
// paisa-accurately — SGST gets any odd rupee so CGST/SGST never mismatch
// by more than the smallest currency unit, and CGST+SGST always sums back
// to the original total exactly.
// ── AMOUNT IN WORDS ──────────────────────────────────────────────
// Indian numbering (lakh/crore, not million/billion) — required on a
// proper GST tax invoice per Rule 46. Pure function, no dependency.
const _ONES = ["", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine",
  "Ten", "Eleven", "Twelve", "Thirteen", "Fourteen", "Fifteen", "Sixteen", "Seventeen", "Eighteen", "Nineteen"];
const _TENS = ["", "", "Twenty", "Thirty", "Forty", "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"];
function _threeDigitsToWords(n) {
  let s = "";
  if (n >= 100) { s += _ONES[Math.floor(n / 100)] + " Hundred "; n %= 100; }
  if (n >= 20) { s += _TENS[Math.floor(n / 10)] + " "; n %= 10; }
  if (n > 0) s += _ONES[n] + " ";
  return s.trim();
}
function amountInWords(amount) {
  let n = Math.round(Math.abs(amount || 0));
  if (n === 0) return "Zero Rupees Only";
  const crore = Math.floor(n / 10000000); n %= 10000000;
  const lakh = Math.floor(n / 100000); n %= 100000;
  const thousand = Math.floor(n / 1000); n %= 1000;
  const hundred = n;
  const parts = [];
  if (crore) parts.push(_threeDigitsToWords(crore) + " Crore");
  if (lakh) parts.push(_threeDigitsToWords(lakh) + " Lakh");
  if (thousand) parts.push(_threeDigitsToWords(thousand) + " Thousand");
  if (hundred) parts.push(_threeDigitsToWords(hundred));
  return "Rupees " + parts.join(" ") + " Only";
}

function splitCgstSgst(totalGST) {
  const half = Math.floor(totalGST / 2);
  return { cgst: half, sgst: totalGST - half };
}

function calcBillGST(booking, roomObj, allRooms, gstMode) {
  // A COMPLETED (checked-out) booking's bill is a finalized financial
  // record — it must never change just because the hotel later flips its
  // GST Extra ↔ GST Included setting, a room's rate/category changes, or
  // the GST Rule Master gains a new rate. Use exactly what was calculated
  // and frozen at the moment of checkout, citing the SAME rule ids that
  // were resolved back then.
  if (booking.status === "checkedout" && booking.gstBreakdown && booking.grandTotal !== undefined) {
    const gb = booking.gstBreakdown;
    const roomSplit2 = splitCgstSgst(gb.roomGST || 0);
    const foodSplit2 = splitCgstSgst(gb.foodGST || 0);
    const otherSplit2 = splitCgstSgst(gb.otherGST || 0);
    return {
      gstMode: gb.gstMode || "exclusive",
      roomAmt: gb.roomAmt ?? (booking.roomTotal || 0), roomGST: gb.roomGST || 0, roomGSTRate: gb.roomGSTRate || 0,
      roomCGST: gb.roomCGST ?? roomSplit2.cgst, roomSGST: gb.roomSGST ?? roomSplit2.sgst, roomSAC: gb.roomSAC || "9963", roomRuleId: gb.roomRuleId || null,
      foodAmt: gb.foodAmt || 0, foodGST: gb.foodGST || 0, foodGSTRate: gb.foodGSTRate || 0,
      foodCGST: gb.foodCGST ?? foodSplit2.cgst, foodSGST: gb.foodSGST ?? foodSplit2.sgst, foodSAC: gb.foodSAC || "996331", foodRuleId: gb.foodRuleId || null,
      // Laundry/transport/extra-bed are frozen the same way. Bookings
      // checked out BEFORE this split existed have no gb.laundryAmt etc,
      // so they read as 0 here — their charges are still fully accounted
      // for inside the (unchanged) otherAmt aggregate below, they're just
      // not broken out into their own GST-summary line for old bills.
      laundryAmt: gb.laundryAmt || 0, laundryGST: gb.laundryGST || 0, laundryGSTRate: gb.laundryGSTRate ?? 0.18,
      laundryCGST: gb.laundryCGST || 0, laundrySGST: gb.laundrySGST || 0, laundrySAC: gb.laundrySAC || "999721", laundryRuleId: gb.laundryRuleId || null,
      transportAmt: gb.transportAmt || 0, transportGST: gb.transportGST || 0, transportGSTRate: gb.transportGSTRate ?? 0.18,
      transportCGST: gb.transportCGST || 0, transportSGST: gb.transportSGST || 0, transportSAC: gb.transportSAC || "996601", transportRuleId: gb.transportRuleId || null,
      extraBedAmt: gb.extraBedAmt || 0, extraBedGST: gb.extraBedGST || 0, extraBedGSTRate: gb.extraBedGSTRate ?? 0,
      extraBedCGST: gb.extraBedCGST || 0, extraBedSGST: gb.extraBedSGST || 0, extraBedSAC: gb.extraBedSAC || "9963", extraBedRuleId: gb.extraBedRuleId || null,
      otherAmt: gb.otherAmt || 0, otherGST: gb.otherGST || 0, otherGSTRate: gb.otherGSTRate ?? OTHER_SERVICES_GST_RATE,
      otherCGST: gb.otherCGST ?? otherSplit2.cgst, otherSGST: gb.otherSGST ?? otherSplit2.sgst, otherRuleId: gb.otherRuleId || null,
      otherMiscAmt: gb.otherMiscAmt ?? gb.otherAmt ?? 0, otherMiscGST: gb.otherMiscGST ?? gb.otherGST ?? 0, otherMiscSAC: gb.otherMiscSAC || "9997",
      subtotal: booking.subTotal ?? 0, totalGST: booking.gstAmt ?? 0,
      totalCGST: gb.totalCGST ?? (roomSplit2.cgst + foodSplit2.cgst + otherSplit2.cgst),
      totalSGST: gb.totalSGST ?? (roomSplit2.sgst + foodSplit2.sgst + otherSplit2.sgst),
      totalIGST: gb.totalIGST || 0,
      placeOfSupply: gb.placeOfSupply || null,
      placeOfSupplyCode: gb.placeOfSupplyCode || null,
      grandTotal: booking.grandTotal,
      invoiceNo: booking.invoiceNo || null,
      specifiedPremises: isSpecifiedPremises(allRooms)
    };
  }
  gstMode = gstMode || CURRENT_PROFILE.gstMode || "exclusive";
  const roomAmtRaw = booking.roomTotal || 0;
  // Use the ACTUAL per-night rate charged for THIS booking (which may have
  // been negotiated/discounted at check-in, overriding the room's usual
  // rate) — not the room's static default — so the GST slab correctly
  // reflects what the guest is really being charged.
  const nights = booking.checkIn && booking.checkOut ? nts(booking.checkIn, booking.checkOut) : 1;
  const nightlyRate = nights > 0 ? roomAmtRaw / nights : (roomObj?.rate || 0);
  const specified = isSpecifiedPremises(allRooms);
  const supplyDate = booking.checkIn || todayStr();
  const overrides = (CURRENT_PROFILE && CURRENT_PROFILE.gstOverrides) || null;
  const hotelState = deriveStateFromGSTIN(CURRENT_PROFILE && CURRENT_PROFILE.hotelGstin);
  const ruleCtx = { nightlyRate, specifiedPremises: specified };

  const roomRule = resolveGSTRule("accommodation", ruleCtx, supplyDate, overrides);
  const foodRule = resolveGSTRule("restaurant", ruleCtx, supplyDate, overrides);
  const laundryRule = resolveGSTRule("laundry", ruleCtx, supplyDate, overrides);
  const transportRule = resolveGSTRule("transport", ruleCtx, supplyDate, overrides);
  const extraBedRule = resolveGSTRule("extra_bed", ruleCtx, supplyDate, overrides);
  const otherRule = resolveGSTRule("other_services", ruleCtx, supplyDate, overrides);

  let foodAmtRaw = 0, laundryAmtRaw = 0, transportAmtRaw = 0, extraBedAmtRaw = 0, otherAmtRaw = 0;
  (booking.charges || []).forEach(c => {
    const lineTotal = (c.price || 0) * (c.qty || 0);
    // Charges saved by older builds (and any future path that forgets to
    // copy the category) carry no `cat`. Without a fallback those lines
    // silently fell into "other services" and were taxed at 18% instead of
    // the restaurant rate — the totals still added up, so the mistake was
    // invisible on the bill while over-stating GST in the returns. Match
    // the item name against the menu to recover the correct category.
    const cat = chargeCat(c);
    if (cat === "🍛 Food" || cat === "☕ Beverages") { foodAmtRaw += lineTotal; return; }
    // Within "🛎️ Services", split further so each gets its OWN SAC/rate
    // instead of everything being lumped into one "Other Services @ 18%"
    // line — laundry, cab, and extra-bed each have their own GST
    // treatment per the rule master, and a real GST audit expects them
    // reported separately.
    const sub = chargeSub(c);
    if (sub === "laundry") laundryAmtRaw += lineTotal;
    else if (sub === "transport") transportAmtRaw += lineTotal;
    else if (sub === "extra_bed") extraBedAmtRaw += lineTotal;
    else otherAmtRaw += lineTotal; // genuinely uncategorized (e.g. Newspaper)
  });

  const splitInclusive = (amtRaw, rate) => {
    const base = amtRaw / (1 + rate);
    return { base: Math.round(base), gst: Math.round(amtRaw - base) };
  };
  const splitExclusive = (amtRaw, rate) => ({ base: amtRaw, gst: Math.round(amtRaw * rate) });
  const split = gstMode === "inclusive" ? splitInclusive : splitExclusive;

  const roomSplit = split(roomAmtRaw, roomRule.rate);
  const foodSplit = split(foodAmtRaw, foodRule.rate);
  const laundrySplit = split(laundryAmtRaw, laundryRule.rate);
  const transportSplit = split(transportAmtRaw, transportRule.rate);
  const extraBedSplit = split(extraBedAmtRaw, extraBedRule.rate);
  const otherSplit = split(otherAmtRaw, otherRule.rate);

  const roomCgstSgst = splitCgstSgst(roomSplit.gst);
  const foodCgstSgst = splitCgstSgst(foodSplit.gst);
  const laundryCgstSgst = splitCgstSgst(laundrySplit.gst);
  const transportCgstSgst = splitCgstSgst(transportSplit.gst);
  const extraBedCgstSgst = splitCgstSgst(extraBedSplit.gst);
  const otherCgstSgst = splitCgstSgst(otherSplit.gst);

  // "otherAmt"/"otherGST"/etc are kept as the AGGREGATE of every non-room,
  // non-food ancillary charge (laundry+transport+extra-bed+misc) — this is
  // what older UI (and any future code) reading G.otherAmt still sees, so
  // nothing that summed "food + other" for a total breaks. The granular
  // per-service fields below are what the itemised GST summary uses.
  const otherAmtAgg = laundrySplit.base + transportSplit.base + extraBedSplit.base + otherSplit.base;
  const otherGSTAgg = laundrySplit.gst + transportSplit.gst + extraBedSplit.gst + otherSplit.gst;
  const otherCgstAgg = laundryCgstSgst.cgst + transportCgstSgst.cgst + extraBedCgstSgst.cgst + otherCgstSgst.cgst;
  const otherSgstAgg = laundryCgstSgst.sgst + transportCgstSgst.sgst + extraBedCgstSgst.sgst + otherCgstSgst.sgst;

  const subtotal = roomSplit.base + foodSplit.base + otherAmtAgg;
  const totalGST = roomSplit.gst + foodSplit.gst + otherGSTAgg;
  const grandTotal = subtotal + totalGST;

  return {
    gstMode,
    roomAmt: roomSplit.base, roomGST: roomSplit.gst, roomGSTRate: roomRule.rate,
    roomCGST: roomCgstSgst.cgst, roomSGST: roomCgstSgst.sgst, roomSAC: roomRule.sac, roomRuleId: roomRule.id,
    foodAmt: foodSplit.base, foodGST: foodSplit.gst, foodGSTRate: foodRule.rate,
    foodCGST: foodCgstSgst.cgst, foodSGST: foodCgstSgst.sgst, foodSAC: foodRule.sac, foodRuleId: foodRule.id,
    laundryAmt: laundrySplit.base, laundryGST: laundrySplit.gst, laundryGSTRate: laundryRule.rate,
    laundryCGST: laundryCgstSgst.cgst, laundrySGST: laundryCgstSgst.sgst, laundrySAC: laundryRule.sac, laundryRuleId: laundryRule.id,
    transportAmt: transportSplit.base, transportGST: transportSplit.gst, transportGSTRate: transportRule.rate,
    transportCGST: transportCgstSgst.cgst, transportSGST: transportCgstSgst.sgst, transportSAC: transportRule.sac, transportRuleId: transportRule.id,
    extraBedAmt: extraBedSplit.base, extraBedGST: extraBedSplit.gst, extraBedGSTRate: extraBedRule.rate,
    extraBedCGST: extraBedCgstSgst.cgst, extraBedSGST: extraBedCgstSgst.sgst, extraBedSAC: extraBedRule.sac, extraBedRuleId: extraBedRule.id,
    otherAmt: otherAmtAgg, otherGST: otherGSTAgg, otherGSTRate: otherRule.rate,
    otherCGST: otherCgstAgg, otherSGST: otherSgstAgg, otherRuleId: otherRule.id,
    otherMiscAmt: otherSplit.base, otherMiscGST: otherSplit.gst, otherMiscSAC: otherRule.sac,
    subtotal, totalGST,
    totalCGST: roomCgstSgst.cgst + foodCgstSgst.cgst + otherCgstAgg,
    totalSGST: roomCgstSgst.sgst + foodCgstSgst.sgst + otherSgstAgg,
    // IGST is always 0 for the categories this app taxes — see the note
    // above GST_STATE_CODES for why (place-of-supply = the hotel's own
    // premises for accommodation/restaurant/ancillary services, which is
    // always the same state the hotel itself is registered in). Kept as
    // an explicit field, not omitted, so an invoice's tax table always has
    // a place to show IGST if a future line item genuinely needs it.
    totalIGST: 0,
    placeOfSupply: hotelState ? hotelState.name : null,
    placeOfSupplyCode: hotelState ? hotelState.code : null,
    grandTotal,
    specifiedPremises: specified
  };
}

// Per-line-item tax breakdown for the invoice's itemised table (one row
// per charge, each showing its OWN taxable value + CGST + SGST) — this is
// what a proper GST tax invoice under Rule 46 is expected to show, rather
// than only a category-level summary. Deliberately built ON TOP OF
// calcBillGST rather than re-resolving rates independently: G already
// carries the correct rate for each category (live-resolved for an active
// booking, or exactly what was frozen at checkout for a completed one),
// so every line here is guaranteed to use the SAME rate as the category
// totals shown elsewhere on the invoice and in GST exports — there is no
// second, divergent place a rate could go wrong.
// Note: summing these rounded per-line CGST/SGST will not always exactly
// equal G's own aggregate CGST/SGST (independent per-line rounding vs.
// category-level rounding can differ by ±1 on a handful of paise) — this
// is normal, expected behaviour on real GST invoices with multiple line
// items, and the invoice's own GRAND TOTAL always uses G's authoritative
// aggregate, never a re-sum of the displayed per-line figures.
function buildTaxedLineItems(booking, roomObj, allRooms) {
  const G = calcBillGST(booking, roomObj, allRooms);
  const splitInclusive = (amtRaw, rate) => {
    const base = amtRaw / (1 + rate);
    return { base: Math.round(base), gst: Math.round(amtRaw - base) };
  };
  const splitExclusive = (amtRaw, rate) => ({ base: amtRaw, gst: Math.round(amtRaw * rate) });
  const split = G.gstMode === "inclusive" ? splitInclusive : splitExclusive;

  const lines = [];
  const roomLineTotal = booking.roomTotal || 0;
  if (roomLineTotal > 0) {
    const s = split(roomLineTotal, G.roomGSTRate);
    const cs = splitCgstSgst(s.gst);
    const nights = booking.checkIn && booking.checkOut ? nts(booking.checkIn, booking.checkOut) : 1;
    lines.push({
      date: booking.checkIn || "", desc: "Room " + (booking.roomId || "") + (roomObj?.type ? " — " + roomObj.type : "") + " (" + nights + "N)",
      // "total" is what the guest actually pays for this line — that is
      // ALWAYS base+tax (s.base + s.gst), not the raw input amount. In
      // inclusive mode those are numerically the same as the raw amount
      // (tax was already embedded in it), but in exclusive mode the raw
      // amount is the PRE-tax base only — the payable total is base+tax
      // on top of it. Using the raw amount directly here would silently
      // under-state every line's total by its own tax amount whenever
      // the hotel uses exclusive pricing.
      sac: G.roomSAC, rate: G.roomGSTRate, taxable: s.base, cgst: cs.cgst, sgst: cs.sgst, total: s.base + s.gst
    });
  }
  (booking.charges || []).forEach(c => {
    const lineTotal = (c.price || 0) * (c.qty || 0);
    if (lineTotal <= 0) return;
    const cat = chargeCat(c);
    let rate, sac;
    if (cat === "🍛 Food" || cat === "☕ Beverages") { rate = G.foodGSTRate; sac = G.foodSAC; }
    else {
      const sub = chargeSub(c);
      if (sub === "laundry") { rate = G.laundryGSTRate; sac = G.laundrySAC; }
      else if (sub === "transport") { rate = G.transportGSTRate; sac = G.transportSAC; }
      else if (sub === "extra_bed") { rate = G.extraBedGSTRate; sac = G.extraBedSAC; }
      else { rate = G.otherGSTRate; sac = G.otherMiscSAC; }
    }
    const s = split(lineTotal, rate);
    const cs = splitCgstSgst(s.gst);
    const tag = chargeLabel(c);
    lines.push({
      // Each order shows the day it was actually placed (older charges,
      // saved before orders were time-stamped, keep the check-in date).
      date: c.date || booking.checkIn || "", desc: c.name + (c.qty > 1 ? " x" + c.qty : "") + (tag ? " (" + tag + ")" : ""),
      sac, rate, taxable: s.base, cgst: cs.cgst, sgst: cs.sgst, total: s.base + s.gst
    });
  });
  return { lines, G };
}

// ── GST INVOICE NUMBERING ────────────────────────────────────────
// Format: INV/{FY-start}-{FY-end}/{6-digit sequence}, e.g. INV/25-26/000001.
// Indian financial year runs 1 April – 31 March.
function currentFinancialYear(d) {
  const dt = d || new Date();
  const y = dt.getFullYear();
  const startY = (dt.getMonth() + 1) >= 4 ? y : y - 1; // month is 0-indexed
  return `${String(startY).slice(-2)}-${String(startY + 1).slice(-2)}`;
}

// Generates the next sequential document number for the current financial
// year under the given series prefix (e.g. "INV", "CN", "DN"). Uses a
// Firestore transaction (not a plain read-then-write) so two staff acting
// at the same moment on different devices can never receive the same
// number — a read-then-write via the normal WS.get/set path has no such
// guarantee. Each series (invoice/credit-note/debit-note) gets its own
// independent counter. Falls back to a timestamp-suffixed number when
// offline; still unique, just not perfectly sequential — matching how
// offline POS systems generally behave, and far better than a collision.
async function generateDocumentNumber(seriesPrefix) {
  const fy = currentFinancialYear();
  const counterKey = seriesPrefix.toLowerCase() + "Counter_" + fy;
  if (window._db) {
    try {
      const ref = WS._ref(counterKey);
      const next = await window._db.runTransaction(async (tx) => {
        const snap = await tx.get(ref);
        const current = (snap.exists && snap.data().value) || 0;
        const n = current + 1;
        tx.set(ref, { value: n });
        return n;
      });
      try { localStorage.setItem(`ab_${counterKey}`, JSON.stringify(next)); } catch {}
      return `${seriesPrefix}/${fy}/${String(next).padStart(6, "0")}`;
    } catch (e) {
      console.warn(seriesPrefix + " number transaction failed, using offline fallback:", e.message);
    }
  }
  // Offline fallback — last 6 digits of the epoch-ms timestamp keeps it
  // short while still being effectively unique per device.
  const fallbackSeq = String(Date.now()).slice(-6);
  return `${seriesPrefix}/${fy}/${fallbackSeq}*`; // trailing * marks an offline-issued number for later reconciliation
}
const generateInvoiceNumber = () => generateDocumentNumber("INV");
const generateCreditNoteNumber = () => generateDocumentNumber("CN");

// ── LICENSE EXPIRY CHECK — in-app reminder ──────────────────────
// Reads this hotel's own license status via /api/license-status (server
// reads Firestore with a service account, returns no PII) so the app itself can
// warn the hotel BEFORE their trial/subscription runs out, instead of
// them only finding out when scanning suddenly stops working.
async function checkLicenseExpiry() {
  const key = (localStorage.getItem("ab_license_key") || "").trim().toUpperCase();
  if (!key) return null;
  // Turns a Firestore document's `fields` object into this function's
  // return shape — shared by both the new per-document path and the old
  // array-scan fallback below, so the actual status logic exists once.
  const statusFromFields = f => {
    const expiry = f.expiry?.stringValue || null;
    const active = f.active?.booleanValue !== false;
    const plan = f.plan?.stringValue || "";
    const features = (f.features?.arrayValue?.values || []).map(x => x.stringValue).filter(Boolean);
    if (!active) return { status: "revoked", plan, features };
    if (!expiry) return { status: "ok", plan, features }; // no expiry set — nothing to warn about
    const daysLeft = Math.ceil((new Date(expiry + "T23:59:59") - new Date()) / 86400000);
    if (daysLeft < 0) return { status: "expired", plan, expiry, daysLeft, features };
    if (daysLeft <= 3) return { status: "expiring_soon", plan, expiry, daysLeft, features };
    return { status: "ok", plan, expiry, daysLeft, features };
  };
  // SECURITY (audit 2026-09): the server endpoint is now the primary
  // source. It reads with the service account and returns ONLY
  // active/plan/expiry/features — never the owner name or the registered
  // phones. The old code also fell back to downloading the legacy
  // `admin/licenses` document, i.e. EVERY hotel's record, onto every
  // hotel's device; that fallback is removed from the client entirely
  // (the endpoint does it server-side for unmigrated hotels).
  try {
    const r = await fetch("/api/license-status", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ licenseKey: key }),
      cache: "no-store"
    });
    if (r.ok) {
      const d = await r.json();
      if (d && d.found === true) {
        return statusFromFields({
          active: { booleanValue: d.active !== false },
          plan: { stringValue: typeof d.plan === "string" ? d.plan : "" },
          expiry: typeof d.expiry === "string" ? { stringValue: d.expiry } : undefined,
          features: { arrayValue: { values: (Array.isArray(d.features) ? d.features : []).filter(x => typeof x === "string").map(x => ({ stringValue: x })) } }
        });
      }
      if (d && d.found === false) return null; // not in cloud — don't alarm over a sync gap
    }
  } catch (e) { /* fall through to the transitional direct read */ }
  // Transitional fallback: this hotel's OWN document only. Works while the
  // pre-audit rules are still published; returns 403 (→ null, no banner)
  // once the hardened rules are live, which is the intended end state.
  try {
    const directUrl = `https://firestore.googleapis.com/v1/projects/atithibook-saas/databases/(default)/documents/licenses/${encodeURIComponent(key)}`;
    const directRes = await fetch(directUrl);
    if (directRes.ok) {
      const doc = await directRes.json();
      if (doc.fields?.key?.stringValue) return statusFromFields(doc.fields);
    }
  } catch (e) {
    console.warn("License expiry check:", e.message);
  }
  return null;
}
// Synced with App's `enabledFeatures` state — lets top-level functions (and
// components far from App) check feature gating without prop-drilling.
// Only features BizzSathi admin has switched ON for this hotel are shown.
// The last list the server returned is remembered on the device
// (ab_feat_cache, tied to the license key) so the app starts with the
// right features even before / without the network check. A device that
// has never received the list shows NO paid features until it does —
// it used to show everything ("fail-open"), which let hidden features
// appear on a new device or whenever the check failed.
const FeatCache = {
  _key() { try { return (localStorage.getItem("ab_license_key") || "").trim().toUpperCase(); } catch (e) { return ""; } },
  load() {
    try {
      const c = JSON.parse(localStorage.getItem("ab_feat_cache") || "null");
      const key = this._key();
      return c && key && c.key === key && Array.isArray(c.features) ? c.features.filter(x => typeof x === "string") : null;
    } catch (e) { return null; }
  },
  save(features) {
    try { localStorage.setItem("ab_feat_cache", JSON.stringify({ key: this._key(), features: Array.isArray(features) ? features : [], at: Date.now() })); } catch (e) {}
  }
};
let CURRENT_FEATURES = FeatCache.load() || []; // array = what this hotel may see
function hasFeature(id) {
  return Array.isArray(CURRENT_FEATURES) && CURRENT_FEATURES.includes(id);
}

// ── STORAGE GUARD (2026-10 login fix) ───────────────────────────────
// localStorage is only ~5–10 MB per site. Every check-in used to put the
// guest's ID photos there 3–4 times (inside the booking, as ab_img_img_*,
// as ab_img_front_*, and as a ph_* capture copy that was never read), so a
// busy hotel's phone filled up after a few dozen check-ins — and then ANY
// write failed, including the login screen's attempt counter ("Setting the
// value of 'ab_bf' exceeded the quota").
//   • ImgDB moves photo/signature images to IndexedDB (hundreds of MB).
//   • StorageGuard.migrate() moves existing images there on every start
//     (verify-then-delete: nothing is removed before the IndexedDB copy is
//     confirmed) and drops the never-read duplicates.
//   • StorageGuard.install() makes every localStorage.setItem self-healing:
//     on a quota error it frees space (never-read copies first, then local
//     copies of cloud documents) and retries once.
const ImgDB = {
  _p: null,
  open() {
    if (this._p) return this._p;
    this._p = new Promise((res, rej) => {
      try {
        if (!window.indexedDB) return rej(new Error("IndexedDB not available"));
        const r = indexedDB.open("atithibook_media", 1);
        r.onupgradeneeded = () => { try { r.result.createObjectStore("img"); } catch (e) {} };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error || new Error("IndexedDB open failed"));
        r.onblocked = () => rej(new Error("IndexedDB blocked"));
      } catch (e) { rej(e); }
    });
    this._p.catch(() => { this._p = null; });
    return this._p;
  },
  async get(k) {
    const db = await this.open();
    return new Promise((res, rej) => {
      try {
        const q = db.transaction("img", "readonly").objectStore("img").get(k);
        q.onsuccess = () => res(q.result == null ? null : q.result);
        q.onerror = () => rej(q.error);
      } catch (e) { rej(e); }
    });
  },
  async put(k, v) {
    const db = await this.open();
    return new Promise((res, rej) => {
      try {
        const tx = db.transaction("img", "readwrite");
        tx.objectStore("img").put(v, k);
        tx.oncomplete = () => res(true);
        tx.onerror = () => rej(tx.error || new Error("IndexedDB write failed"));
        tx.onabort = () => rej(tx.error || new Error("IndexedDB write aborted"));
      } catch (e) { rej(e); }
    });
  },
  async del(k) {
    const db = await this.open();
    return new Promise(res => {
      try { const tx = db.transaction("img", "readwrite"); tx.objectStore("img").delete(k); tx.oncomplete = () => res(true); tx.onerror = () => res(false); } catch (e) { res(false); }
    });
  }
};
const StorageGuard = {
  isQuota(e) {
    return !!e && (e.name === "QuotaExceededError" || e.name === "NS_ERROR_DOM_QUOTA_REACHED" || e.code === 22 || e.code === 1014 || /quota/i.test(String(e.message || "")));
  },
  keys() {
    const out = [];
    try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k != null) out.push(k); } } catch (e) {}
    return out;
  },
  hasSpace() {
    try { localStorage.setItem("__ab_probe", "x".repeat(20000)); localStorage.removeItem("__ab_probe"); return true; } catch (e) { try { localStorage.removeItem("__ab_probe"); } catch (x) {} return false; }
  },
  usedBytes() {
    let n = 0;
    this.keys().forEach(k => { try { n += (k.length + (localStorage.getItem(k) || "").length) * 2; } catch (e) {} });
    return n;
  },
  // Synchronous emergency clean-up (setItem is synchronous). Removes only
  // data that is never read back, or that is a local copy of a cloud
  // document the app re-downloads when needed. Returns true if it freed
  // anything. `keep` is the key being written — never removed.
  freeSync(keep) {
    let freed = 0;
    const rm = k => {
      if (k === keep) return;
      try { const v = localStorage.getItem(k); localStorage.removeItem(k); freed += k.length + (v ? v.length : 0); } catch (e) {}
    };
    const ks = this.keys();
    // 1. capture-time photo copies (ph_f_* / ph_b_*) — written, never read.
    ks.filter(k => /^ph_[fb]_/.test(k)).forEach(rm);
    // 2. ab_img_front_/back_* — a second copy of ab_img_img_front_/back_*
    //    that nothing reads. Removed only when that other copy is present.
    ks.forEach(k => {
      const m = /^ab_img_(front|back)_(.+)$/.exec(k);
      if (m && localStorage.getItem("ab_img_img_" + m[1] + "_" + m[2]) != null) rm(k);
    });
    if (freed > 0) return true;
    // 3. local copies of cloud documents: archived months and earlier days'
    //    restaurant bills (both re-fetched from the cloud when opened).
    const todayBills = "ab_rbills_" + localDateStr().replace(/-/g, "_");
    ks.filter(k => /^ab_bookings_archive_/.test(k) || (/^ab_rbills_/.test(k) && k !== todayBills)).forEach(rm);
    if (freed > 0) return true;
    // 4. last resort — same rule the app already applies when saving
    //    bookings: photos of guests who checked out more than 3 days ago
    //    are dropped from the local booking list (the vault copy lives in
    //    IndexedDB; the cloud never had photos).
    try {
      if (keep !== "ab_bookings") {
        const raw = localStorage.getItem("ab_bookings");
        if (raw && raw.length > 50000) {
          const cutoff = Date.now() - 3 * 86400000;
          const list = JSON.parse(raw);
          if (Array.isArray(list)) {
            const slim = list.map(b => {
              if (!(b && b.status === "checkedout" && b.checkOutActual && new Date(b.checkOutActual).getTime() < cutoff)) return b;
              const { photoFront, photoBack, signature, ...rest } = b;
              return { ...rest, family: Array.isArray(b.family) ? b.family.map(m => { const { photoFront: a, photoBack: c, ...r } = m || {}; return r; }) : b.family };
            });
            const s = JSON.stringify(slim);
            if (s.length < raw.length) { StorageGuard._origSet.call(localStorage, "ab_bookings", s); freed += raw.length - s.length; }
          }
        }
      }
    } catch (e) {}
    return freed > 0;
  },
  _origSet: null,
  install() {
    if (this._origSet) return;
    try {
      const proto = Object.getPrototypeOf(window.localStorage);
      const orig = proto.setItem;
      this._origSet = orig;
      const guard = this;
      proto.setItem = function (k, v) {
        try { return orig.call(this, k, v); } catch (e) {
          if (this !== window.localStorage || !guard.isQuota(e) || guard._busy) throw e;
          guard._busy = true;
          let ok = false;
          try { ok = guard.freeSync(String(k)); } finally { guard._busy = false; }
          guard.migrate().catch(() => {});
          if (ok) return orig.call(this, k, v);
          throw e;
        }
      };
    } catch (e) { console.warn("[AtithiBook] StorageGuard install:", e.message); }
  },
  // Moves every image out of localStorage into IndexedDB. Each image is
  // deleted from localStorage only after IndexedDB confirms the write.
  _mig: null,
  migrate() {
    if (this._mig) return this._mig;
    this._mig = (async () => {
      let moved = 0;
      try { await ImgDB.open(); } catch (e) { return 0; }
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
      for (const k of this.keys()) {
        if (/^ph_[fb]_/.test(k)) { try { localStorage.removeItem(k); } catch (e) {} continue; }
        let m, target = null;
        if ((m = /^ab_img_(img_front_|img_back_|sig_)(.+)$/.exec(k))) target = m[1] + m[2];
        else if ((m = /^ab_img_(front|back)_(.+)$/.exec(k))) target = "img_" + m[1] + "_" + m[2];
        if (!target) continue;
        try {
          const v = localStorage.getItem(k);
          if (v) {
            const have = await ImgDB.get(target);
            if (!have) await ImgDB.put(target, v);
            if (!(await ImgDB.get(target))) continue; // not confirmed — keep it
          }
          localStorage.removeItem(k);
          moved++;
        } catch (e) { /* keep in localStorage, try again next start */ }
      }
      if (moved) console.info("[AtithiBook] moved " + moved + " image(s) to IndexedDB");
      return moved;
    })().finally(() => { setTimeout(() => { StorageGuard._mig = null; }, 0); });
    return this._mig;
  }
};
StorageGuard.install();
setTimeout(() => { StorageGuard.migrate().catch(() => {}); }, 0);

// ── BRUTE FORCE PROTECTION ───────────────────────
const BruteForce = {
  MAX: 5,
  LOCK_MS: 15 * 60 * 1000,
  check() {
    let d = {};
    try { d = JSON.parse(localStorage.getItem("ab_bf") || "{}") || {}; } catch (e) { d = {}; }
    if (d.until && Date.now() < d.until) {
      const m = Math.ceil((d.until - Date.now()) / 60000);
      throw new Error(`Too many attempts. Try after ${m} min.`);
    }
    return d.attempts || 0;
  },
  fail(n) {
    const a = n + 1;
    const d = {
      attempts: a
    };
    if (a >= this.MAX) d.until = Date.now() + this.LOCK_MS;
    // A full phone storage must never hide the real "wrong password" message.
    try { localStorage.setItem("ab_bf", JSON.stringify(d)); } catch (e) { console.warn("BruteForce save:", e.message); }
    return this.MAX - a;
  },
  clear() {
    try { localStorage.removeItem("ab_bf"); } catch (e) {}
  }
};

// ── HTML ESCAPE — prevents stored XSS in invoice/print/innerHTML ──
const escHtml = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
// Safe for embedding a JS value INSIDE a script tag inside a
// generated HTML string (e.g. `var x = ${jsonForScript(guestName)};`).
// Plain JSON.stringify does NOT escape "/", so if the value contains the
// literal closing-script-tag sequence — trivially possible for anything
// sourced from a free-text field like a guest's name at check-in — the
// browser's HTML PARSER (which scans for that exact byte sequence
// regardless of JS string-quoting context) would end the surrounding
// script tag early and start executing whatever follows as markup or
// script. Escaping "<" to its unicode form breaks that sequence while
// still round-tripping to the exact same string once JS parses it back.
// CSV/Excel formula-injection guard: a cell that starts with = + - @ (or
// tab/CR) is executed as a formula by Excel/Sheets. Prefix it with ' so it
// opens as text — but leave plain numbers/phone numbers ("+91 98...",
// "-500") readable as they are.
const csvSafeText = v => {
  const t = v === null || v === undefined ? "" : String(v);
  if (/^[=+\-@\t\r]/.test(t) && !/^[+-]?[\d][\d\s().-]*$/.test(t)) return "'" + t;
  return t;
};
const jsonForScript = v => JSON.stringify(v).replace(/</g, "\\u003c");

// ── SIMPLE INDEXEDDB HELPERS — FileSystemDirectoryHandle objects can't be
// stored in localStorage (not JSON-serializable), but IndexedDB supports
// storing them via structured clone. This is what lets folder access
// SURVIVE a page reload instead of silently failing.
const idbOpen = () => new Promise((res, rej) => {
  const req = indexedDB.open("atithibook_fs", 1);
  req.onupgradeneeded = () => req.result.createObjectStore("handles");
  req.onsuccess = () => res(req.result);
  req.onerror = () => rej(req.error);
});
const idbSet = async (key, val) => {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction("handles", "readwrite");
    tx.objectStore("handles").put(val, key);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
};
const idbGet = async key => {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction("handles", "readonly");
    const req = tx.objectStore("handles").get(key);
    req.onsuccess = () => res(req.result || null);
    req.onerror = () => rej(req.error);
  });
};

// ── LOCAL FILE SYSTEM STORAGE ────────────────────────────────
// Uses File System Access API — Chrome/Edge desktop support
// Converts a base64 data URL directly to a Blob WITHOUT using fetch().
// We used to do `fetch(dataUrl).then(r => r.blob())`, but this app's
// service worker intercepts EVERY fetch() call (including data: URLs) for
// offline caching — that interception was silently corrupting/emptying the
// resulting blob, which is exactly why files saved to the local folder
// were opening as blank. This atob()-based conversion never touches
// fetch() or the service worker at all, so it can't be affected by it.
function dataURLtoBlob(dataUrl) {
  const [header, base64] = dataUrl.split(",");
  const mimeMatch = header.match(/data:([^;]+)/);
  const mime = mimeMatch ? mimeMatch[1] : "image/jpeg";
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  return new Blob([bytes], { type: mime });
}

const LocalFS = {
  _dirHandle: null,
  // Check if File System Access API is supported
  isSupported() {
    return "showDirectoryPicker" in window;
  },
  // Ask user to select a folder once — the handle is saved to IndexedDB so
  // it survives page reloads. Browsers that grant persistent permission for
  // installed PWAs will then need NO further prompts at all; others may
  // need one silent permission re-confirmation (see restoreHandle below),
  // but never the broken mid-flow re-prompt this used to fall back to.
  async selectFolder() {
    try {
      const handle = await window.showDirectoryPicker({
        mode: "readwrite",
        startIn: "documents",
        id: "atithibook-records"
      });
      // Defensive check: the folder picker remembers the last-used location
      // (via the "id" option above), which makes it easy to accidentally
      // re-select an already-nested month/booking folder instead of
      // navigating back up to the true root — exactly what caused folders
      // like test/2026-08/2026-08/2026-08 to appear. Warn if this looks
      // like it's happening again.
      const looksLikeMonthFolder = /^\d{4}-\d{2}$/.test(handle.name);
      let looksLikeItAlreadyHasBookings = false;
      try {
        for await (const entry of handle.values()) {
          if (entry.kind === "directory" && (/^(CHK|BK)/i.test(entry.name) || /^\d{4}-\d{2}$/.test(entry.name))) {
            looksLikeItAlreadyHasBookings = true;
            break;
          }
        }
      } catch (e) {}
      if (looksLikeMonthFolder || looksLikeItAlreadyHasBookings) {
        const proceed = confirm(
          "⚠️ Yeh folder ('" + handle.name + "') already ek month ya booking folder jaisa lag raha hai।\n\n" +
          "Aapko apna MAIN/ROOT folder select karna chahiye (jaise 'test' ya 'AtithiBook Records'), " +
          "us folder ke ANDAR ki koi month folder nahi।\n\n" +
          "Agar aap sure ho ki yeh sahi hai, OK dabao। Warna Cancel karke sahi (upar wali) folder select karo।"
        );
        if (!proceed) return null;
      }
      this._dirHandle = handle;
      localStorage.setItem("ab_local_folder", this._dirHandle.name);
      await idbSet("dirHandle", this._dirHandle).catch(e => console.warn("IDB save:", e.message));
      return this._dirHandle.name;
    } catch (e) {
      if (e.name !== "AbortError") console.warn("Folder select:", e.message);
      return null;
    }
  },
  // Try to restore the handle saved from a PREVIOUS session. Checking
  // permission status (queryPermission) does NOT require a fresh user
  // gesture — only requesting NEW permission does — so this can safely run
  // automatically on app boot / Storage tab open, well before any check-in
  // flow needs it. Returns true if usable without any further prompt.
  async restoreHandle() {
    if (this._dirHandle) return true;
    try {
      const handle = await idbGet("dirHandle");
      if (!handle) return false;
      const perm = await handle.queryPermission({ mode: "readwrite" });
      if (perm === "granted") {
        this._dirHandle = handle;
        return true;
      }
      // Not yet granted for this session — caller can show a button that
      // calls requestPermissionOnClick() from a real user gesture.
      this._pendingHandle = handle;
      return false;
    } catch (e) {
      console.warn("Restore handle:", e.message);
      return false;
    }
  },
  // Must be called directly from a click handler (real user gesture) —
  // re-requests permission on the handle restored from IndexedDB, WITHOUT
  // showing the folder picker again (same folder, just re-confirming access).
  async requestPermissionOnClick() {
    const handle = this._pendingHandle || this._dirHandle;
    if (!handle) return false;
    try {
      const perm = await handle.requestPermission({ mode: "readwrite" });
      if (perm === "granted") {
        this._dirHandle = handle;
        this._pendingHandle = null;
        return true;
      }
      return false;
    } catch (e) {
      console.warn("Request permission:", e.message);
      return false;
    }
  },
  // Save a complete check-in record to local folder
  async saveCheckIn(booking, photoF, photoB) {
    if (!this._dirHandle) {
      // Try the IndexedDB-restored handle first (works without any prompt
      // if permission is still granted) before giving up. We deliberately
      // do NOT call showDirectoryPicker() here anymore — by this point
      // several awaits (saveRooms, saveBk) have already run since the
      // "Confirm Check-In" click, so the browser's required fresh user
      // gesture for that API has very likely expired, which is exactly why
      // saves were silently failing after every page reload.
      const restored = await this.restoreHandle();
      if (!restored) return false;

    try {
      // Re-check permission is still valid before writing (handles a
      // rare case where OS-level access was revoked outside the browser)
      const perm = await this._dirHandle.queryPermission({ mode: "readwrite" });
      if (perm !== "granted") return false;
      // Create month folder: 2025-05
      const month = new Date().toISOString().slice(0, 7);
      const monthDir = await this._dirHandle.getDirectoryHandle(month, {
        create: true

        })),
        savedAt: new Date().toISOString(),

      };
      const jsonFile = await bookingDir.getFileHandle("guest_details.json", {
        create: true
      });
      const jsonWriter = await jsonFile.createWritable();
      await jsonWriter.write(JSON.stringify(details, null, 2));

      // Save Aadhaar front photo

      // Save Aadhaar back photo
      if (photoB && photoB.startsWith("data:")) {
        const backFile = await bookingDir.getFileHandle("aadhaar_back.jpg", {
          create: true
        });
        const backWriter = await backFile.createWritable();
        const blob = dataURLtoBlob(photoB);
        await backWriter.write(blob);
        await backWriter.close();
      }

      // Save family member ID photos — BOTH sides, same booking folder
      // (no separate transaction, just extra files inside CHK001_.../ )
      if (Array.isArray(booking.family)) {
        for (let i = 0; i < booking.family.length; i++) {
          const m = booking.family[i];
          const safeName = (m.name || "Member" + (i + 1)).replace(/[^a-zA-Z0-9]/g, "").slice(0, 15);
          if (m.photoFront && m.photoFront.startsWith("data:")) {
            const frontFile = await bookingDir.getFileHandle(`family_${i + 1}_${safeName}_front.jpg`, {
              create: true
            });
            const frontWriter = await frontFile.createWritable();
            const blob = dataURLtoBlob(m.photoFront);
            await frontWriter.write(blob);
            await frontWriter.close();
          }
          if (m.photoBack && m.photoBack.startsWith("data:")) {
            const backFile = await bookingDir.getFileHandle(`family_${i + 1}_${safeName}_back.jpg`, {
              create: true
            });
            const backWriter = await backFile.createWritable();
            const blob = dataURLtoBlob(m.photoBack);
            await backWriter.write(blob);
            await backWriter.close();
          }
        }
      }
      console.log("✅ Saved locally:", folderName);
      return folderName;
    } catch (e) {
      console.warn("Local save failed:", e.message);
      return false;
    }
  },
  // Export all records as ZIP download (fallback for mobile/Firefox)
  async downloadRecord(booking, photoF, photoB) {

const AuditLog = {
  add(action, detail = "") {
    try {
      const logs = JSON.parse(localStorage.getItem("ab_audit") || "[]");
      logs.push({
        ts: new Date().toISOString(),
        action,
        detail: String(detail).slice(0, 100),
        user: AUDIT_USER || "unknown"
      });
      if (logs.length > 500) logs.splice(0, 100); // keep last 500
      localStorage.setItem("ab_audit", JSON.stringify(logs));
      // Slight delay avoids this write landing in the SAME instant as the
      // rooms/bookings writes that usually happen right alongside an
      // audit-logged action (e.g. check-in) — concurrent writes are a
      // known trigger for a longstanding Firestore SDK internal bug.
      setTimeout(() => CloudSync.audit(logs), 300);
    } catch (e) {}
  },
  get() {
    try {
      return JSON.parse(localStorage.getItem("ab_audit") || "[]");
    } catch {
      return [];
    }
  },
  export() {
    const logs = this.get();
    const cell = v => { const t = csvSafeText(v); return /[",\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
    const csv = ["Timestamp,Action,User,Detail", ...logs.map(l => [l.ts, l.action, l.user, l.detail].map(cell).join(","))].join("\n");
    const a = document.createElement("a");
    a.href = "data:text/csv;charset=utf-8," + encodeURIComponent(csv);
    a.download = "atithibook_audit_" + new Date().toISOString().slice(0, 10) + ".csv";
    a.click();
  }
};

  push(0x1d, 0x21, 0x00);

// Web Bluetooth: common BLE thermal-printer services (generic 18F0, ISSC
// transparent UART, "printer" FF00/FFE0, Xprinter E7810A71…).
const BT_PRINTER_SERVICES = [
  0x18f0, 0xff00, 0xffe0, 0xfee7, 0xae30, 0xae3a,
  "000018f0-0000-1000-8000-00805f9b34fb",
  "49535343-fe7d-4ae5-8fa9-9fafd205e455",
  "e7810a71-73ae-499d-8c15-faa9aef0c3f2"
];
const BtPrinter = {
  device: null, chr: null,
  async pair() {
    const dev = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: BT_PRINTER_SERVICES });
    BtPrinter.device = dev; BtPrinter.chr = null;
    await BtPrinter.connect();
    KotPrinter.set({ mode: "bluetooth", btName: dev.name || "Bluetooth printer", btId: dev.id || "" });
    return dev.name || "Bluetooth printer";
  },
  // Re-find the paired printer after a reload without asking again, where
  // the browser supports remembered devices (getDevices).
  async restore() {
    if (BtPrinter.device) return BtPrinter.device;
    const saved = KotPrinter.get();
    if (!navigator.bluetooth || !navigator.bluetooth.getDevices) return null;
    try {
      const list = await navigator.bluetooth.getDevices();
      BtPrinter.device = list.find(d => d.id === saved.btId) || list.find(d => d.name && d.name === saved.btName) || null;

    const dev = BtPrinter.device;

    if (BtPrinter.chr) return BtPrinter.chr;
    const services = await server.getPrimaryServices();
    for (const s of services) {
      let chars = [];
      try { chars = await s.getCharacteristics(); } catch (e) { continue; }
      const c = chars.find(x => x.properties.writeWithoutResponse) || chars.find(x => x.properties.write);

    }

  },
  async write(u8) {
    if (!(await BtPrinter.restore())) throw new Error("Printer pair nahi hai — Settings me 'Printer jodo' dabao");

    for (let i = 0; i < u8.length; i += chunk) {
      const part = u8.slice(i, i + chunk);

    }
  }

function calcRestaurantBill(items) {

  const overrides = (CURRENT_PROFILE && CURRENT_PROFILE.gstOverrides) || null;
  const rule = resolveGSTRule("restaurant", { nightlyRate: 0, specifiedPremises: specified }, localDateStr(), overrides);
  const inclusive = (CURRENT_PROFILE && CURRENT_PROFILE.gstMode) === "inclusive";
  const amtRaw = (items || []).reduce((s, i) => s + (Number(i.price) || 0) * (Number(i.qty) || 0), 0);
  const base = inclusive ? Math.round(amtRaw / (1 + rule.rate)) : amtRaw;
  const gst = inclusive ? Math.round(amtRaw - amtRaw / (1 + rule.rate)) : Math.round(amtRaw * rule.rate);

const RestaurantBills = {

  async list(dateStr) {
    const k = this.key(dateStr);

    try { const v = JSON.parse(localStorage.getItem("ab_" + k) || "[]"); return Array.isArray(v) ? v : []; } catch (e) { return []; }

  async append(bill) {
    const k = this.key(bill.date);

          const snap = await tx.get(ref);
          const cur = (snap.exists && Array.isArray(snap.data().value)) ? snap.data().value : [];
